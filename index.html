      piaciuto ai valutatori &mdash; da l&igrave; nasce l'accondiscendenza, non da una volont&agrave; di
      compiacervi; la raccogli nel Modulo 5. Secondo: i dati sintetici sono la stessa cosa che
      facciamo noi generando le schede finte delle demo di oggi.
      Fonti: Brown (2020) per GPT-3; Ouyang (2022) per i tre numeri; Llama 3 (2024) per la striscia
      "Oggi"; Christiano (2017) per il feedback umano.
    </aside>
  </section>

  <section>
    <h2>&quot;Ragionamento&quot;: addestrato o indotto</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">dentro</span> Addestrato</h4>
          <p>Addestrato con apprendimento per rinforzo a deliberare prima di rispondere: autoverifica e ripensamenti <strong>emergono dall'addestramento</strong>, non da un'istruzione.</p>
          <p class="ask">&rarr; le versioni &laquo;thinking&raquo; di ChatGPT, Claude, Gemini e Copilot; DeepSeek-R1 &egrave; quella con il rendiconto pubblico</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">intorno</span> Indotto</h4>
          <p>Lo si chiede nel prompt: &laquo;elenca prima i criteri, poi decidi&raquo;.</p>
          <p class="ask">&rarr; gratis, su qualsiasi modello, anche gratuito</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="reason-widget" data-reason-widget>
          <div class="mode-buttons">
            <button type="button" data-mode="trained" aria-pressed="true">Addestrato</button>
            <button type="button" data-mode="prompted" aria-pressed="false">Indotto</button>
          </div>
          <div class="reason-diagram" data-reason-diagram></div>
          <p class="reason-copy" data-reason-copy></p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>L'interruttore non inietta un prompt: <strong>attiva una modalit&agrave; del modello</strong> &mdash; e oggi &egrave; il modello stesso a decidere quanto pensare. Istruzioni scritte, liste di task e cicli esistono, ma sono impalcatura: modulo 4.</p>
    </div>
    <div class="takeaway">I passaggi visibili sono testo prodotto, non il verbale di come ci &egrave; arrivato.</div>
    <p class="footnote">Ci&ograve; che scorre a schermo &egrave; un riassunto generato dal modello, non la traccia interna (OpenAI).</p>
    <aside class="notes">
      Due sono ragionamento, la terza no: in sala vengono confuse tutte e tre.
      (1) INDOTTO: lo chiedi nel prompt, il modello scrive i passaggi come normale output; nessun
      cambiamento al modello. (2) IMPALCATURA: system prompt, file di istruzioni e personalit&agrave;
      letti a ogni richiesta, liste di task, cicli, strumenti &mdash; esiste davvero, ma &egrave;
      il modulo 4, e non &egrave; ci&ograve; che rende &quot;di ragionamento&quot; un modello.
      (3) ADDESTRATO: apprendimento per rinforzo, la capacit&agrave; sta nei pesi. DeepSeek-R1 lo
      dimostra pubblicamente: RL puro, senza tracce di ragionamento scritte da umani, e
      autoverifica, verifica e cambio di strategia emergono dall'addestramento. OpenAI dice lo stesso
      di o1: &quot;our large-scale reinforcement learning algorithm teaches the model how to think
      productively using its chain of thought&quot;.
      Se ti chiedono cosa fa il pulsante: non inietta istruzioni, attiva una modalit&agrave; tecnica.
      Su Claude era un budget di token di pensiero (parametro thinking + budget_tokens, fino alla
      4.6); dalla 4.7 quel parametro &egrave; stato rimosso e sostituito da adaptive thinking con un
      livello di sforzo &mdash; il modello decide da s&eacute; se e quanto pensare. Su ChatGPT scegliere
      la versione &quot;thinking&quot; instrada su un modello diverso. I numeri di versione invecchiano
      in settimane: tienili qui, non a schermo, e controlla la data di edizione del deck.
      Perch&eacute; il takeaway: Turpin et al. (2023) hanno infilato un indizio orientante nell'input
      (per esempio la risposta corretta sempre nella stessa posizione); i modelli si facevano orientare,
      sbagliavano, e nella catena non nominavano mai l'indizio &mdash; costruivano una giustificazione
      plausibile per la risposta sbagliata, fino a -36% di accuratezza su 13 compiti. L'indizio &egrave;
      lo strumento di misura, non un consiglio per la platea: non metterlo a schermo.
      Questa slide &egrave; il primo deposito della vigilanza che raccogli in M5 (item &quot;la fluidit&agrave;
      non &egrave; prova di accuratezza&quot;). La demo m2 la fa atterrare: l'interruttore &egrave; il tipo
      addestrato, &quot;elenca prima i criteri&quot; &egrave; quello indotto.
      Fonti: DeepSeek-R1 (2025); OpenAI, Learning to reason with LLMs (2024); Turpin et al. (2023);
      Wei et al. (2022); Nye et al. (2021).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Un agente = modello + ciclo + strumenti + memoria</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-agent-loop.png" alt="Processore LLM centrale avvolto da un ciclo agentico di azioni, strumenti, memoria e osservazione">
      </div>

      strumenti, memoria. Qui quella definizione diventa una cosa che si compra e si installa. Se
      qualcuno chiede la differenza in una riga: un chatbot risponde giro per giro, un sistema
      agentico insegue un obiettivo pi&ugrave; lungo di un giro.
    </aside>
  </section>

  <section>
    <h2>MCP &mdash; come arriva ai sistemi dell'azienda</h2>
    <p class="quote-line">&laquo;MCP &egrave; come una porta USB-C per le applicazioni di IA: come l'USB-C offre un modo standardizzato di collegare dispositivi elettronici, MCP offre un modo standardizzato di collegare le applicazioni di IA a sistemi esterni.&raquo; <span class="attrib">&mdash; documentazione ufficiale MCP</span></p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-mxn-convention.png" alt="Agenti e server che scambiano buste di messaggi comuni attraverso un'unica corsia di protocollo condiviso">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Scopre</strong><span>Il connettore dichiara che cosa sa fare.</span></div>
        <div class="mini-card"><strong>Chiama</strong><span>L'agente invia una richiesta strutturata.</span></div>
        <div class="mini-card"><strong>Restituisce</strong><span>Il risultato torna come nuovo contesto.</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <p>Senza uno standard, <strong>n</strong> applicazioni e <strong>m</strong> strumenti richiedono <strong>n&times;m</strong> integrazioni su misura. Con un protocollo unico ne bastano <strong>n+m</strong> &mdash; e i sistemi che l'azienda ha gi&agrave; non vanno rifatti per essere raggiungibili. Sposta richieste e risultati: non mette insieme i dati.</p>
    </div>
    <p class="footnote">Le stesse domande di qualsiasi integrazione: credenziali di chi, con quale perimetro, con quanta fiducia.</p>
    <aside class="notes">
      Finestra dal vivo, circa due minuti: l'elenco dei connettori aperto in due prodotti diversi,
      niente di pi&ugrave;. Serve a far vedere che non &egrave; una cosa di un fornitore solo.
      La citazione &egrave; letterale e sta nella documentazione ufficiale del protocollo: "Think of
      MCP like a USB-C port for AI applications." Va detta come citazione, non come nostra trovata.
      Il conto n&times;m &rarr; n+m &egrave; il meccanismo, la porta USB-C ne &egrave; l'illustrazione:
      se qualcuno vuole un numero, cinque applicazioni e sei strumenti fanno trenta integrazioni su
      misura contro undici.
      Cronologia, se serve rispondere a "e se cambiano idea?": protocollo aperto pubblicato il 25
      novembre 2024, adottato da OpenAI a marzo 2025 e da Google ad aprile 2025, e donato il 9
      dicembre 2025 alla Agentic AI Foundation, fondo diretto della Linux Foundation co-fondato con
      OpenAI e Block. Non &egrave; pi&ugrave; governato da una sola azienda. Non avvicinarti alla
      specifica tecnica.
      La frase che conta sul piano commerciale &egrave; quella nella card: i loro sistemi attuali non
      vanno rifatti per essere raggiungibili.
      Le tre mosse sono il meccanismo. La terza lega il modulo al modulo 3: il risultato di uno
      strumento non &laquo;entra nel modello&raquo;, torna sulla scrivania come contesto nuovo.
      Pianta qui il seme del rischio: ogni connettore &egrave; anche una superficie d'attacco. Il
      modulo 5 si apre sfruttando esattamente questo.
      Fonti: modelcontextprotocol.io; anthropic.com/news/model-context-protocol;
      anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation.
    </aside>
  </section>

  <section class="practice-slide" data-background-color="#f4f8fb">
    <h2>Specifica, verifica, e limiti fuori dal modello</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>1. La specifica resta di chi commissiona</h4>
          <p>Ogni grado di libert&agrave; lasciato aperto viene chiuso con un default plausibile, preso dalla distribuzione dell'addestramento e non dal caso in esame. Specificare significa elencare che cosa <strong>non</strong> si lascia decidere allo strumento, a partire da quale <em>decisione</em> il lavoro deve permettere.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>2. La verifica va contro la fonte</h4>
          <p>Il criterio si fissa <strong>prima</strong> della generazione, il controllo si esegue <strong>dopo</strong>, sul documento di origine e non sull'output. Un criterio formulato dopo aver letto la risposta si adatta alla risposta.</p>
        </div>
      </div>
      <div class="col stack-sm">
        <p>I tre livelli si scelgono per <strong>reversibilit&agrave; e costo dell'errore</strong>, non per gravit&agrave; percepita, e si applicano allo strumento, non al prompt.</p>
        <div class="caption-row" style="grid-template-columns:1fr;">
          <div class="mini-card"><strong>Fai sempre</strong><span>Reversibile, costo basso: procede da solo.</span></div>
          <div class="mini-card"><strong>Chiedi prima</strong><span>Reversibile ma costoso: conferma obbligatoria prima di agire.</span></div>
          <div class="mini-card"><strong>Non fare mai</strong><span>Irreversibile: bloccato allo strumento, fuori dalla portata del modello.</span></div>
        </div>
      </div>
    </div>
    <aside class="notes">
      Questa slide non introduce niente: d&agrave; il nome a tre cose che la demo ha appena fatto
      succedere. Il punto 1 &egrave; la sesta battuta (i criteri dichiarati a voce prima di lanciare),
      il punto 2 &egrave; l'ottava (la tabella verificata contro i PDF), il punto 3 &egrave; la quarta
      (le regole della casa scavalcate). Se la demo &egrave; andata, qui basta indicare.
      La riga sopra i tre livelli era una quarta card: toglila dal parlato, si legge da sola.
      Il criterio dei tre livelli &egrave; reversibilit&agrave; e costo, non gravit&agrave; percepita:
      mandare una mail sbagliata &egrave; irreversibile e va nella terza riga anche se sembra
      un'inezia, mentre riscrivere una bozza &egrave; reversibile e va nella prima anche se il testo
      &egrave; importante. Fai fare l'esercizio a voce con un compito loro.
      Tesi di Karpathy sull'automazione: il software tradizionale automatizza ci&ograve; che si sa
      specificare; gli LLM automatizzano ci&ograve; che si sa VERIFICARE, quindi conviene rendere
      verificabile il proprio lavoro. Cherny, creatore di Claude Code: "dai a Claude un modo di
      verificare il proprio lavoro e raddoppi o triplichi la qualit&agrave;" &mdash; presentala come
      stima di un professionista, non come misura. Shankar et al. (UIST 2024) sulla deriva dei
      criteri: valutare output reali cambia i criteri, quindi specifica e verifica si alimentano a
      vicenda; &egrave; un ciclo, non una catena di montaggio.
      L'aneddoto da raccontare, ed &egrave; il contenuto migliore che hai qui: l'agente di Karpathy
      associava i pagamenti agli account tramite l'indirizzo email invece di un identificativo
      stabile. Codice plausibile, progetto sbagliato, colto solo dal giudizio umano &mdash; e nessuna
      rilettura del codice riga per riga lo avrebbe trovato, perch&eacute; ogni riga era corretta.
      Consegna al modulo 5: la prosa vive nel contesto, e il contesto si pu&ograve; manipolare.
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">modello</span> Che cosa sbaglia il modello</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Allucinazione</h4>
        <p>Fluente, sicura, falsa. Strutturale, non un difetto: si riduce ancorandola ai documenti e verificandola. Non si elimina.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Distorsione</h4>
        <p>Senza riferimenti propri restituisce la media del gi&agrave; scritto: le parole, gli schemi e le strutture di cui il web &egrave; pieno.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Accondiscendenza</h4>
        <p>Se la si contesta, ritratta: anche quando aveva ragione. Il rifinimento premia le risposte che le persone approvano.</p>
      </div>
    </div>
    <div class="banner-media">
      <img src="assets/img/m05-plausible-path.png" alt="Molte tracce sottili che si intrecciano in un unico tratto ambrato deciso, mentre alcune si staccano e sbiadiscono">
    </div>
    <p class="footnote">Le prime due vengono dal motore del Modulo 1 &mdash; testo plausibile, non testo vero. La terza viene da come &egrave; stato rifinito: con giudizi umani.</p>
    <aside class="notes">
      Il filo causale: nel Modulo 1 hanno visto il motore campionare da una distribuzione, senza
      nessun oracolo di verit&agrave; attaccato. Da l&igrave; vengono le prime due card.
      L'allucinazione &egrave; anche la risposta corretta di uno dei dieci item del test &mdash;
      strutturale, si riduce con l'ancoraggio ai documenti e la verifica umana, non si elimina: dilla
      con queste parole.
      Distorsione, versione misurata: Doshi &amp; Hauser, <em>Science Advances</em> 10(28), eadn5290
      (2024) &mdash; esperimento online, peer-reviewed. Con una sola idea generata dall'AI le storie
      diventano pi&ugrave; originali per chi le scrive (+8,1% di novit&agrave;) ma si somigliano fra
      loro il 10,7% in pi&ugrave;. Non &egrave; un giudizio morale sui dati di addestramento:
      &egrave; la media del gi&agrave; scritto che riemerge ogni volta che manca un riferimento
      proprio. &Egrave; la ragione per cui la scala del Modulo 3 cambia il risultato, ed &egrave;
      quella per cui nella demo il prompt disciplinato tira fuori un'altra struttura dalla stessa
      foto. Dove il modello tocca persone &mdash; selezione, valutazione, credito &mdash; la
      distorsione diventa anche una questione giuridica (AI Act, sistemi ad alto rischio): nominala,
      non aprirla, non &egrave; quello che questo corso dimostra.
      Accondiscendenza, versione misurata: Sharma et al., ICLR 2024 (Anthropic), su cinque assistenti
      allo stato dell'arte. Se l'utente contesta una risposta corretta i modelli cambiano la risposta
      iniziale fra il 32% e l'86% delle volte secondo il modello; un utente che suggerisce una
      risposta sbagliata abbassa l'accuratezza fino a 27 punti. Meccanismo, non movente: il
      rifinimento usa giudizi umani, e le persone preferiscono le risposte che confermano quello che
      gi&agrave; pensano. &Egrave; il ponte verso la terza card della slide sull'utente: il
      presupposto messo nella domanda torna indietro confermato.
      Il &laquo;pappagallo stocastico&raquo; (Bender et al. 2021) sta qui se qualcuno lo tira fuori:
      dibattito aperto, non verdetto. Rassegna sull'allucinazione: Ji et al. (2023).
    </aside>
  </section>


  <section data-background-color="#f4f8fb">
    <h2><span class="chip risk">utente</span> Che cosa succede a chi lo usa</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="Silhouette umana che passa un filo ambrato di pensiero a una parentesi meccanica">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Erosione della competenza</h4>
          <p>Quello che si delega si esercita di meno. Chi si fida dello strumento verifica meno; chi si fida di s&eacute; verifica di pi&ugrave;.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>La trappola della fluidit&agrave;</h4>
          <p>Un testo levigato sposta la fiducia, non l'accuratezza &mdash; e la sposta di pi&ugrave; fuori dalla propria materia.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>La domanda entra nella risposta</h4>
          <p>Un presupposto messo nella domanda torna indietro come se fosse acquisito. Chiedere <em>perch&eacute;</em> una cosa &egrave; vera non verifica che lo sia.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      Rendilo concreto per una piccola impresa: l'esperto in sala riconosce un'attribuzione sbagliata
      in un istante. Un giovane con lo stesso strumento no, e forse non svilupper&agrave; mai l'occhio
      se lo strumento risponde sempre per primo. &Egrave; una decisione di organico e formazione, non
      di tecnologia.
      Prima card, e che tipo di prova &egrave;: che ci&ograve; che si delega si ricordi meno &egrave;
      vecchio e solido (Sparrow, Liu &amp; Wegner 2011, <em>Science</em>, l'effetto Google). Che la
      competenza si atrofizzi NON &egrave; dimostrato: non dirlo. Il dato pi&ugrave; vicino &egrave;
      Lee, Sarkar, Tankelevitch et al., CHI 2025 &mdash; 319 lavoratori della conoscenza, 936 episodi
      reali: pi&ugrave; fiducia nello strumento va con meno pensiero critico, pi&ugrave; fiducia in
      s&eacute; con pi&ugrave; pensiero critico. &Egrave; un'associazione in un questionario
      auto-riferito, e va detta cos&igrave;. La rassegna di Risko &amp; Gilbert (2016) descrive quando
      si delega, non che la capacit&agrave; decada.
      Seconda card: Perry, Srivastava, Kumar &amp; Boneh, CCS 2023 &mdash; esperimento controllato con
      utenti. Chi aveva l'assistente ha scritto codice significativamente meno sicuro ed era
      pi&ugrave; convinto di averlo scritto sicuro; e chi si fidava di meno, lavorando sulla
      formulazione del prompt, produceva meno vulnerabilit&agrave;. Dominio codice e modello del 2022:
      dichiaralo. La seconda met&agrave; di quel risultato &egrave; la tesi della parte C della demo,
      che arriva fra pochi minuti.
      Terza card: chiude il filo del Modulo 3, &laquo;ferie&raquo; contro &laquo;congedi
      annuali&raquo;. L&igrave; erano le parole a spostare il recupero; qui &egrave; il presupposto a
      spostare la generazione, perch&eacute; il prompt &egrave; il testo che il modello continua.
      L'esempio si dice ad alta voce, secondo il settore in sala: &laquo;perch&eacute; questa moneta
      &egrave; pi&ugrave; rara?&raquo; &middot; &laquo;perch&eacute; questo impianto rende di
      meno?&raquo; &middot; &laquo;perch&eacute; questo collaudo &egrave; fallito?&raquo; &mdash;
      nessuna delle tre verifica che la premessa sia vera. La regola operativa da dettare: chiedere
      &laquo;che cosa manca in questa attribuzione?&raquo;, non &laquo;conferma che questa
      attribuzione &egrave; giusta&raquo;.
    </aside>
  </section>

  <section>

  <section>
    <h2>L'essere umano nel ciclo</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/human-loop.png" alt="Ciclo verde e viola che si incontra su checkpoint ambrati">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Perch&eacute; il controllo si allenta</h4>
          <p>Il sistema di solito ha ragione, e l'attenzione si sposta altrove. Vale per gli esperti quanto per i principianti, e non si corregge raccomandando di stare attenti.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Che cosa l'ha fermato</h4>
          <p>Cinque minuti fa non &egrave; stato un controllo automatico: &egrave; stato qualcuno che conosceva il pezzo e poteva dire di no.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Lo stesso strumento, al contrario</h4>
          <p>Fargli fare l'avvocato del diavolo, chiedergli che cosa manca, farsi interrogare. Chi lo interroga invece di delegargli ottiene risultati migliori.</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>Il test</h4>
      <p>La supervisione &egrave; reale solo se qualcuno pu&ograve; <strong>capire</strong>, <strong>contestare</strong> e <strong>ribaltare</strong>. Se manca uno dei tre, &egrave; un timbro.</p>
    </div>
    <aside class="notes">
      La prima card &egrave; il punto che vale la pena difendere, ed &egrave; misurato: Parasuraman
      &amp; Manzey, <em>Human Factors</em> 52(3) 381&ndash;410 (2010), una rassegna che integra gli
      studi empirici sul compiacimento da automazione. Due conclusioni testuali: il compiacimento
      &laquo;si riscontra sia nei partecipanti inesperti sia negli esperti e non si supera con la
      semplice pratica&raquo;, e l'automation bias &laquo;non si previene con l'addestramento o con le
      istruzioni&raquo;. Detto in aula: l'esperienza non protegge, e dire alla gente di stare attenta
      non &egrave; un controllo. Il rimedio non &egrave; la buona volont&agrave;, &egrave; la
      progettazione &mdash; i livelli di guardrail visti in M4.
      Il classico, da presentare come argomento e non come misura: Bainbridge,
      <em>Ironies of Automation</em>, <em>Automatica</em> 19(6) 775&ndash;779 (1983). Pi&ugrave;
      l'automazione &egrave; affidabile, meno l'operatore resta allenato a subentrare proprio nel
      momento in cui deve.
      E non si pu&ograve; essere vigili a intermittenza: un successo su un compito non autorizza a
      fidarsi sul compito dopo, perch&eacute; il confine fra i due non &egrave; dichiarato da nessuna
      parte.
      Terza card, la nota lieta, ma detta senza gonfiarla: quello che &egrave; misurato &egrave; che
      chi si fidava di meno e lavorava sulla formulazione otteneva risultati migliori (Perry et al.,
      CCS 2023), e che con l'AI il lavoro cognitivo non sparisce ma si sposta verso la verifica e la
      supervisione (Lee et al., CHI 2025). Che questo costruisca competenza nel tempo non &egrave;
      dimostrato: non prometterlo. Prometti la postura &mdash; chiedere &laquo;che cosa manca&raquo; e
      &laquo;argomenta il contrario&raquo; invece di &laquo;confermami&raquo; &mdash; che &egrave; la
      stessa regola operativa dettata sulla slide dell'utente.
      Per una casa d'aste il punto &egrave; netto: la responsabilit&agrave; verso gli acquirenti non
      si delega a un modello, n&eacute; giuridicamente n&eacute; sul piano della reputazione. Hanno
      appena visto l'esperto ribaltarlo dal vivo: indica quel momento, non rispiegarlo.
    </aside>
  </section>

  <section data-background-color="#fbfaf6">
    <h2>Dove siamo arrivati</h2>
    <div class="recap-chain compact">
      <div class="step"><strong>1</strong><span>prevede la parola dopo</span></div>
      <div class="step"><strong>2</strong><span>dentro o intorno</span></div>
      <div class="step"><strong>3</strong><span>ancorarlo ai documenti</span></div>
      <div class="step"><strong>4</strong><span>scrivere le regole, poi verificare</span></div>
      <div class="step"><strong>5</strong><span>capire, contestare, ribaltare</span></div>
    </div>
    <div class="quote-strip" style="grid-template-columns:1fr;">
      <blockquote>&laquo;Puoi delegare il tuo pensiero, ma non puoi delegare la tua comprensione.&raquo;<cite>un tweet che Karpathy continua a citare &mdash; AI Ascent (2026)</cite></blockquote>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>La domanda</h4>
      <p>&laquo;Una cosa concreta che farai nei prossimi 30 giorni applicando quello che hai imparato oggi.&raquo;</p>
    </div>
    <div class="takeaway">Alla base &egrave; probabilit&agrave;. In mano a una persona &egrave; uno strumento. La parte difficile &egrave; il giudizio.</div>
    <aside class="notes">
      La catena &egrave; l'ultima cosa che leggono: leggila ad alta voce, un anello alla volta, senza
      commentarla. L'anello 4 dice &laquo;poi verificare&raquo; e non &laquo;poi lasciarlo
      agire&raquo; di proposito &mdash; &egrave; la conclusione su cui il Modulo 4 si chiude davvero.
      L'anello 5 &egrave; il test della slide precedente, parola per parola.
      L'attribuzione conta: Karpathy dice esplicitamente che quella frase &egrave; un tweet che cita,
      non una sua formula. Praticare l'igiene delle fonti nella slide finale vale pi&ugrave; di dieci
      raccomandazioni.
      Poi la domanda d'impegno, che &egrave; il motivo per cui &egrave; scritta a schermo: la
      formulazione &egrave; identica alla Q6.1 del questionario di uscita, ed &egrave; il campo su cui
      si regge il follow-up a tre mesi. <strong>Falla scrivere, non dire.</strong> Un impegno
      pronunciato in sala non lascia traccia; uno scritto s&igrave;, e fra tre mesi si potr&agrave;
      chiedere se &egrave; stato mantenuto.
      Due posture da nominare solo se avanza tempo (Mollick, dallo studio BCG): centauro, con il
      lavoro diviso lungo una linea netta; cyborg, con lo scambio a ogni passo.
    </aside>

  <section>
    <h2>Tre superfici, lo stesso ciclo</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Claude Code</h4>
        <p>Finestra, sessioni in parallelo, revisione delle differenze. Lo stesso ciclo del Modulo 4 su un'altra superficie.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-cyan);">
        <h4>Claude Design</h4>
        <p>Da una pagina scritta a un file esportabile. Un artefatto utile in pochi minuti.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Dispatch</h4>
        <p>Lanciare dal telefono un lavoro che gira sul computer dell'ufficio. Autonomia al guinzaglio.</p>
      </div>
    </div>
    <p class="footnote">Non &egrave; un approfondimento: &egrave; una mappa di che cosa esiste, per sapere che cosa cercare dopo.</p>
    <aside class="notes">
      Claude Code: aprire e mostrare una sessione, <strong>senza avviare un lavoro vero</strong>. Il
      punto non &egrave; il codice, &egrave; che lo stesso ciclo &mdash; regole scritte, strumenti,
      verifica &mdash; ha superfici diverse a seconda del mestiere. Circa 2 minuti.
      Claude Design: un prompt provato fino in fondo, export compreso. Il valore &egrave; il tempo fra
      la richiesta e un file che si pu&ograve; mandare a qualcuno. Circa 3 minuti.
      Dispatch: l'associazione col computer va provata <strong>lo stesso giorno</strong>, si perde. Si
      lancia davanti a loro dal telefono: la sorpresa &egrave; il punto, e la frase da dire &egrave;
      &laquo;autonomia al guinzaglio&raquo; &mdash; parte da sola, ma il perimetro l'ha deciso una
      persona. Circa 2 minuti.
    </aside>
  </section>

  <section>
    <h2>Grill &rarr; MVP</h2>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">

      <p>Prima farsi interrogare finch&eacute; la specifica non regge. Poi costruire. &Egrave; la resa del Modulo 4: possedere la specifica, e poi verificare.</p>
    </div>
    <p class="footnote">Se il tempo &egrave; poco, si taglia tutto il resto e si tiene questo.</p>

      secondi: tienila aperta in una scheda di riserva. Si percorre, non si rifa' dal vivo.
      Perch&eacute; &egrave; il pezzo che non si taglia: &egrave; l'unico momento in cui vedono la
      specifica nascere da domande invece che da un'idea gi&agrave; formata, ed &egrave; esattamente
      quello che il Modulo 4 ha chiesto loro di fare. Circa 5 minuti.
      Chiudi qui: domande, e il link al questionario mostrato prima che escano dalla sala.

        "Raggy + Ollama",

      ],
      "lands": "Cloud vs local; prompt injection; fluency is not accuracy; the human in the loop.",
      "lands_it": "Cloud contro locale; prompt injection; la fluidità non è accuratezza; l'essere umano nel ciclo.",
      "watch_for": "A - one variable changed. Rung 3 of M3 comes back identical: same Raggy window, same regole/ index, only the provider switches to the local model - then unplug the network in full view. The gesture matters more than the answer: show it, do not narrate it. Then open the retrieved passages and have them compared with M3's: they are the same. What changed is not what it reads but who writes. The answer will be slower and plainer - say so before they think it: that is the price, and the decision is theirs. On a 4B local model, keep the simplest wording of the scale question. B - the poisoned folder. Exactly the request of m4-p7: the only changed variable is the document, and say that out loud before running it. Two outcomes, two different sentences. If it derails: \"I did not write that instruction, it was inside a file - and the model has no way to tell the two apart, because they arrive through the same channel.\" If it stops at the confirmation prompt: \"the guardrail held - and it is a guardrail somebody had to configure, not a property of the model.\" Then open the PDF, Ctrl+A, reveal the grey text: that is the part the room remembers. If the sector in the room is not numismatics the poisoned folder does not exist and this beat is dropped - they have just seen the theory on the slide. This is also the beat to cut if the clock is against you. C - cold, then disciplined. C1 on a genuinely hard piece from his own archive: confident and wrong. Do not correct it yourself - hand the floor to {{EXPERT_ROLE}}, who agreed before the lesson to dismantle it live. It is the one moment of the day when a human beats the machine in front of everyone, and it is worth the whole module. Then C2: same photo, same model, disciplined prompt - what it SEES kept apart from what it INFERS, with a confidence per field. The only difference is the prose. Close by naming deliberate failure #1 from Module 1, the two tools that invented a reference and contradicted each other. It was left unexplained there. This is where it is explained.",
      "watch_for_it": "A — una variabile sola. Il gradino 3 di M3 torna identico: stessa finestra di Raggy, stesse regole/ indicizzate, cambia solo il provider, che passa al modello locale — poi si stacca la rete davanti a loro. Il gesto conta più della risposta: fallo vedere, non raccontarlo. Poi apri i passaggi recuperati e falli confrontare con quelli di M3: sono gli stessi. Non è cambiato che cosa legge, è cambiato chi scrive. La risposta sarà più lenta e più piatta: dillo prima che lo pensino — è il prezzo, e la decisione è loro. Con un modello locale da 4B tieni la formulazione più semplice della domanda della scala. B — la cartella avvelenata. Esattamente la richiesta di m4-p7: l'unica variabile cambiata è il documento, e va detto ad alta voce prima di lanciare. Due esiti, due frasi diverse. Se deraglia: «quell'istruzione non l'ho scritta io, stava dentro un file — e il modello non ha modo di distinguere le due cose, perché gli arrivano nello stesso canale». Se invece si ferma sulla richiesta di conferma: «il guardrail ha retto — ed è un guardrail che qualcuno ha dovuto configurare, non una proprietà del modello». Poi apri il PDF, Ctrl+A, e scopri il testo grigio: è la parte che la sala ricorda. Se il settore in sala non è la numismatica la cartella avvelenata non esiste e questa battuta salta — la teoria l'hanno appena vista sulla slide. È anche la battuta da tagliare se il tempo stringe. C — a freddo, poi disciplinato. C1 su un pezzo davvero difficile del suo archivio: sicuro di sé e sbagliato. Non correggerlo tu: dai la parola a {{EXPERT_ROLE}}, che ha accettato prima della lezione di smontarlo dal vivo. È l'unico momento della giornata in cui un essere umano batte la macchina davanti a tutti, e vale quanto tutto il modulo. Poi C2: stessa foto, stesso modello, prompt disciplinato — ciò che VEDE tenuto separato da ciò che INFERISCE, con la confidenza campo per campo. L'unica differenza è la prosa. Chiudi nominando il fallimento deliberato n. 1 del Modulo 1, i due strumenti che avevano inventato un riferimento e si erano contraddetti. Lì non era stato spiegato: è qui che si spiega.",

  <!-- 1) Decide language and inject the matching deck BEFORE Reveal/widgets run.
       document.documentElement.lang is read by theory-widgets.js, so it must be
       set here first. -->
  <script>
    (function () {
      // Which edition this file is: 'sme' (index.html) or 'academic'
      // (academic.html). Read by the version-switch slide.
      document.documentElement.dataset.edition = 'sme';

      // localStorage throws (not returns null) on file:// opaque origins and
      // in strict privacy modes. Unguarded, that exception happens BEFORE the
      // deck is injected and the room gets a blank screen — so every access
      // goes through these helpers. Offline file:// use is a requirement here.
      window.deckStore = {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      var DEFAULT_LANG = 'it'; // change to 'en' to publish English by default
      var lang = (deckStore.get('deck-lang') || DEFAULT_LANG).toLowerCase();
      if (lang !== 'en' && lang !== 'it') lang = 'en';
      document.documentElement.lang = lang;
      var tpl = document.getElementById('deck-' + lang);
      var slides = document.querySelector('.reveal .slides');
      if (tpl && slides) slides.innerHTML = tpl.innerHTML;
      // Free the memory of both templates once the active one is live.
      var other = document.getElementById('deck-' + (lang === 'en' ? 'it' : 'en'));
      if (tpl) tpl.remove();
      if (other) other.remove();

      document.addEventListener('DOMContentLoaded', function () {
        var btns = document.querySelectorAll('#lang-toggle button');
        Array.prototype.forEach.call(btns, function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
          b.addEventListener('click', function () {
            if (b.dataset.lang === lang) return;
            deckStore.set('deck-lang', b.dataset.lang);
            // Reload: Reveal keeps the slide number in the URL hash, so the
            // other language opens on the very same slide.
            location.reload();
          });
        });
      });
    })();
  </script>
