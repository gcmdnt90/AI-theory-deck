<section>

  <section class="module-cover" data-background-image="assets/img/module-01-history.png" data-background-size="cover" data-background-color="#fbfaf6">

    <h1>How the machine makes words</h1>
    <p class="lede">A 1948 idea, running at industrial scale.</p>
    <aside class="notes">
      Thesis: the idea behind LLMs is from 1948. What changed is scale, data and architecture.
      By the end of this module they should see the machine as a sampler, not an oracle.
    </aside>
  </section>

  <section>
    <h2>1948 &mdash; language as a game of probability</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li><strong>Shannon</strong>: text is a source that emits symbols with a probability.</li>
          <li>Sampling from those statistics gives sentences that <strong>sound English and say nothing</strong>.</li>
          <li><strong>1951</strong>: he measures how predictable English is &mdash; <strong>0.6&ndash;1.3 bits per letter</strong>.</li>
          <li>An LLM estimates the same distribution: <strong>learned</strong>, not counted by hand.</li>
        </ul>
      </div>
      <div class="col stack-sm">
        <div class="quote-strip single sample">
          <blockquote>THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS THAT THE TIME OF WHO EVER TOLD THE PROBLEM FOR AN UNEXPECTED.
            <cite>Text generated by Shannon in 1948 by sampling word-pair statistics.</cite>
          </blockquote>
        </div>
        <figure class="portrait">
          <img src="assets/img/shannons.png" alt="Claude Shannon with Betty Moore Shannon">
          <figcaption>Claude Shannon with Betty Moore Shannon, numerical analyst at Bell Labs.</figcaption>
        </figure>
      </div>
    </div>
    <div class="takeaway">Fluent and empty: the machine was already doing that in 1948.</div>
    <aside class="notes">
      Sources: Shannon (1948) A Mathematical Theory of Communication, approximations to English;
      Shannon (1951) Prediction and Entropy of Printed English &mdash; 0.6&ndash;1.3 bits per letter,
      measured with 100 letters of context. It is the one number in this module worth saying out loud.
      Read the 1948 sample aloud: it sounds English and says nothing. That is the literal ancestor of
      hallucination - we come back to it in module 5. An LLM is a very large learned estimator of the
      same distribution; everything else is engineering around that one operation. Do not put the
      formula on screen - the widget two slides from now does the work.
    </aside>
  </section>

  <section>
    <h2>From rules to learned patterns</h2>
    <div class="corner-media" aria-hidden="true">

    <div class="takeaway">Three jumps: from rules to data, from data to vectors, from completion to instruction.</div>
    <aside class="notes">
      Two minutes, no more: the timeline is a list of technical choices, not a story.
      Three stops worth saying out loud. 2013 (Mikolov): words become vectors, closeness in that
      space is similarity of meaning - the mechanism that comes back in module 3 as retrieval.
      2017 (Vaswani): attention compares every word with every other word in parallel, which makes
      training at scale practical; do not open the encoder-decoder. 2022 (Ouyang, InstructGPT):
      training with human feedback adds instruction-following on top of plain text completion - the
      difference between a model that continues a sentence and the assistant they use daily, and the
      reason module 4 works at all. Sources: Mikolov (2013); Vaswani (2017); Brown (2020); Ouyang (2022).
    </aside>

  <section data-background-color="#f4f8fb">
    <h2>Three levels, one machine</h2>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit levels-frame">
        <img src="assets/img/m01-levels-machine-v2.png" alt="Three-layer machine cutaway: probabilistic token substrate, learned concept layer, and human judgement layer">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4><span class="chip safe">macro</span> Judgement</h4>
          <p>The person who accepts or rejects the output.</p>
          <p class="ask">&rarr; &ldquo;who answers if it is wrong?&rdquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">meso</span> The system</h4>
          <p>Memory, tools, skills, connectors. <strong>This is where the work happens.</strong></p>
          <p class="ask">&rarr; &ldquo;why doesn't it know our price list?&rdquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">micro</span> The base</h4>
          <p>Probabilities over the next piece of text. Always on.</p>
          <p class="ask">&rarr; &ldquo;why does it miscount letters?&rdquo;</p>
        </div>
      </div>
    </div>
    <div class="takeaway">&ldquo;It is just statistics&rdquo; is true at the base and useless at the level where the work happens.</div>
    <aside class="notes">
      The deck's spine - the one slide to defend if time runs out. Cristianini's mesoscopic level:
      micro = neurons, meso = the abstract ideas the model built by itself, macro = behaviour read
      almost psychologically. Guard the flank: this is a claim about the right LEVEL of description
      (Marr 1982), NOT that the model became a mind. "It's just predicting words" is true at micro
      and useless at meso, which is where their actual work happens. Every later module answers:
      which level are we on?
      The three arrows are the index of the rest of the course: macro -> module 5, meso -> modules 3-4,
      micro -> the next slide. Use them that way.
    </aside>
  </section>

  <section>
    <h2>Tokens, not words</h2>
    <ul class="slide-list">
      <li>The machine never sees letters: it sees <strong>sub-word pieces</strong>, chosen by frequency in the data.</li>
      <li>Rule of thumb: <strong>1 token &asymp; 4 characters &asymp; 3/4 of a word</strong> (in English).</li>
      <li>The token is the unit of <strong>price</strong> and of <strong>memory</strong> &mdash; and languages do not cost the same.</li>
    </ul>
    <div class="visual-frame">
      <div class="tokenizer-widget" data-tokenizer-widget>
        <div class="prompt-switcher token-presets" role="group" aria-label="Choose a sentence to tokenize">
          <button type="button" data-sentence="Tokenisation splits text into sub-word pieces." aria-pressed="true">sub-word</button>
          <button type="button" data-sentence="Count the letter r in strawberry." aria-pressed="false">letters</button>
          <button type="button" data-sentence="The lot weighs 12.7 grams, struck in 42 BC." aria-pressed="false">numbers</button>
          <button type="button" data-sentence="L'intelligenza artificiale aiuta la traduzione." aria-pressed="false">Italian</button>
          <button type="button" data-sentence="Artificial intelligence helps translation." aria-pressed="false">English</button>
        </div>
        <textarea class="tokenizer-input" rows="2" aria-label="Sentence to tokenize">Tokenisation splits text into sub-word pieces.</textarea>
        <div class="token-output" data-token-output></div>
        <div class="token-stats" data-token-stats></div>
        <div class="token-explainer" data-token-explainer>Hover or tap a token to see how frequent it is.</div>
      </div>
    </div>
    <p class="footnote">Real tokenizer: <code>cl100k_base</code>, the GPT-4 family encoding. Piece colour shows how frequent it is.</p>
    <aside class="notes">
      Live and low-load. Type one of their own words into the box - a coin term, a client name: the
      rarer it is, the more pieces it breaks into, and the colour shows it.
      The "letters" preset is the fastest myth-buster in the deck: " strawberry" is ONE token, so the
      model never saw the individual r's. It does not fail out of stupidity, it fails because the
      letters never reach it.
      The Italian/English comparison is the moment an owner cares about: the same sentence is 14 tokens
      in Italian and 6 in English (3.4 vs 7.0 characters per token). Same meaning, more than twice the
      cost and twice the context consumed.
      Sources: Sennrich et al. (2016) for BPE; OpenAI (1 token ~ 4 characters); Petrov et al.
      (NeurIPS 2023) for the gap between languages.
    </aside>
  </section>

  <section>
    <h2>One operation, repeated</h2>
    <div class="cols">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li>It works out the odds of the next piece, <strong>picks one</strong>, adds it, starts again.</li>
          <li>What it writes becomes part of what it reads: <strong>early choices steer every later one</strong>.</li>
          <li>It consults no archive &mdash; it chooses, one piece at a time.</li>
        </ul>
      </div>
      <div class="col visual-frame">
        <div class="prob-widget" data-next-token-widget>
          <div class="prompt-switcher" role="group" aria-label="Choose a starting phrase">
            <button type="button" data-prompt="The capital of Italy is" aria-pressed="true">capital</button>
            <button type="button" data-prompt="The quote must state the" aria-pressed="false">quote</button>
            <button type="button" data-prompt="The satellite detected a" aria-pressed="false">satellite</button>
            <button type="button" data-prompt="To check the result you have to" aria-pressed="false">verify</button>
          </div>
          <div class="prompt-display" data-prompt-text>The capital of Italy is</div>
          <div class="bar-list"></div>
          <p class="temp-warning">Real probabilities &mdash; gpt-3.5-turbo-instruct, temperature 1, top 5 out of the whole vocabulary.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      Formula deliberately removed from the slide; say it if asked. Hammer the loop: every word it
      writes becomes part of what it reads next, so early choices steer later ones. Hallucination,
      creativity and fluency all fall out of this one mechanism. Forward-reference temperature. The bars are REAL probabilities, measured once against the OpenAI
      API (gpt-3.5-turbo-instruct, temperature 1): they are not normalised, and the grey bar is
      everything else in the vocabulary.
      The comparison that does the work: "capital" puts Rome at 80%, "satellite detected a" puts its
      best candidate at 9%. Same machine, opposite confidence - and it writes both in the same
      steady tone. Note too that some candidates are sub-word pieces, not words: that is the
      tokenizer from two slides ago.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Temperature: the randomness dial</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Low &middot; 0.2&ndash;0.5</h4>
          <p>The distribution tightens onto the most likely candidate.</p>
          <p class="ask">&rarr; extraction, classification, repeatable output</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>High &middot; 1.0&ndash;2.0</h4>
          <p>The distribution flattens: rare candidates get in.</p>
          <p class="ask">&rarr; variants, rewrites, brainstorming</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Always</h4>
          <p>It redistributes probability, <strong>it adds no knowledge</strong>. At T&nbsp;=&nbsp;0 a wrong answer just becomes a repeatable wrong answer.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="temp-widget" data-temp-widget>
          <p class="micro">T = <span data-temp-value>0.7</span></p>
          <input class="temp-slider" type="range" min="0.2" max="2.0" step="0.1" value="0.7" aria-label="Temperature">
          <div class="bar-list"></div>
          <svg class="temp-distribution" viewBox="0 0 520 185" data-temp-distribution role="img" aria-label="Live probability distribution curve"></svg>
          <p class="temp-warning">Real logits: the log of the measured probabilities. The recalculation with T is the actual formula.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Randomness is a setting, not a personality.</div>
    <aside class="notes">
      Best interactive moment in the deck - drag the slider slowly to both ends and let them watch the
      bars move. The base is the five real candidates from the previous slide (renormalised among
      themselves), and the slider applies the actual formula: softmax(logit/T).
      If you have one minute, the line to say is the third card: temperature moves probability, not
      knowledge. At T = 0 the model repeats the error instead of fixing it - the misconception you
      dismantle again in module 5.
      Land the line, then go straight into the demo: they are about to see the same question
      answered four different ways.
    </aside>
  </section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-03-architectures.png" data-background-size="cover" data-background-color="#fbfaf6">

    <p class="kicker">Module 2 <span class="mod-clock" data-clock-for="m2"></span></p>
    <h1>Inside the model, around the model</h1>
    <p class="lede">Two things people constantly confuse.</p>
    <aside class="notes">
      The single most useful conceptual correction in the course. Almost every "can AI do X?"
      question is really a question about which side of this boundary X sits on.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>The boundary</h2>
    <div class="cols">
      <div class="col visual-frame media-fit">
        <img src="assets/img/m03-boundary-motherboard.png" alt="LLM processor mounted in a motherboard of memory, tools and orchestration components">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Inside &mdash; the processor</h4>
          <p>What the model learned during training.</p>
          <p class="ask">&rarr; it does not change: nobody retrains a frontier model</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Around &mdash; the scaffolding</h4>
          <p>Memory, documents, tools, rules, loops.</p>
          <p class="ask">&rarr; it is built today, and it can be undone</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <h4>What is &ldquo;needed&rdquo; is almost always around it.</h4>
    </div>
    <div class="takeaway">The test: does it change the model itself, or only what the model is given?</div>
    <aside class="notes">
      The good news for an SME is entirely on the right-hand card: you cannot retrain a frontier
      model, and you do not need to. Everything that will make this useful for their business is
      "around" - and around is cheap, fast and reversible. Say that explicitly; it reframes the whole
      afternoon from "expensive AI project" to "configuration".
    </aside>
  </section>

  <section>
    <h2>How a model is made</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-training-pipeline.png" alt="Three-stage light infographic for pretraining, supervised fine-tuning and preference tuning">
      </div>
      <div class="vertical-captions">
        <p class="cap-eyebrow">Yesterday &mdash; the only one we know in full</p>
        <div class="mini-card"><strong>1. Reads text</strong><span>Predicts the next word across enormous amounts of writing.</span><span class="fig">300 billion tokens</span></div>
        <div class="mini-card"><strong>2. Learns to follow instructions</strong><span>Examples teach it to carry out a task, not just continue text.</span><span class="fig">~13,000 hand-written examples</span></div>
        <div class="mini-card"><strong>3. Tuned by human feedback</strong><span>People judge the answers; the model is pushed towards the preferred ones.</span><span class="fig">~33,000 comparisons, ~40 people</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <h4>Today</h4>
      <p>Llama 3: <strong>~15 trillion tokens</strong> at step 1, fifty times InstructGPT &mdash; and a growing share of the examples in steps 2 and 3 is generated by <strong>other models</strong>, not written by people.</p>
    </div>
    <div class="takeaway">Knowledge comes from step 1. Assistant behaviour comes from steps 2 and 3.</div>
    <aside class="notes">
      Common belief in the room: "the model is one trained thing that knows facts". Correct it here,
      and correct yourself too: the three numbers belong to ONE specific model - InstructGPT, 2022,
      the ancestor of ChatGPT, built on top of GPT-3. It is the only case in that family with a full
      public account of all three steps. Other models differ by orders of magnitude: the shape of the
      pipeline holds, the figures do not.
      The "Today" strip is the honest line of this module: it tells them what they are learning has an
      expiry date. If time is short, skip it aloud and leave it on screen.
      Two hooks to keep in your pocket. First: step 3 pushes the model towards what the raters liked -
      that is where sycophancy comes from, not from a wish to please them; you collect it in Module 5.
      Second: synthetic data is the same thing we do when we generate the fake sheets for today's demos.
      Sources: Brown (2020) for GPT-3; Ouyang (2022) for the three figures; Llama 3 (2024) for the
      "Today" strip; Christiano (2017) for human feedback.
    </aside>
  </section>

  <section>
    <h2>&quot;Reasoning&quot;: trained or prompted</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">inside</span> Trained</h4>
          <p>Trained with reinforcement learning to deliberate before answering: self-checking and second thoughts <strong>emerge from the training</strong>, not from an instruction.</p>
          <p class="ask">&rarr; the &ldquo;thinking&rdquo; versions of ChatGPT, Claude, Gemini and Copilot; DeepSeek-R1 is the one with a public account</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">around</span> Prompted</h4>
          <p>It is asked for in the prompt: &ldquo;list the criteria first, then decide&rdquo;.</p>
          <p class="ask">&rarr; free, on any model, including the free ones</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="reason-widget" data-reason-widget>
          <div class="mode-buttons">
            <button type="button" data-mode="trained" aria-pressed="true">Trained</button>
            <button type="button" data-mode="prompted" aria-pressed="false">Prompted</button>
          </div>
          <div class="reason-diagram" data-reason-diagram></div>
          <p class="reason-copy" data-reason-copy></p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>The switch injects no prompt: <strong>it turns on a mode of the model</strong> &mdash; and today the model itself decides how much to think. Written instructions, task lists and loops do exist, but they are scaffolding: module 4.</p>
    </div>
    <div class="takeaway">The visible steps are produced text, not the minutes of how it got there.</div>
    <p class="footnote">What scrolls past on screen is a model-generated summary, not the internal trace (OpenAI).</p>
    <aside class="notes">
      Two of these are reasoning, the third is not: the room conflates all three.
      (1) PROMPTED: you ask in the prompt, the model writes the steps as ordinary output; nothing about
      the model changes. (2) SCAFFOLDING: system prompt, instruction and personality files read on every
      request, task lists, loops, tools - it is real, but it is module 4, and it is not what makes a
      model a reasoning model. (3) TRAINED: reinforcement learning, the ability sits in the weights.
      DeepSeek-R1 shows it publicly: pure RL, no human-written reasoning traces, and self-reflection,
      verification and strategy switching emerge from training. OpenAI says the same of o1: "our
      large-scale reinforcement learning algorithm teaches the model how to think productively using
      its chain of thought".
      If asked what the button does: it injects no instructions, it turns on a technical mode. On Claude
      it was a thinking-token budget (thinking parameter + budget_tokens, up to 4.6); from 4.7 that
      parameter is gone, replaced by adaptive thinking with an effort level - the model decides whether
      and how much to think. On ChatGPT, picking the "thinking" version routes to a different model.
      Version numbers age in weeks: keep them here, not on screen, and check the deck edition date.
      Why the takeaway: Turpin et al. (2023) planted a biasing cue in the input (for instance the correct
      answer always in the same position); models followed the cue, got it wrong, and never mentioned the
      cue in their chain - they built a plausible justification for the wrong answer, up to -36% accuracy
      across 13 tasks. The cue is the measuring instrument, not advice for the audience: keep it off screen.
      This slide is the first deposit of the vigilance you collect in M5 ("fluency is not proof of
      accuracy"). Demo m2 lands it: the switch is the trained kind, "list the criteria first" is the
      prompted kind.
      Sources: DeepSeek-R1 (2025); OpenAI, Learning to reason with LLMs (2024); Turpin et al. (2023);
      Wei et al. (2022); Nye et al. (2021).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>An agent = model + loop + tools + memory</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-agent-loop.png" alt="Central LLM processor wrapped by a clean agent loop of actions, tools, memory and observation">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Loop</strong><span>Decides, acts, observes the result, decides again.</span><span class="fig">the model decides when to stop: that is why it can spin in circles</span></div>
        <div class="mini-card"><strong>Tools</strong><span>Functions described in words, which the model chooses whether to call.</span><span class="fig">files, search, email, databases &mdash; module 5</span></div>
        <div class="mini-card"><strong>Memory</strong><span>What is put back in front of it on the next turn.</span><span class="fig">how it actually works: module 3</span></div>
      </div>
    </div>
    <div class="takeaway">The difference between a chatbot and an agent is the scaffolding around the same model, not a bigger model.</div>
    <aside class="notes">
      From here on everything is "around". The model deliberately has no card of its own: it is what
      the whole module has been about, and the takeaway says so.
      Say the loop out loud - decides, acts, observes - because you will narrate exactly those three
      words over the Cowork demo in Module 4, and they need to recognise them when they hear them again.
      The two forward references keep nobody hanging: tools open in M4, memory in M3. If someone asks
      about cost straight away, the answer is in the first card: the loop decides for itself when to
      stop, so a badly specified agent can repeat useless turns - which is why M4 writes the spec first
      and verifies after. Sources: Yao et al. (2023) ReAct; Schick et al. (2023).
    </aside>
  </section>

</section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-04-context-memory.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">03</span>
    <p class="kicker">Module 3 <span class="mod-clock" data-clock-for="m3"></span></p>
    <h1>Context, memory, grounding</h1>
    <p class="lede">How the machine gets to know <em>a</em> business.</p>
    <aside class="notes">
      The module with the highest direct business value. Core distinction: context is what is in
      front of the model right now; memory is what survives between sessions. Both are "around".
    </aside>
  </section>

  <section>
    <h2>The context window</h2>
    <p>Context is the model's desk: everything it can see while answering this one question.</p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m04-context-ram.png" alt="RAM-like context window with colored token segments loaded into immediate memory slots">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Rules</strong><span>The instructions sit at the front of the desk.</span><span class="fig">they stay only if they are written down: module 4</span></div>
        <div class="mini-card"><strong>Conversation + documents</strong><span>They compete for the same finite space.</span><span class="fig">measured in tokens, the ones from earlier</span></div>
        <div class="mini-card"><strong>Room to answer</strong><span>The reply needs space on the desk too.</span><span class="fig">full desk, shorter reply</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <p>Every question re-sends <strong>the whole</strong> conversation. When it no longer fits, the oldest part is summarised or cut &mdash; and it is worth paying attention to when that happens.</p>
    </div>
    <div class="takeaway">The desk is wiped after every question unless things are put back on it.</div>
    <aside class="notes">
      The wiped-desk image is the one they must keep. It explains why a fresh chat "forgets", why
      long threads degrade, and why the project/instruction file in Module 4 matters.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>The context problem</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <p>Declared windows went from <strong>~2,000 tokens</strong> (2020) to <strong>~1,000,000</strong> on some models: from a few pages to a few hundred.</p>
        <p>But the declared window is not the usable one:</p>
        <ul class="slide-list">
          <li>what sits at the <strong>start</strong> and at the <strong>end</strong> is used better than what ends up buried in the middle;</li>
          <li>at 32,000 tokens <strong>11 models out of 13</strong> fall below half the score they reach on short texts.</li>
        </ul>
        <p class="ask">&rarr; a few relevant documents beat &ldquo;paste everything in&rdquo;</p>
        <div class="takeaway">What goes in, and in what order, still matters.</div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/middle_sag.png" alt="&ldquo;Lost in the middle&rdquo; curve: lower accuracy for information placed halfway through the context">
      </div>
    </div>
    <p class="footnote">Chart: Liu et al., &ldquo;Lost in the Middle&rdquo; (TACL 2024), gpt-3.5-turbo over 20 retrieved documents. The 32,000-token figure: NoLiMa (ICML 2025).</p>
    <aside class="notes">
      Head off the "we'll just paste everything in" reflex before it forms.
      The numbers, if asked: GPT-3 sat at ~2,000 tokens, frontier models declare up to ~1,000,000,
      which is roughly 700-750 thousand words (a token is about three quarters of a word - NOT one
      and a half million words).
      The two lines say different things and should stay distinct. The first is about position: the
      chart is from 2023 on gpt-3.5-turbo, so do not sell it as the last word. The second is recent
      and harder: in the NoLiMa benchmark (ICML 2025), at 32,000 tokens 11 of 13 models drop below
      half their short-text score, and GPT-4o goes from 99.3% to 69.7%. That is the ready answer to
      "but windows are huge now": huge yes, usable in full no.
      The closing arrow is the bridge to retrieval: if a few relevant documents beat the pile,
      something has to choose them. Sources: Liu et al. (2023/24) Lost in the Middle, TACL;
      Modarressi et al. (2025) NoLiMa, ICML.
    </aside>
  </section>

  <section>
    <h2>Three ways not to start from scratch</h2>
    <p>When the desk fills up, something has to go. Three mechanisms decide what stays.</p>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit">
        <video src="assets/video/context.mp4" autoplay loop muted playsinline data-autoplay></video>
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>1 &middot; Summarisation</h4>
          <p>The oldest part is compressed into notes. Automatic and lossy: details disappear without warning.</p>
          <p class="ask">&rarr; &ldquo;why has it forgotten what it was told an hour ago?&rdquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>2 &middot; Persistent notes</h4>
          <p>Facts written to a file, put back on the desk at the start of every session. Explicit and correctable &mdash; but someone has to write them.</p>
          <p class="ask">&rarr; module 4</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>3 &middot; Searchable archive</h4>
          <p>The documents stay outside. Each question triggers a search, and only the relevant pieces are inserted.</p>
          <p class="ask">&rarr; next slide</p>
        </div>
      </div>
    </div>
    <div class="takeaway">None of the three writes inside the model: all three rewrite the desk.</div>
    <aside class="notes">
      Open on the video, which shows the first mechanism end to end: the container fills, hits
      saturation ("context saturation reached"), and the contents collapse into a summary bar.
      Card 1 is the ready answer to the question that always comes: the three-hour conversation in
      which the chatbot "forgets" the beginning. It is not a fault and not a privacy choice: past a
      certain number of tokens the old part is compacted or cut, and granularity is lost. Every model
      has this limit; the size changes, the mechanism does not. Honest caveat: this is documented
      product behaviour of the chat interfaces, not a benchmark result - the two numbered lines are on
      the previous slide.
      Card 2 is the bridge to module 4: the memory that can be inspected and corrected is the one
      someone wrote. Card 3 is the bridge to the next slide: if the documents stay outside, something
      has to choose which pieces come in.
      The takeaway carries the rest of the module: none of the three touches the parameters.
      Immediate operational consequence: update a document and the answers change at once, with no
      retraining. Never say the system "learns" or "remembers". It puts text back on the desk.
    </aside>
  </section>

  <section>
    <h2>Retrieval: find first, then write</h2>
    <div class="cols fit-two">
      <div class="col">
        <div class="visual-frame media-fit">
          <video src="assets/video/retrieval.mp4" autoplay loop muted playsinline data-autoplay></video>
        </div>
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Once: it is indexed</h4>
          <p>Documents are cut into pieces; each piece becomes a position on a map of meanings. They stay outside the model.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Each question: it is searched</h4>
          <p>The question becomes a position too. Only the nearest pieces come in: that is the anchoring, the <em>grounding</em>.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>When it fails</h4>
          <p>If the question is worded far from the document's wording, the right pieces never come in. And an answer arrives anyway.</p>
        </div>
      </div>
    </div>
    <p class="chain">question &rarr; into numbers &rarr; search by meaning &rarr; most similar pieces &rarr; LLM &rarr; answer</p>
    <div class="takeaway">The company's documents are not trained into the model: they are handed to it, one question at a time.</div>
    <aside class="notes">
      The most useful pattern this audience will actually adopt. The video carries the point on its
      own: the wall of documents does not move, the empty slots stay visible, only a few pieces travel.
      Card 1 is the step missing from most explanations, and it dismantles the three most common wrong
      ideas about "uploading documents": it is not a Ctrl+F over the archive, it is not the model
      learning the document, it is not indexing by name and date. Cut, converted into numbers, saved as
      an index - once, and outside the model. The map of meanings is the one seen in module 1 at the
      "vectors" stop.
      Card 2: name the word here. Anchoring an answer to a retrieved source is grounding, and it is the
      title of the demo that follows.
      Card 3 is the part to say out loud, with the example: "how do I handle holidays?" finds nothing,
      "how do I request annual leave?" finds it at once. Same question, different words. Search works
      by proximity of meaning, not by exact words; if the question falls far from the way the document
      is written, the right passage does not come back - and nothing warns you. That is why the demo
      shows the retrieved passages instead of trusting the answer.
      The two operational consequences to land: (1) nothing is memorised, so updating a document
      changes the answers at once, with no retraining; (2) the model can only answer from what
      retrieval found, so retrieval quality IS answer quality.
      Sources: Lewis et al. (2020) RAG; Karpukhin et al. (2020) Dense Passage Retrieval; Mikolov et al.
      (2013).
    </aside>
  </section>

  <section>
    <h2>Two places to write the rules</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>This request is the text that changes every time. Standing rules are the text that is <strong>re-read on every request</strong>.</p>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Prompt engineering</h4>
          <p>The work to be done, stated in full:<br><strong>C</strong>ontext, <strong>O</strong>bjective, <strong>S</strong>tyle, <strong>T</strong>one, <strong>A</strong>udience, <strong>R</strong>esponse.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Standing rules</h4>
          <p>Apply to every request. Safety, house style, vocabulary, what to never do.</p>
          <p class="chain">personality.md &middot; CLAUDE.md &middot; AGENT.md &middot; CONTEXT.md</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m05-prose-stack.png" alt="Layered instruction sheets steering an agent's behaviour signal">
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>Everything written in the prompt stays one text among others on the desk from module 3: it can be <strong>summarised</strong>, it can be <strong>cut</strong>, it can be <strong>overridden</strong>.</p>
    </div>
    <aside class="notes">
      The card order is deliberate: the request first, which they already know how to write, then
      the standing rules, which are the new thing. The whole module runs against the room's habit.
      CO-STAR is GovTech Singapore's. It is now on screen with all six elements, so name it: an
      acronym with its visual anchor beside it costs little, an acronym merely said out loud costs
      attention. The real content of that card is not the initialism: it is that a complete request
      gets written, not improvised.
      The four file names under the first card do not live in the same place: personality.md sits in
      settings, the other three in a working folder. The next slide assigns each name to its
      mechanism - here they only show that these are real files with names that get typed.
      The amber card is the hinge of the module, and the three verbs are three different things.
      Summarised and cut come from module 3 (the oldest part of the context gets summarised or cut).
      Overridden is seen happening at the fourth beat of the demo: the model is asked to ignore the
      house rules, and it complies. That third verb is where the three-tier table on the last slide
      comes from.
      Narrative job: this slide serves none of the Concept Test items. Its work is to establish that a
      written artefact exists and that it has two layers - without which nothing later in the module
      has anything material to stand on.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Where standing rules enter from</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="caption-row two">
          <div class="mini-card"><strong>Instructions</strong><span>On every request, always. The only one that occupies context every time.</span><span class="fig">personality.md</span></div>
          <div class="mini-card"><strong>Projects</strong><span>When the project opens. If the files exceed the window, they enter in pieces &mdash; module 3.</span><span class="fig">.md &middot; .pdf</span></div>
          <div class="mini-card"><strong>Directory</strong><span>Only if the agent reads the file: it takes a tool and a decision.</span><span class="fig">CLAUDE.md &middot; CONTEXT.md</span></div>
          <div class="mini-card"><strong>Skills</strong><span>Only when the description matches the request.</span><span class="fig">SKILL.md</span></div>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Why it matters</h4>
          <p>The thing that controls the machine is the same thing a new colleague reads to learn the job.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="layered-file" data-standing-rules="m4-p2" data-standing-rules-heading="# Standing rules"></div>
      </div>
    </div>
    <aside class="notes">
      Live window, about two minutes, in this order: the instructions in settings, a project with its
      files, a folder with a CLAUDE.md in it, a skill that loads itself. Show, do not narrate: the
      narration is the grid on the slide.
      The axis across the four cells is not "always vs conditional", it is <em>when it enters the
      context</em>, and the four answers differ. Instructions is the only truly unconditional one, and
      it is also the only one paid for on every request: half a page written there travels every time.
      Projects applies to that project, but when the files exceed the window they are not loaded, they
      are retrieved in pieces - which is exactly rung 2 against rung 3 of the module 3 ladder.
      Directory depends on a decision by the agent and on a tool that reads: if it does not open the
      file, the file does not exist. Skills depends on the description, not on the content - the
      description is what decides the load.
      The block on the right is not a mockup: it is the exact text the demo will paste at step 2, read
      from demo-prompts.json and switched by the sector selector.
      If someone asks about Markdown: it is just text with a bit of structure, headings and dashes.
      Say it once, do not teach it.
      The amber card is the module's commercial argument: for an SME with staff turnover, the
      configuration file and the training manual are the same document. This deck's own repository is

  <section>
    <h2>Chatbot and agentic system</h2>
    <div class="visual-frame media-fit" style="max-width:76%;margin:0 auto;">
      <img src="assets/img/chatbots-vs-agentic-systems-light.png" alt="Chatbots compared with agentic systems">
    </div>
    <aside class="notes">
      Breathing slide: nothing to read, and nothing to add out loud beyond the hinge. Up to here a
      text was written; from here on that text drives something that acts.
      Do not redefine the agentic system: module 2 already defined it - model, loop, tools, memory.
      Here that definition becomes something a company buys and installs. If someone wants the
      difference in one line: a chatbot answers turn by turn, an agentic system pursues a goal longer
      than one turn.
    </aside>
  </section>

  <section>
    <h2>MCP &mdash; reaching the company's systems</h2>
    <p class="quote-line">"Think of MCP like a USB-C port for AI applications. Just as USB-C provides a standardized way to connect electronic devices, MCP provides a standardized way to connect AI applications to external systems." <span class="attrib">&mdash; official MCP documentation</span></p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-mxn-convention.png" alt="Agents and servers exchanging common message envelopes through one shared protocol lane">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Discover</strong><span>The connector says what it can do.</span></div>
        <div class="mini-card"><strong>Call</strong><span>The agent sends a structured request.</span></div>
        <div class="mini-card"><strong>Return</strong><span>The result comes back as new context.</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <p>Without a standard, <strong>n</strong> applications and <strong>m</strong> tools need <strong>n&times;m</strong> pieces of custom wiring. With one protocol, <strong>n+m</strong> are enough &mdash; and the systems the company already has do not have to be rebuilt to be reachable. It moves requests and results: it does not pool the data.</p>
    </div>
    <p class="footnote">Same questions as any integration: whose credentials, what scope, how much trust.</p>
    <aside class="notes">
      Live window, about two minutes: the connector list open in two different products, nothing more.
      It is there to show this is not one vendor's arrangement.
      The quotation is literal and comes from the protocol's own documentation. Deliver it as a
      quotation, not as a house metaphor.
      The n&times;m to n+m arithmetic is the mechanism; the USB-C port is its illustration. If someone
      wants a number: five applications and six tools make thirty custom integrations against eleven.
      Timeline, if the question is "what if they change their minds?": open protocol published on
      25 November 2024, adopted by OpenAI in March 2025 and by Google in April 2025, and donated on
      9 December 2025 to the Agentic AI Foundation, a directed fund of the Linux Foundation
      co-founded with OpenAI and Block. It is no longer governed by one company. Do not go near the
      technical specification.
      The line that matters commercially is the one in the card: their existing systems do not have to
      be rebuilt to be reachable.
      The three moves are the mechanism. The third ties the module back to module 3: a tool result
      does not "go into the model", it lands back on the desk as new context.
      Plant the risk seed here: every connector is also an attack surface. Module 5 opens by
      exploiting exactly this.
      Sources: modelcontextprotocol.io; anthropic.com/news/model-context-protocol;
      anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation.
    </aside>
  </section>

  <section class="practice-slide" data-background-color="#f4f8fb">
    <h2>Spec, verification, and limits outside the model</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>1. The spec stays with whoever commissions the work</h4>
          <p>Every degree of freedom left open is closed with a plausible default, drawn from the training distribution rather than from the case at hand. Specifying means listing what is <strong>not</strong> left to the tool to decide, starting from which <em>decision</em> the work must enable.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>2. Verification runs against the source</h4>
          <p>The criterion is fixed <strong>before</strong> generation, the check runs <strong>after</strong>, against the source document and not against the output. A criterion written after reading the answer bends to the answer.</p>
        </div>
      </div>
      <div class="col stack-sm">
        <p>The three tiers are chosen by <strong>reversibility and cost of error</strong>, not by perceived seriousness, and applied at the tool, not in the prompt.</p>
        <div class="caption-row" style="grid-template-columns:1fr;">
          <div class="mini-card"><strong>Always do</strong><span>Reversible, low cost: runs on its own.</span></div>
          <div class="mini-card"><strong>Ask first</strong><span>Reversible but expensive: confirmation required before acting.</span></div>
          <div class="mini-card"><strong>Never do</strong><span>Irreversible: blocked at the tool, out of the model's reach.</span></div>
        </div>
      </div>
    </div>
    <aside class="notes">
      This slide introduces nothing: it names three things the demo has just made happen. Point 1 is
      the sixth beat (criteria stated aloud before the run), point 2 is the eighth (the table checked
      against the PDFs), point 3 is the fourth (the house rules overridden). If the demo landed, this
      is pointing, not teaching.
      The line above the tiers used to be a fourth card: leave it unspoken, it reads on its own.
      The criterion for the three tiers is reversibility and cost, not perceived seriousness: sending
      the wrong email is irreversible and belongs in the third row even though it feels trivial, while
      rewriting a draft is reversible and belongs in the first even though the text matters. Run the
      exercise out loud on a task of theirs.
      Karpathy's automation thesis: traditional software automates what can be specified; LLMs
      automate what can be VERIFIED, so it pays to make one's own work verifiable. Cherny, creator of
      Claude Code: "Give Claude a way to verify its work... it will 2-3x the quality" - present it as
      a practitioner's estimate, not as a measurement. Shankar et al. (UIST 2024) on criteria drift:
      grading real outputs changes the criteria, so spec and verification feed each other; it is one
      loop, not a pipeline.
      The story to tell, and it is the best content on this slide: Karpathy's agent matched payments
      to accounts by email address instead of a stable identifier. Plausible code, wrong system
      design, caught only by human judgement - and no line-by-line code review would have found it,
      because every line was correct.
      Hand-off to module 5: prose lives in the context, and context can be manipulated.
    </aside>
  </section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-08-ethics.png" data-background-size="cover" data-background-color="#fbfaf6">

    <p class="kicker">Module 5 <span class="mod-clock" data-clock-for="m5"></span></p>
    <h1>Risks and judgement</h1>
    <p class="lede">What goes wrong and who stays responsible.</p>
    <aside class="notes">
      The last module, and the one that makes everything else defensible: the previous four showed
      what the machine can be made to do, this one says on what terms the result holds up in front of
      a client. Three risk owners - the model, the person using it, the data - and then who decides:
      that structure should survive even if every example is forgotten, and it is the one thing worth
      saying twice.
      This is not a module of warnings. Every risk named here already has its counter-move in the
      earlier modules: ground it in documents (M3), write the rules and verify (M4), keep destructive
      actions out of the tool's reach. Say so at the start, or the room stiffens and the closing demo
      reads as a punishment.
      Close on the commitment question: one thing each person will try in the next 30 days. Have it
      written down, not just spoken.
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">model</span> What the model gets wrong</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Hallucination</h4>
        <p>Fluent, confident, false. Structural, not a bug: it is reduced by anchoring it to documents and checking it. Not removed.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Bias</h4>
        <p>With no references of its own it returns the average of what has already been written: the words, patterns and structures the web is full of.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Agreeableness</h4>
        <p>Push back and it retracts &mdash; even when it was right. Finetuning rewards the answers people approve of.</p>
      </div>
    </div>
    <div class="banner-media">
      <img src="assets/img/m05-plausible-path.png" alt="Many thin traces braiding into one confident amber stroke while a few peel away and fade out">
    </div>
    <p class="footnote">The first two come from the engine of Module 1 &mdash; plausible text, not true text. The third comes from how it was finetuned: on human judgements.</p>
    <aside class="notes">
      The causal thread: in Module 1 they watched the engine sample from a distribution with no truth
      oracle attached. The first two cards come from there. Hallucination is also the correct answer
      to one of the ten test items - structural, reduced by grounding in documents and human
      verification, never removed: say it in those words.
      Bias, measured version: Doshi &amp; Hauser, <em>Science Advances</em> 10(28), eadn5290 (2024) -
      an online experiment, peer-reviewed. With a single AI-generated idea, stories become more
      original for the person writing them (+8.1% novelty) but 10.7% more similar to each other. This
      is not a moral judgement on the training data: it is the average of what has already been
      written resurfacing whenever a reference of one's own is missing. It is why the Module 3 ladder
      changes the result, and why in the demo the disciplined prompt pulls a different structure out
      of the same photo. Where the model touches people - hiring, assessment, credit - bias also
      becomes a legal question (AI Act, high-risk systems): name it, do not open it, it is not what
      this course demonstrates.
      Agreeableness, measured version: Sharma et al., ICLR 2024 (Anthropic), across five
      state-of-the-art assistants. When a user challenges a correct answer, models change their
      initial answer between 32% and 86% of the time depending on the model; a user suggesting an
      incorrect answer cuts accuracy by up to 27 points. Mechanism, not motive: finetuning uses human
      judgements, and people prefer answers that confirm what they already think. It is the bridge to
      the third card on the user slide: an assumption planted in the question comes back confirmed.
      The "stochastic parrot" provocation (Bender et al. 2021) belongs here if someone raises it: a
      live debate, not a verdict. Hallucination survey: Ji et al. (2023).
    </aside>
  </section>


  <section data-background-color="#f4f8fb">
    <h2><span class="chip risk">user</span> What happens to the person using it</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="A human silhouette handing an amber thread of thought to a mechanical bracket">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Skill erosion</h4>
          <p>What is delegated gets practised less. Those who trust the tool check less; those who trust themselves check more.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The fluency trap</h4>
          <p>Polished text moves confidence, not accuracy &mdash; and moves it most outside one's own field.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>The question enters the answer</h4>
          <p>An assumption planted in the question comes back as if established. Asking <em>why</em> something is true does not check that it is.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      Make it concrete for a small business: the expert in the room spots a wrong attribution in an
      instant. A junior with the same tool does not, and may never develop the eye if the tool always
      answers first. That is a staffing and training decision, not a technology one.
      First card, and what kind of evidence it is: that what you offload you remember less is old and
      solid (Sparrow, Liu &amp; Wegner 2011, <em>Science</em>, the Google effect). That the underlying
      competence decays is NOT established: do not say it. The closest evidence is Lee, Sarkar,
      Tankelevitch et al., CHI 2025 - 319 knowledge workers, 936 first-hand episodes: higher
      confidence in the tool goes with less critical thinking, higher self-confidence with more. It is
      an association in a self-reported survey, and must be said that way. The Risko &amp; Gilbert
      (2016) review describes when people offload, not that the ability decays.
      Second card: Perry, Srivastava, Kumar &amp; Boneh, CCS 2023 - a controlled user study.
      Participants with the AI assistant wrote significantly less secure code and were more likely to
      believe they had written secure code; and those who trusted it less, working on the wording of
      their prompts, produced fewer vulnerabilities. Domain is code and the model is from 2022: say
      so. The second half of that result is the thesis of part C of the demo, minutes away.
      Third card: closes the thread from Module 3, "ferie" versus "congedi annuali". There it was the
      words that moved retrieval; here it is the assumption that moves generation, because the prompt
      is the text the model continues. The example is spoken aloud, per the sector in the room: "why
      is this coin rarer?" - "why is this plant underperforming?" - "why did this test fail?" - none
      of the three checks that the premise holds. The operating rule to dictate: ask "what is missing
      from this attribution?", not "confirm that this attribution is right".
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">data</span> When text becomes an instruction</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Prompt injection</h4>
          <p>An untrusted document carries a sentence the model <em>executes</em> instead of summarising.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Why it matters now</h4>
          <p>With the tools from Module 4 the model does not only answer: it opens files, writes, sends. Untrusted text stops being data and starts driving an action.</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m07-data-leaks.png" alt="Indirect prompt injection hijacking an agent's tool path and causing unintended data movement">
      </div>
    </div>
    <aside class="notes">
      The line not to lose: while the model only writes text, a hidden instruction produces a wrong
      answer; once it has tools, it produces an action. The connectors in Module 4 widened the attack
      surface an hour ago, in this same room.
      Injection has no clean fix - it is not a bug closed by a patch, it follows from instructions and
      data reaching the model through the same channel, as text. So you design for least privilege:
      the tool sees only the folder it needs, and destructive actions sit in the "never do" tier of the
      table they already saw in M4.
      In a few minutes part B of the demo runs the exact request of m4-p7 against the poisoned folder:
      the only changed variable is the document. Then open the PDF, Ctrl+A, and reveal the grey text.
      Do not pre-announce it: let it derail.
      Sources: Greshake et al. (2023), <em>Indirect Prompt Injection</em>; OWASP Top 10 for LLM
      applications.
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">data</span> Who sees this data</h2>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <h4>The question</h4>
      <p>Who can see the questions and the uploaded files? The answer depends on the tool and the contract, not on the model.</p>
    </div>
    <div class="caption-row" style="grid-template-columns:repeat(4,1fr);margin-top:.6em;">
      <div class="mini-card"><strong>Free app</strong><span>Is the data used for training? Where is that written, and since when?</span></div>

      This is the pre-demo. The four columns are written as questions rather than guarantees on
      purpose: terms differ by vendor, by plan and over time, and you are not their lawyer. What always

  <section>
    <h2>The human in the loop</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/human-loop.png" alt="A green and violet loop meeting at amber checkpoints">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Why oversight slackens</h4>
          <p>The system is usually right, and attention moves elsewhere. It holds for experts as much as for novices, and it is not fixed by telling people to be careful.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>What stopped it</h4>
          <p>Five minutes ago it was not an automated check: it was someone who knew the piece and could say no.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The same tool, the other way round</h4>
          <p>Have it argue the opposite, ask it what is missing, be interrogated by it. Those who interrogate it rather than delegate to it get better results.</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>The test</h4>
      <p>Oversight is real only if someone can <strong>understand</strong>, <strong>challenge</strong> and <strong>overturn</strong>. Missing any of the three, it is a rubber stamp.</p>
    </div>
    <aside class="notes">
      The first card is the point worth defending, and it is measured: Parasuraman &amp; Manzey,
      <em>Human Factors</em> 52(3) 381-410 (2010), a review integrating the empirical studies on
      automation complacency. Two verbatim conclusions: complacency "is found in both naive and expert
      participants and cannot be overcome with simple practice", and automation bias "cannot be
      prevented by training or instructions". Said in the room: experience does not protect, and
      telling people to pay attention is not a control. The remedy is not goodwill, it is design - the
      guardrail tiers they saw in M4.
      The classic, to be presented as an argument and not as a measure: Bainbridge,
      <em>Ironies of Automation</em>, <em>Automatica</em> 19(6) 775-779 (1983). The more reliable the
      automation, the less practised the operator remains at taking over exactly when they must.
      And vigilance cannot be intermittent: success on one task does not license trust on the next,
      because the boundary between the two is declared nowhere.
      Third card, the cheerful one, said without inflating it: what is measured is that those who
      trusted it less and worked on their phrasing got better results (Perry et al., CCS 2023), and
      that with AI the cognitive work does not vanish but shifts towards verification and oversight
      (Lee et al., CHI 2025). That this builds expertise over time is NOT established: do not promise
      it. Promise the posture - asking "what is missing" and "argue the opposite" instead of "confirm
      this" - which is the same operating rule dictated on the user slide.
      For an auction house the point is sharp: responsibility towards buyers is not delegated to a
      model, neither legally nor reputationally. They have just watched the expert overturn it live:
      point at that moment, do not re-explain it.
    </aside>
  </section>

    <aside class="notes">
      Claude Code: open it and show a session, <strong>without starting a real task</strong>. The

      Launch it from the phone in front of them: the surprise is the point, and the line to say is
      "autonomy on a leash" - it runs by itself, but a person set the perimeter. About 2 minutes.

    <div class="cols top">

        <text x="170" y="372" text-anchor="middle" class="mono-label">ogni parola confrontata con ogni</text>
        <text x="170" y="390" text-anchor="middle" class="mono-label">altra, in parallelo</text>
        <text x="500" y="258" text-anchor="middle" class="mono-label">2022</text>
        <text x="500" y="345" text-anchor="middle" class="label">istruzioni</text>

    </div>
    <div class="takeaway">Tre salti: dalle regole ai dati, dai dati ai vettori, dal completamento all'istruzione.</div>
    <aside class="notes">
      Due minuti, non di pi&ugrave;: la timeline &egrave; una lista di scelte tecniche, non un racconto.
      Le tre fermate da dire ad alta voce. 2013 (Mikolov): le parole diventano vettori, la vicinanza
      nello spazio &egrave; somiglianza di significato &mdash; &egrave; il meccanismo che ritrover&agrave;
      nel modulo 3 quando parliamo di retrieval. 2017 (Vaswani): l'attenzione permette di confrontare
      ogni parola con ogni altra in parallelo, e questo rende pratico l'addestramento su larga scala;
      non aprire l'encoder-decoder. 2022 (Ouyang, InstructGPT): l'addestramento con feedback umano
      aggiunge il seguire istruzioni al semplice completare il testo &mdash; &egrave; la differenza fra
      un modello che continua una frase e l'assistente che usano tutti i giorni, e il motivo per cui
      il modulo 4 funziona. Fonti: Mikolov (2013); Vaswani (2017); Brown (2020); Ouyang (2022).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Tre livelli, una macchina</h2>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit levels-frame">
        <img src="assets/img/m01-levels-machine-v2.png" alt="Sezione della macchina a tre livelli: substrato probabilistico dei token, livello dei concetti appresi, livello del giudizio umano">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4><span class="chip safe">macro</span> Giudizio</h4>
          <p>La persona che accetta o rifiuta l'output.</p>
          <p class="ask">&rarr; &laquo;chi risponde se &egrave; sbagliato?&raquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">meso</span> Il sistema</h4>
          <p>Memoria, strumenti, skill, connettori. <strong>&Egrave; qui che si lavora.</strong></p>
          <p class="ask">&rarr; &laquo;perch&eacute; non conosce il nostro listino?&raquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">micro</span> La base</h4>
          <p>Probabilit&agrave; sul pezzo di testo successivo. Sempre attiva.</p>
          <p class="ask">&rarr; &laquo;perch&eacute; sbaglia a contare le lettere?&raquo;</p>
        </div>
      </div>
    </div>
    <div class="takeaway">&laquo;&Egrave; solo statistica&raquo; &egrave; vero alla base e inutile al livello dove si lavora.</div>
    <aside class="notes">
      La spina dorsale del deck: la slide da difendere se il tempo stringe. Livello mesoscopico di
      Cristianini: micro = neuroni, meso = le idee astratte che il modello si &egrave; costruito da
      solo, macro = comportamento letto quasi psicologicamente. Copri il fianco: &egrave; una tesi sul
      LIVELLO di descrizione giusto (Marr 1982), NON sul fatto che il modello sia diventato una mente.
      "&Egrave; solo statistica sulle parole" &egrave; vero al micro e inutile al meso, che &egrave;
      dove sta il loro lavoro vero. Ogni modulo successivo risponde a: a che livello siamo?
      Le tre frecce sono l'indice del resto del corso: macro &rarr; modulo 5, meso &rarr; moduli 3-4,
      micro &rarr; la slide successiva. Usale cos&igrave;.
    </aside>
  </section>

  <section>
    <h2>Token, non parole</h2>
    <ul class="slide-list">
      <li>La macchina non vede lettere: vede <strong>pezzi di parola</strong>, scelti per frequenza sui dati.</li>
      <li>Regola pratica: <strong>1 token &asymp; 4 caratteri &asymp; 3/4 di parola</strong> (in inglese).</li>
      <li>Il token &egrave; l'unit&agrave; di <strong>prezzo</strong> e di <strong>memoria</strong> &mdash; e non tutte le lingue costano uguale.</li>
    </ul>
    <div class="visual-frame">
      <div class="tokenizer-widget" data-tokenizer-widget>
        <div class="prompt-switcher token-presets" role="group" aria-label="Scegli una frase da tokenizzare">

          <button type="button" data-sentence="Il lotto pesa 12,7 grammi, coniato nel 42 a.C." aria-pressed="false">numeri</button>
          <button type="button" data-sentence="L'intelligenza artificiale aiuta la traduzione." aria-pressed="false">italiano</button>
          <button type="button" data-sentence="Artificial intelligence helps translation." aria-pressed="false">inglese</button>
        </div>
        <textarea class="tokenizer-input" rows="2" aria-label="Frase da tokenizzare">La tokenizzazione divide il testo in pezzi di parola.</textarea>
        <div class="token-output" data-token-output></div>

      </div>
    </div>
    <p class="footnote">Tokenizer reale: <code>cl100k_base</code>, la codifica della famiglia GPT-4. Il colore del pezzo indica quanto &egrave; frequente.</p>
    <aside class="notes">
      Dal vivo e a basso carico. Scrivi nella casella una loro parola: un termine numismatico, il nome
      di un cliente &mdash; pi&ugrave; &egrave; raro, in pi&ugrave; pezzi si spezza (e il colore lo mostra).
      Il preset "lettere" &egrave; lo sfata-miti pi&ugrave; rapido del deck: " strawberry" &egrave; UN
      token solo, quindi il modello non ha mai visto le singole r. Non fallisce per stupidit&agrave;,
      fallisce perch&eacute; le lettere non gli arrivano.
      Il confronto italiano/inglese &egrave; il momento che interessa a un titolare: la stessa frase
      vale 14 token in italiano e 6 in inglese (3,4 contro 7,0 caratteri per token). Stesso significato,
      pi&ugrave; del doppio di costo e di finestra consumata.
      Fonti: Sennrich et al. (2016) per il BPE; OpenAI (1 token &asymp; 4 caratteri); Petrov et al.
      (NeurIPS 2023) per il divario fra lingue.
    </aside>
  </section>

  <section>
    <h2>Un'operazione, ripetuta</h2>
    <div class="cols">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li>Calcola le probabilit&agrave; del pezzo successivo, <strong>ne sceglie uno</strong>, lo aggiunge, ricomincia.</li>
          <li>Quello che scrive rientra in ci&ograve; che legge: <strong>le prime scelte orientano tutte le successive</strong>.</li>
          <li>Non consulta nessun archivio &mdash; sceglie, un pezzo alla volta.</li>
        </ul>
      </div>
      <div class="col visual-frame">
        <div class="prob-widget" data-next-token-widget>
          <div class="prompt-switcher" role="group" aria-label="Scegli una frase iniziale">

            <button type="button" data-prompt="Il preventivo deve indicare il" aria-pressed="false">preventivo</button>
            <button type="button" data-prompt="La moneta &egrave; stata coniata in" aria-pressed="false">moneta</button>
            <button type="button" data-prompt="Per verificare il risultato bisogna" aria-pressed="false">verifica</button>
          </div>

          <div class="bar-list"></div>
          <p class="temp-warning">Probabilit&agrave; reali &mdash; gpt-3.5-turbo-instruct, temperatura 1, prime 5 su tutto il vocabolario.</p>
        </div>

    </div>
    <aside class="notes">
      Formula tolta dalla slide di proposito; dilla se te la chiedono. Martella il ciclo: ogni parola
      che scrive entra in ci&ograve; che legge dopo, quindi le scelte iniziali orientano quelle
      successive. Allucinazione, creativit&agrave; e fluidit&agrave; nascono tutte da questo stesso
      meccanismo. Anticipa la temperatura. Le barre sono probabilit&agrave; VERE, misurate una volta sola sull'API
      OpenAI (gpt-3.5-turbo-instruct, temperatura 1): non sono normalizzate, e la barra grigia
      &egrave; tutto il resto del vocabolario.
      Il confronto che fa il lavoro: &laquo;capitale&raquo; d&agrave; Roma all'81%, &laquo;moneta coniata in&raquo;
      d&agrave; il primo candidato all'8%. Stessa macchina, sicurezza opposta &mdash; e in entrambi i casi
      scrive con lo stesso tono. Nota anche che alcuni candidati (pre, arg, es) sono pezzi di parola,
      non parole: &egrave; il tokenizer di due slide fa.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Temperatura: la manopola della casualit&agrave;</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Bassa &middot; 0,2&ndash;0,5</h4>
          <p>La distribuzione si stringe sul candidato pi&ugrave; probabile.</p>
          <p class="ask">&rarr; estrazione dati, classificazione, output ripetibili</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Alta &middot; 1,0&ndash;2,0</h4>

          <h4>Sempre</h4>
          <p>Ridistribuisce le probabilit&agrave;, <strong>non aggiunge conoscenza</strong>. A T&nbsp;=&nbsp;0 un errore diventa solo un errore ripetibile.</p>
        </div>
      </div>
      <div class="col visual-frame">

        </div>

    <div class="takeaway">La casualit&agrave; &egrave; un'impostazione, non un carattere.</div>
    <aside class="notes">
      Il momento interattivo migliore del deck: trascina lo slider lentamente fino ai due estremi e
      lascia che guardino muoversi le barre. La base sono i cinque candidati veri della slide
      precedente (rinormalizzati fra loro), e lo slider applica la formula vera: softmax(logit/T).
      Se hai un solo minuto, la riga da dire &egrave; la terza card: la temperatura sposta probabilit&agrave;,
      non conoscenza. A T&nbsp;=&nbsp;0 il modello ripete l'errore invece di correggerlo &mdash; &egrave; il
      misconcetto che tornerai a smontare nel modulo 5.

      <h4>Quello che &laquo;serve&raquo; sta quasi sempre intorno.</h4>
    </div>
    <div class="takeaway">La prova: cambia il modello stesso, o solo ci&ograve; che gli viene dato?</div>
    <aside class="notes">
      La buona notizia per una PMI sta tutta nella scheda di destra: un modello di frontiera non
      potete riaddestrarlo, e non ve ne serve. Tutto ci&ograve; che render&agrave; utile questa
      tecnologia nella loro azienda sta "intorno" &mdash; e l'intorno costa poco, si fa in fretta e

  <section>
    <h2>Come si costruisce un modello</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-training-pipeline.png" alt="Infografica in tre fasi: pre-addestramento, messa a punto supervisionata, allineamento con preferenze umane">
      </div>
      <div class="vertical-captions">
        <p class="cap-eyebrow">Ieri &mdash; l'unico che sappiamo per intero</p>
        <div class="mini-card"><strong>1. Legge testo</strong><span>Prevede la parola successiva su quantit&agrave; enormi di scritto.</span><span class="fig">300 miliardi di token</span></div>
        <div class="mini-card"><strong>2. Impara a seguire istruzioni</strong><span>Degli esempi gli insegnano a svolgere un compito, non solo a continuare il testo.</span><span class="fig">~13.000 esempi scritti a mano</span></div>
        <div class="mini-card"><strong>3. Regolato dal feedback umano</strong><span>Delle persone giudicano le risposte; il modello viene spinto verso quelle preferite.</span><span class="fig">~33.000 confronti, ~40 persone</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <h4>Oggi</h4>
      <p>Llama 3: <strong>~15.000 miliardi di token</strong> al passo 1, cinquanta volte InstructGPT &mdash; e una parte crescente degli esempi dei passi 2 e 3 la generano <strong>altri modelli</strong>, non delle persone.</p>
    </div>
    <div class="takeaway">Il sapere viene dal passo 1. Il comportamento da assistente dai passi 2 e 3.</div>
    <aside class="notes">
      Convinzione comune in sala: "il modello &egrave; una cosa sola addestrata che sa dei fatti".
      Correggila qui, e correggi anche te stesso: i tre numeri sono di UN modello preciso &mdash;
      InstructGPT, 2022, l'antenato di ChatGPT, costruito sopra GPT-3. &Egrave; l'unico caso della
      famiglia con un rendiconto pubblico completo dei tre passi. Per altri modelli cambiano di
      ordini di grandezza: la forma della pipeline resta, le cifre no.
      La striscia "Oggi" &egrave; la riga onesta del modulo: dice che quello che stanno imparando ha
