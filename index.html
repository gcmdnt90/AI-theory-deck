  <section data-nid="01-words#3" data-min="2">
    <h2>Token, non parole</h2>
    <ul class="slide-list">
      <li>La macchina non vede lettere: vede <strong>pezzi di parola</strong>, scelti per frequenza sui dati.</li>
      <li>Regola pratica: <strong>1 token &asymp; 4 caratteri &asymp; 3/4 di parola</strong> (in inglese).</li>
      <li>Il token &egrave; l'unit&agrave; di <strong>prezzo</strong> e di <strong>memoria</strong> &mdash; e non tutte le lingue costano uguale.</li>
    </ul>
    <div class="visual-frame">
      <div class="tokenizer-widget" data-tokenizer-widget>
        <div class="prompt-switcher token-presets" role="group" aria-label="Scegli una frase da tokenizzare">
          <button type="button" data-sentence="La tokenizzazione divide il testo in pezzi di parola." aria-pressed="true">sotto-parola</button>
          <button type="button" data-sentence="Conta la lettera r in strawberry." aria-pressed="false">lettere</button>
          <button type="button" data-sentence="Il lotto pesa 12,7 grammi, coniato nel 42 a.C." aria-pressed="false">numeri</button>
          <button type="button" data-sentence="L'intelligenza artificiale aiuta la traduzione." aria-pressed="false">italiano</button>
          <button type="button" data-sentence="Artificial intelligence helps translation." aria-pressed="false">inglese</button>
        </div>
        <textarea class="tokenizer-input" rows="2" aria-label="Frase da tokenizzare">La tokenizzazione divide il testo in pezzi di parola.</textarea>
        <div class="token-output" data-token-output></div>
        <div class="token-stats" data-token-stats></div>
        <div class="token-explainer" data-token-explainer>Passa sopra o tocca un token per vedere quanto &egrave; frequente.</div>
      </div>
    </div>
    <p class="footnote">Tokenizer reale: <code>cl100k_base</code>, la codifica della famiglia GPT-4. Il colore del pezzo indica quanto &egrave; frequente.</p>
    <aside class="notes">
      <p>Slide dal vivo e a basso carico. Nella casella si scrive una parola del mestiere di chi ascolta &mdash; un termine tecnico, il nome di un cliente: più è rara, in più pezzi viene spezzata, e il colore lo mostra.</p>
      <p>Il preset «lettere» è lo sfata-miti più rapido del deck: «&nbsp;strawberry» è UN token solo, quindi il modello non ha mai visto le singole r. Non sbaglia per stupidità: sbaglia perché le lettere non gli arrivano.</p>
      <p>Il confronto italiano/inglese è il momento che interessa a un titolare. La stessa frase vale 14 token in italiano e 6 in inglese (3,4 contro 7,0 caratteri per token): stesso significato, più del doppio di costo e di finestra consumata.</p>
      <p><strong>Approfondimento.</strong> Sennrich et al. (2016) per il BPE; OpenAI per la regola pratica di 1 token &asymp; 4 caratteri; Petrov et al. (NeurIPS 2023) per il divario fra lingue.</p>
    </aside>
  </section>

  <section data-nid="01-words#4" data-min="1">
    <h2>Un'operazione, ripetuta</h2>
    <div class="cols">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li>Calcola le probabilit&agrave; del pezzo successivo, <strong>ne sceglie uno</strong>, lo aggiunge, ricomincia.</li>
          <li>Quello che scrive rientra in ci&ograve; che legge: <strong>le prime scelte orientano tutte le successive</strong>.</li>
          <li>Non consulta nessun archivio &mdash; sceglie, un pezzo alla volta.</li>
        </ul>
      </div>
      <div class="col visual-frame">
        <div class="prob-widget" data-next-token-widget>
          <div class="prompt-switcher" role="group" aria-label="Scegli una frase iniziale">
            <button type="button" data-prompt="La capitale d'Italia &egrave;" aria-pressed="true">capitale</button>
            <button type="button" data-prompt="Il preventivo deve indicare il" aria-pressed="false">preventivo</button>
            <button type="button" data-prompt="La moneta &egrave; stata coniata in" aria-pressed="false">moneta</button>
            <button type="button" data-prompt="Per verificare il risultato bisogna" aria-pressed="false">verifica</button>
          </div>
          <div class="prompt-display" data-prompt-text>La capitale d'Italia &egrave;</div>
          <div class="bar-list"></div>
          <p class="temp-warning">Probabilit&agrave; reali &mdash; gpt-3.5-turbo-instruct, temperatura 1, prime 5 su tutto il vocabolario.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>Il punto da martellare è il ciclo: ogni parola scritta entra in ciò che viene letto al passo dopo, quindi le scelte iniziali orientano tutte quelle successive. Allucinazione, creatività e fluidità nascono da questo stesso meccanismo.</p>
      <p>Le barre sono probabilità <strong>vere</strong>, misurate una volta sola sull'API OpenAI (gpt-3.5-turbo-instruct, temperatura 1). Non sono normalizzate: la barra grigia è tutto il resto del vocabolario.</p>
      <p>Il confronto che fa il lavoro: «capitale» dà Roma all'81%, «moneta coniata in» dà il primo candidato all'8%. Stessa macchina, sicurezza opposta &mdash; e in entrambi i casi scrive con lo stesso tono. Da notare anche che alcuni candidati (pre, arg, es) sono pezzi di parola e non parole: è il tokenizer di due slide prima.</p>
      <p>La formula è tenuta fuori dalla slide di proposito, e si dice solo se la si chiede.</p>
    </aside>
  </section>

  <section data-nid="01-words#5" data-min="1" data-background-color="#f4f8fb">
    <h2>Temperatura: la manopola della casualit&agrave;</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Bassa &middot; 0,2&ndash;0,5</h4>
          <p>La distribuzione si stringe sul candidato pi&ugrave; probabile.</p>
          <p class="ask">&rarr; estrazione dati, classificazione, output ripetibili</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Alta &middot; 1,0&ndash;2,0</h4>
          <p>La distribuzione si appiattisce: entrano i candidati rari.</p>
          <p class="ask">&rarr; varianti, riformulazioni, brainstorming</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Sempre</h4>
          <p>Ridistribuisce le probabilit&agrave;, <strong>non aggiunge conoscenza</strong>. A T&nbsp;=&nbsp;0 un errore diventa solo un errore ripetibile.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="temp-widget" data-temp-widget>
          <p class="micro">T = <span data-temp-value>0.7</span></p>
          <input class="temp-slider" type="range" min="0.2" max="2.0" step="0.1" value="0.7" aria-label="Temperatura">
          <div class="bar-list"></div>
          <svg class="temp-distribution" viewBox="0 0 520 185" data-temp-distribution role="img" aria-label="Curva di distribuzione delle probabilit&agrave; in tempo reale"></svg>
          <p class="temp-warning">Logit reali: il logaritmo delle probabilit&agrave; misurate. Il ricalcolo con T &egrave; la formula vera.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">La casualit&agrave; &egrave; un'impostazione, non un carattere.</div>
    <aside class="notes">
      <p>Il momento interattivo migliore del deck: lo slider va trascinato lentamente fino ai due estremi, lasciando che siano le barre a parlare. La base sono i cinque candidati veri della slide precedente, rinormalizzati fra loro, e lo slider applica la formula vera: softmax(logit/T).</p>
      <p>Se resta un minuto solo, la riga da dire è la terza card: la temperatura sposta probabilità, non conoscenza. A T&nbsp;=&nbsp;0 il modello ripete l'errore invece di correggerlo, ed è il misconcetto che si smonta di nuovo nel modulo 5.</p>
      <p>Da qui si entra direttamente nella demo: sta per arrivare la stessa richiesta con quattro risposte diverse.</p>
    </aside>
  </section>

</section>

<section>

  <section data-nid="02-inside-around#0" data-min="1" class="module-cover" data-background-image="assets/img/module-03-architectures.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">02</span>
    <p class="kicker">Modulo 2 <span class="mod-clock" data-clock-for="m2"></span></p>
    <h1>Dentro il modello</h1>
    <p class="lede">Che cos&rsquo;&egrave;, come si costruisce, e che cosa vuol dire &laquo;ragiona&raquo;.</p>
    <aside class="notes">
      <p>La correzione concettuale più utile del corso. Quasi ogni domanda del tipo «l'AI sa fare X?» è in realtà una domanda su quale lato di questo confine si trovi X.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#1" data-min="3" data-background-color="#f4f8fb">
    <h2>Tre livelli, una macchina</h2>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit levels-frame">
        <img src="assets/img/m01-levels-machine-v2.png" alt="Sezione della macchina a tre livelli: substrato probabilistico dei token, livello dei concetti appresi, livello del giudizio umano">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4><span class="chip safe">macro</span> Giudizio</h4>
          <p>La persona che accetta o rifiuta l'output.</p>
          <p class="ask">&rarr; &laquo;chi risponde se &egrave; sbagliato?&raquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">meso</span> Il sistema</h4>
          <p>Memoria, strumenti, skill, connettori. <strong>&Egrave; qui che si lavora.</strong></p>
          <p class="ask">&rarr; &laquo;perch&eacute; non conosce il nostro listino?&raquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">micro</span> La base</h4>
          <p>Probabilit&agrave; sul pezzo di testo successivo. Sempre attiva.</p>
          <p class="ask">&rarr; &laquo;perch&eacute; sbaglia a contare le lettere?&raquo;</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <h4>Dentro c'&egrave; il processore. Intorno c'&egrave; tutto il resto &mdash; ed &egrave; intorno che si lavora.</h4>
      <p>Un modello di frontiera non lo riaddestrate, e non ve ne serve. L'impalcatura si costruisce oggi, e si disfa.</p>
    </div>
    <div class="takeaway">La prova: cambia il modello stesso, o solo ci&ograve; che gli viene dato?</div>
    <aside class="notes">
      <p>La spina dorsale del deck: la slide da difendere se il tempo stringe, e l'unico punto in cui si dice la faccenda del dentro/intorno. Prima la si diceva due volte, a dieci minuti di distanza, con due immagini e due vocabolari: era quella la ripetizione che la sala sentiva. Detta una volta qui, dopo ci si rimanda soltanto.</p>
      <p>Livello mesoscopico di Cristianini: micro = neuroni, meso = le idee astratte che il modello si è costruito da solo, macro = comportamento letto quasi psicologicamente. Il fianco va coperto: è una tesi sul <em>livello</em> di descrizione giusto (Marr 1982), non sul fatto che il modello sia diventato una mente. «È solo statistica sulle parole» è vero al micro e inutile al meso, che è dove sta il lavoro vero di chi ascolta.</p>
      <p>La scheda ambra è l'argomento commerciale, ed è la buona notizia per una PMI: un modello di frontiera non si riaddestra, e non serve. Tutto ciò che renderà utile questa tecnologia in azienda sta intorno &mdash; e l'intorno costa poco, si fa in fretta e si può disfare. Detto esplicitamente, riformula la giornata da «progetto AI costoso» a «configurazione».</p>
      <p>Il takeaway è la prova che si userà tutto il giorno: ha cambiato il modello, o solo quello che al modello è stato dato? Le tre frecce sono l'indice del resto del corso: macro &rarr; modulo 5, meso &rarr; moduli 3 e 4, micro &rarr; il modulo appena finito. Questo modulo è la metà di sinistra; il resto della giornata è la metà di destra.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#2" data-min="2">
    <h2>Come si costruisce un modello</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-training-pipeline.png" alt="Infografica in tre fasi: pre-addestramento, messa a punto supervisionata, allineamento con preferenze umane">
      </div>
      <div class="vertical-captions">
        <p class="cap-eyebrow">Ieri &mdash; l'unico che sappiamo per intero</p>
        <div class="mini-card"><strong>1. Legge testo</strong><span>Prevede la parola successiva su quantit&agrave; enormi di scritto.</span><span class="fig">300 miliardi di token</span></div>
        <div class="mini-card"><strong>2. Impara a seguire istruzioni</strong><span>Degli esempi gli insegnano a svolgere un compito, non solo a continuare il testo.</span><span class="fig">~13.000 esempi scritti a mano</span></div>
        <div class="mini-card"><strong>3. Regolato dal feedback umano</strong><span>Delle persone giudicano le risposte; il modello viene spinto verso quelle preferite.</span><span class="fig">~33.000 confronti, ~40 persone</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <h4>Oggi</h4>
      <p>Llama 3: <strong>~15.000 miliardi di token</strong> al passo 1, cinquanta volte InstructGPT &mdash; e una parte crescente degli esempi dei passi 2 e 3 la generano <strong>altri modelli</strong>, non delle persone.</p>
    </div>
    <div class="takeaway">Il sapere viene dal passo 1. Il comportamento da assistente dai passi 2 e 3.</div>
    <aside class="notes">
      <p>Convinzione comune in sala: «il modello è una cosa sola addestrata che sa dei fatti». Si corregge qui &mdash; e conviene correggersi anche da soli, perché i tre numeri sono di <em>un</em> modello preciso: InstructGPT, 2022, l'antenato di ChatGPT, costruito sopra GPT-3. È l'unico caso della famiglia con un rendiconto pubblico completo dei tre passi. Per altri modelli cambiano di ordini di grandezza: la forma della pipeline resta, le cifre no.</p>
      <p>La striscia «Oggi» è la riga onesta del modulo: dice che quello che si sta imparando ha una data di scadenza. Se il tempo stringe si può lasciare a schermo senza commentarla.</p>
      <p>Due agganci da tenere in tasca. Il passo 3 spinge il modello verso ciò che è piaciuto ai valutatori: da lì nasce l'accondiscendenza, non da una volontà di compiacere &mdash; e la si raccoglie nel modulo 5. I dati sintetici del passo 2 sono la stessa cosa che sta dietro alle schede finte usate nelle demo di oggi.</p>
      <p><strong>Fonti.</strong> Brown (2020) per GPT-3; Ouyang (2022) per i tre numeri; Llama 3 (2024) per la striscia «Oggi»; Christiano (2017) per il feedback umano.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#3" data-min="3">
    <h2>&quot;Ragionamento&quot;: addestrato o indotto</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">dentro</span> Addestrato</h4>
          <p>Addestrato con apprendimento per rinforzo a deliberare prima di rispondere: autoverifica e ripensamenti <strong>emergono dall'addestramento</strong>, non da un'istruzione.</p>
          <p class="ask">&rarr; le versioni &laquo;thinking&raquo; di ChatGPT, Claude, Gemini e Copilot; DeepSeek-R1 &egrave; quella con il rendiconto pubblico</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">intorno</span> Indotto</h4>
          <p>Lo si chiede nel prompt: &laquo;elenca prima i criteri, poi decidi&raquo;.</p>
          <p class="ask">&rarr; gratis, su qualsiasi modello, anche gratuito</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="reason-widget" data-reason-widget>
          <div class="mode-buttons">
            <button type="button" data-mode="trained" aria-pressed="true">Addestrato</button>
            <button type="button" data-mode="prompted" aria-pressed="false">Indotto</button>
          </div>
          <div class="reason-diagram" data-reason-diagram></div>
          <p class="reason-copy" data-reason-copy></p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>L'interruttore non inietta un prompt: <strong>attiva una modalit&agrave; del modello</strong> &mdash; e oggi &egrave; il modello stesso a decidere quanto pensare. Istruzioni scritte, liste di task e cicli esistono, ma sono impalcatura: modulo 4.</p>
    </div>
    <div class="takeaway">I passaggi visibili sono testo prodotto, non il verbale di come ci &egrave; arrivato.</div>
    <p class="footnote">Ci&ograve; che scorre a schermo &egrave; un riassunto generato dal modello, non la traccia interna (OpenAI).</p>
    <aside class="notes">
      <p>Due delle tre cose sono ragionamento, la terza no, e in sala vengono confuse tutte e tre.</p>
      <p><strong>Indotto</strong> &mdash; lo si chiede nel prompt, il modello scrive i passaggi come normale output, il modello non cambia.<br>
      <strong>Impalcatura</strong> &mdash; system prompt, file di istruzioni e personalità riletti a ogni richiesta, liste di task, cicli, strumenti. Esiste davvero, ma è il modulo 4, e non è ciò che rende «di ragionamento» un modello.<br>
      <strong>Addestrato</strong> &mdash; apprendimento per rinforzo: la capacità sta nei pesi. DeepSeek-R1 lo dimostra pubblicamente, con RL puro e senza tracce di ragionamento scritte da umani: autoverifica, verifica e cambio di strategia emergono dall'addestramento. OpenAI dice lo stesso di o1: «our large-scale reinforcement learning algorithm teaches the model how to think productively using its chain of thought».</p>
      <p>Che cosa fa il pulsante, se lo chiedono: non inietta istruzioni, attiva una modalità tecnica. Su Claude era un budget di token di pensiero (parametro <code>thinking</code> + <code>budget_tokens</code>, fino alla 4.6); dalla 4.7 quel parametro è stato rimosso e sostituito da adaptive thinking con un livello di sforzo, e il modello decide da sé se e quanto pensare. Su ChatGPT scegliere la versione «thinking» instrada su un modello diverso. I numeri di versione invecchiano in settimane: vivono qui, non a schermo, e vanno controllati contro la data di edizione del deck.</p>
      <p><strong>Perché il takeaway.</strong> Turpin et al. (2023) hanno infilato un indizio orientante nell'input &mdash; per esempio la risposta corretta sempre nella stessa posizione. I modelli si facevano orientare, sbagliavano, e nella catena non nominavano mai l'indizio: costruivano una giustificazione plausibile per la risposta sbagliata, fino a &minus;36% di accuratezza su 13 compiti. L'indizio è lo strumento di misura, non un consiglio per la platea, e non va messo a schermo.</p>
      <p>Questa slide è il primo deposito della vigilanza che si raccoglie nel modulo 5 (item «la fluidità non è prova di accuratezza»). La demo D2 la fa atterrare: l'interruttore è il tipo addestrato, «elenca prima i criteri» è quello indotto.</p>
      <p><strong>Fonti.</strong> DeepSeek-R1 (2025); OpenAI, <em>Learning to reason with LLMs</em> (2024); Turpin et al. (2023); Wei et al. (2022); Nye et al. (2021).</p>
    </aside>
  </section>

<section>

  <section data-nid="03-context-grounding#0" data-min="1" class="module-cover" data-background-image="assets/img/module-04-context-memory.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">03</span>
    <p class="kicker">Modulo 3 <span class="mod-clock" data-clock-for="m3"></span></p>
    <h1>Da dove prende quello che non sa</h1>
    <p class="lede">Come la macchina arriva a conoscere <em>un'azienda</em>.</p>
    <aside class="notes">
      <p>Il modulo con il valore commerciale più diretto. La distinzione centrale: il contesto è ciò che il modello ha davanti adesso, la memoria è ciò che sopravvive fra una sessione e l'altra. Entrambe stanno «intorno».</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#1" data-min="2">
    <h2>La finestra di contesto</h2>
    <p>Il contesto &egrave; la scrivania del modello: tutto ci&ograve; che vede mentre risponde a questa domanda.</p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m04-context-ram.png" alt="Finestra di contesto simile a una RAM con segmenti di token caricati negli slot di memoria immediata">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Regole</strong><span>Le istruzioni stanno davanti sulla scrivania.</span><span class="fig">ci restano solo se sono scritte: modulo 4</span></div>
        <div class="mini-card"><strong>Conversazione + documenti</strong><span>Si contendono lo stesso spazio finito.</span><span class="fig">si misura in token, quelli esposti precedentemente</span></div>
        <div class="mini-card"><strong>Spazio per rispondere</strong><span>Anche la risposta ha bisogno di posto sulla scrivania.</span><span class="fig">scrivania piena, risposta pi&ugrave; corta</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <p>Ogni domanda rispedisce <strong>tutta</strong> la conversazione. Quando non ci sta pi&ugrave;, la parte pi&ugrave; vecchia viene riassunta o tagliata &mdash; e bisogna prestare attenzione a quando accade.</p>
    </div>
    <div class="takeaway">La scrivania viene svuotata dopo ogni domanda, se non ci vengono rimesse le cose.</div>
    <aside class="notes">
      <p>L'immagine della scrivania svuotata è quella da portarsi via. Spiega da sola perché una chat nuova «dimentica», perché i thread lunghi peggiorano, e perché il file di istruzioni del modulo 4 conta.</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#2" data-min="2" data-background-color="#f4f8fb">
    <h2>Il problema del contesto</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <p>Le finestre dichiarate sono passate da <strong>~2.000 token</strong> (2020) a <strong>~1.000.000</strong> su alcuni modelli: da poche pagine a qualche centinaio.</p>
        <p>Ma la finestra dichiarata non &egrave; quella utile:</p>
        <ul class="slide-list">
          <li>ci&ograve; che sta all'<strong>inizio</strong> e alla <strong>fine</strong> viene usato meglio di ci&ograve; che finisce sepolto in mezzo;</li>
          <li>a 32.000 token <strong>11 modelli su 13</strong> scendono sotto met&agrave; del punteggio che ottengono sui testi brevi.</li>
        <li>e quando la finestra si riempie, la parte pi&ugrave; vecchia viene <strong>riassunta o tagliata</strong>: in automatico, con perdita, e senza avviso.</li>
        </ul>
        <p class="ask">&rarr; pochi documenti pertinenti battono &laquo;incollo tutto&raquo;</p>
        <div class="takeaway">Che cosa ci si mette dentro, e in che ordine, conta ancora.</div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/middle_sag.png" alt="Curva &laquo;perso nel mezzo&raquo;: accuratezza pi&ugrave; bassa per le informazioni collocate a met&agrave; del contesto">
      </div>
    </div>
    <p class="footnote">Grafico: Liu et al., &laquo;Lost in the Middle&raquo; (TACL 2024), gpt-3.5-turbo su 20 documenti recuperati. Il dato sui 32.000 token: NoLiMa (ICML 2025).</p>
    <aside class="notes">
      <p>Il riflesso «tanto ci incollo dentro tutto» va anticipato prima che si formi.</p>
      <p>Il terzo punto è la risposta pronta alla domanda che arriva sempre: la conversazione di tre ore in cui il chatbot «dimentica» l'inizio. Non è un guasto e non è una scelta di privacy: oltre un certo numero di token la parte vecchia viene compattata o tagliata, e si perde granularità. Tutti i modelli hanno questo limite; cambia la dimensione, non il meccanismo. Da non dire mai: che il sistema «impara» o «si ricorda». Rimette del testo sulla scrivania, e basta.</p>
      <p>I numeri, se li chiedono: GPT-3 stava a ~2.000 token, i modelli di frontiera dichiarano fino a ~1.000.000, che sono circa 700-750 mila parole (un token vale circa tre quarti di parola: <em>non</em> un milione e mezzo).</p>
      <p>Le due righe della slide dicono due cose diverse e vanno tenute distinte. La prima è la posizione: il grafico è del 2023 su gpt-3.5-turbo, quindi non è l'ultima parola. La seconda è recente e più dura: nel benchmark NoLiMa (ICML 2025), a 32.000 token 11 modelli su 13 scendono sotto la metà del loro punteggio sui testi brevi, e GPT-4o passa da 99,3% a 69,7%. È la risposta pronta all'obiezione «ma ormai le finestre sono enormi»: enormi sì, utili per intero no.</p>
      <p>La freccia finale è il ponte verso il recupero: se pochi documenti pertinenti battono l'ammasso, serve qualcosa che li scelga.</p>
      <p><strong>Fonti.</strong> Liu et al. (2023/24), <em>Lost in the Middle</em>, TACL; Modarressi et al. (2025), <em>NoLiMa</em>, ICML.</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#3" data-min="2">
    <h2>Recupero: prima trova, poi scrivi</h2>
    <div class="cols fit-two">
      <div class="col">
        <div class="visual-frame media-fit">
          <video src="assets/video/retrieval.mp4" autoplay loop muted playsinline data-autoplay></video>
        </div>
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Una volta: si indicizza</h4>
          <p>I documenti vengono spezzati in pezzi; ogni pezzo diventa una posizione su una mappa di significati. Restano fuori dal modello.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>A ogni domanda: si cerca</h4>
          <p>Anche la domanda diventa una posizione. Entrano solo i pezzi pi&ugrave; vicini: &egrave; questo l'ancoraggio, il <em>grounding</em>.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Quando fallisce</h4>
          <p>Se la domanda &egrave; formulata lontano dalle parole del documento, i pezzi giusti non entrano. E la risposta arriva lo stesso.</p>
        </div>
      </div>
    </div>
    <p class="chain">domanda &rarr; in numeri &rarr; cerca per significato &rarr; pezzi pi&ugrave; simili &rarr; LLM &rarr; risposta</p>
    <div class="takeaway">I documenti dell'azienda non vengono addestrati nel modello: vengono passati, una domanda alla volta.</div>
    <aside class="notes">
      <p>Lo schema più utile che questa platea adotterà davvero. Il video regge il punto da solo: il muro dei documenti non si muove, restano gli slot vuoti, viaggiano solo pochi pezzi.</p>
      <p>La prima card è il passaggio che manca in tutte le spiegazioni sentite in giro, ed è quello che smonta le tre idee sbagliate più comuni su «caricare i documenti»: non è un Ctrl+F sull'archivio, non è il modello che impara il documento, non è un'indicizzazione per nome e data. Si spezza, si converte in numeri, si salva l'indice: una volta sola, e fuori dal modello. La mappa dei significati è la stessa vista nel modulo 1 alla fermata «vettori».</p>
      <p>La seconda card è dove si nomina la parola: ancorare la risposta a una fonte recuperata è il grounding, ed è il titolo della demo che segue.</p>
      <p>La terza card va detta ad alta voce, con l'esempio: «come gestisco le ferie?» non trova nulla, «come richiedo i congedi annuali?» trova subito. Stessa domanda, parole diverse. La ricerca funziona per vicinanza di significato, non per parole esatte; se la domanda cade lontano dal modo in cui il documento è scritto, il passaggio giusto non torna &mdash; e nessuno avvisa. È il motivo per cui nella demo si fanno vedere i passaggi recuperati invece di fidarsi della risposta.</p>
      <p>Le due conseguenze operative da far atterrare: niente viene memorizzato, quindi si aggiorna un documento e le risposte cambiano subito, senza riaddestrare nulla; e il modello può rispondere solo con ciò che il recupero ha trovato, quindi la qualità del recupero <em>è</em> la qualità della risposta.</p>
      <p><strong>Fonti.</strong> Lewis et al. (2020) RAG; Karpukhin et al. (2020) Dense Passage Retrieval; Mikolov et al. (2013).</p>
    </aside>
  </section>

<section>

  <section data-nid="04-steer-act#0" data-min="1" class="module-cover" data-background-image="assets/img/module-05-behaviour-control.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">04</span>
    <p class="kicker">Modulo 4 <span class="mod-clock" data-clock-for="m4"></span></p>
    <h1>Dalle istruzioni agli strumenti</h1>
    <p class="lede">Istruzioni in lingua comune, strumenti in grado di comprenderla*</p>
    <p class="footnote">* Templeton et al., <em>Scaling Monosemanticity</em>, Transformer Circuits 2024 &mdash; la caratteristica &laquo;Golden Gate Bridge&raquo; e le altre attivazioni legate a concetti. Gurnee et al., <em>Verbalizable Representations Form a Global Workspace in Language Models</em>, Transformer Circuits 2026.</p>
    <aside class="notes">
      <p>Il modulo più lungo e il più operativo: è il livello su cui, capito il resto, si lavora davvero tutti i giorni.</p>
      <p>Per questa sala «programmare» va riformulato. Scrivere istruzioni lo sanno già fare. Quello che non sanno ancora è che scriverle <em>una volta, in un file</em> è tutta la tecnica, e che da lì in poi lo stesso testo può comandare uno strumento che apre i loro file.</p>
      <p>Arco del modulo: dove si scrive &rarr; da dove entra ciò che è scritto &rarr; da chatbot a sistema che agisce &rarr; come si attacca ai loro sistemi &rarr; specifica, verifica e limiti. Due finestre dal vivo di circa due minuti, sulla seconda e sulla quarta slide; la demo finale percorre tutto l'arco in una sola sessione.</p>
      <p><strong>Approfondimento.</strong> L'asterisco sulla copertina è lo spazio latente; le due referenze sono già sulla slide, in piccolo: transformer-circuits.pub/2024/scaling-monosemanticity e transformer-circuits.pub/2026/workspace.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#1" data-min="3">
    <h2>Due posti dove scrivere le regole</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>La richiesta corrente &egrave; il testo che cambia ogni volta. Le regole permanenti sono il testo che <strong>viene riletto a ogni richiesta</strong>.</p>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Prompt engineering</h4>
          <p>Il lavoro da fare, dichiarato per intero:<br><strong>C</strong>ontesto, <strong>O</strong>biettivo, <strong>S</strong>tile, <strong>T</strong>ono, destinat<strong>A</strong>ri, <strong>R</strong>isposta.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Regole permanenti</h4>
          <p>Valgono per ogni richiesta. Sicurezza, stile della casa, lessico, cosa non fare mai.</p>
          <p class="chain">personality.md &middot; CLAUDE.md &middot; AGENT.md &middot; CONTEXT.md</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m05-prose-stack.png" alt="Fogli di istruzioni stratificati che guidano il segnale di comportamento di un agente">
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>Tutto ci&ograve; che &egrave; scritto nel prompt resta un testo fra gli altri sulla scrivania del modulo 3: pu&ograve; essere <strong>riassunto</strong>, pu&ograve; essere <strong>tagliato</strong>, pu&ograve; essere <strong>scavalcato</strong>.</p>
    </div>
    <aside class="notes">
      <p>L'ordine delle card è voluto: prima la richiesta, che sanno già scrivere, poi le regole permanenti, che è la cosa nuova. Il modulo intero va da destra a sinistra rispetto all'abitudine della sala.</p>
      <p>CO-STAR è di GovTech Singapore. Sta a schermo con le sei voci, quindi si può nominare: un acronimo con l'ancora visiva accanto costa poco, un acronimo detto e basta costa attenzione. Il vero contenuto della card non è la sigla, è che una richiesta completa si scrive, non si improvvisa.</p>
      <p>I quattro nomi di file sotto la prima card non vivono nello stesso posto: <code>personality.md</code> sta nelle impostazioni, gli altri tre in una cartella di lavoro. La slide successiva assegna ogni nome al suo meccanismo; qui servono solo a far vedere che sono file veri, con un nome che si scrive.</p>
      <p>La card ambra è il perno del modulo, e i tre verbi sono tre cose diverse. <em>Riassunto</em> e <em>tagliato</em> vengono dal modulo 3. <em>Scavalcato</em> si vede accadere alla quarta battuta della demo, quando si chiede di ignorare le regole della casa e il modello cede: da quel terzo verbo nasce la tabella dei tre livelli dell'ultima slide.</p>
      <p><strong>Compito narrativo.</strong> Questa slide non serve nessun item del Concept Test. Il suo lavoro è stabilire che esiste un artefatto scritto e che ha due strati; senza quello, nulla di ciò che viene dopo ha un supporto materiale.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#2" data-min="3" data-background-color="#f4f8fb">
    <h2>Da dove entrano le regole permanenti</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="caption-row two">
          <div class="mini-card"><strong>Instructions</strong><span>A ogni richiesta, sempre. &Egrave; l'unico che occupa contesto ogni volta.</span><span class="fig">personality.md</span></div>
          <div class="mini-card"><strong>Projects</strong><span>All'apertura del progetto. Se i file superano la finestra, entrano a pezzi &mdash; modulo 3.</span><span class="fig">.md &middot; .pdf</span></div>
          <div class="mini-card"><strong>Directory</strong><span>Solo se l'agente legge il file: servono uno strumento e una decisione.</span><span class="fig">CLAUDE.md &middot; CONTEXT.md</span></div>
          <div class="mini-card"><strong>Skills</strong><span>Solo quando la descrizione combacia con la richiesta.</span><span class="fig">SKILL.md</span></div>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Perch&eacute; conta</h4>
          <p>La cosa che comanda la macchina &egrave; la stessa che un collega nuovo legge per imparare il mestiere.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="layered-file" data-standing-rules="m4-p2" data-standing-rules-heading="# Regole permanenti"></div>
      </div>
    </div>
    <aside class="notes">
      <p>Finestra dal vivo, circa due minuti, in quest'ordine: le istruzioni nelle impostazioni, un progetto con i suoi file, una cartella con dentro un <code>CLAUDE.md</code>, una skill che si attiva da sola. Si mostra e basta: il commento è la griglia sulla slide.</p>
      <p>L'asse delle quattro celle non è «sempre contro condizionato», è <em>quando entra nel contesto</em>, e le quattro risposte sono diverse. <strong>Instructions</strong> è l'unico veramente incondizionato, ed è anche l'unico che si paga a ogni richiesta: mezza pagina scritta lì viaggia sempre. <strong>Projects</strong> vale per quel progetto, ma quando i file superano la finestra non vengono caricati, vengono recuperati a pezzi &mdash; che è esattamente il gradino 2 contro il gradino 3 della scala del modulo 3. <strong>Directory</strong> dipende da una decisione dell'agente e da uno strumento che legga: se non apre il file, il file non esiste. <strong>Skills</strong> dipende dalla descrizione, non dal contenuto: è la descrizione a decidere il caricamento.</p>
      <p>Il blocco a destra non è un mockup: è lo stesso identico testo che la demo incollerà al passo 2, preso da <code>demo-prompts.json</code> e cambiato dal selettore di settore.</p>
      <p>Su «e Markdown?»: è solo testo con un po' di struttura, titoli e trattini. Si dice una volta, non si insegna.</p>
      <p>La card ambra è l'argomento commerciale del modulo: per una PMI con turnover di personale, il file di configurazione e il manuale di addestramento sono lo stesso documento. Il repository di questo deck è costruito con delle skill, quindi il metodo è dimostrato dalla cosa che si sta guardando.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#3" data-min="2">
    <h2>Chatbot e sistema agentico</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/chatbots-vs-agentic-systems-light-it.png" alt="Chatbot a confronto con i sistemi agentici">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Ciclo</strong><span>Decide, agisce, osserva il risultato, decide di nuovo.</span><span class="fig">&egrave; il modello a decidere quando smettere: per questo pu&ograve; girare a vuoto</span></div>
        <div class="mini-card"><strong>Strumenti</strong><span>Funzioni descritte a parole, che il modello sceglie se chiamare.</span><span class="fig">file, ricerca, email, banche dati &mdash; la slide dopo</span></div>
        <div class="mini-card"><strong>Memoria</strong><span>Ci&ograve; che gli viene rimesso davanti al giro dopo.</span><span class="fig">come funziona davvero: modulo 3, gi&agrave; visto</span></div>
      </div>
    </div>
    <div class="takeaway">La differenza fra chatbot e agente &egrave; l'impalcatura attorno allo stesso modello, non un modello pi&ugrave; grande.</div>
    <aside class="notes">
      <p>La cerniera del modulo, e l'unico posto in cui si definisce un sistema agentico. Prima lo si definiva anche nel modulo 2, due moduli prima e in astratto: era uno dei tre punti in cui si diceva la stessa cosa. Qui la definizione arriva dove sta per servire &mdash; la slide dopo è come gli strumenti arrivano ai loro sistemi, e la demo dopo ancora fa girare il ciclo sulla loro cartella.</p>
      <p>Il ciclo va pronunciato ad alta voce &mdash; decide, agisce, osserva &mdash; perché sono esattamente le tre parole che accompagneranno la demo di Cowork, e devono essere riconoscibili quando si risentono.</p>
      <p>Fin qui si è scritto un testo; da qui in poi quel testo comanda qualcosa che agisce. La differenza in una riga, se la chiedono: un chatbot risponde giro per giro, un sistema agentico insegue un obiettivo più lungo di un giro.</p>
      <p>Sui costi, che qualcuno chiede subito: la risposta è nella prima scheda. Il ciclo decide da sé quando fermarsi, quindi un agente mal impostato può ripetere giri inutili &mdash; ed è esattamente il motivo per cui l'ultima slide del modulo scrive prima la specifica e verifica dopo.</p>
      <p><strong>Fonti.</strong> Yao et al. (2023) ReAct; Schick et al. (2023).</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#4" data-min="3">
    <h2>MCP &mdash; come arriva ai sistemi dell'azienda</h2>
    <p class="quote-line">&laquo;MCP &egrave; come una porta USB-C per le applicazioni di IA: come l'USB-C offre un modo standardizzato di collegare dispositivi elettronici, MCP offre un modo standardizzato di collegare le applicazioni di IA a sistemi esterni.&raquo; <span class="attrib">&mdash; documentazione ufficiale MCP</span></p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-mxn-convention.png" alt="Agenti e server che scambiano buste di messaggi comuni attraverso un'unica corsia di protocollo condiviso">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Scopre</strong><span>Il connettore dichiara che cosa sa fare.</span></div>
        <div class="mini-card"><strong>Chiama</strong><span>L'agente invia una richiesta strutturata.</span></div>
        <div class="mini-card"><strong>Restituisce</strong><span>Il risultato torna come nuovo contesto.</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <p>Senza uno standard, <strong>n</strong> applicazioni e <strong>m</strong> strumenti richiedono <strong>n&times;m</strong> integrazioni su misura. Con un protocollo unico ne bastano <strong>n+m</strong> &mdash; e i sistemi che l'azienda ha gi&agrave; non vanno rifatti per essere raggiungibili. Sposta richieste e risultati: non mette insieme i dati.</p>
    </div>
    <p class="footnote">Le stesse domande di qualsiasi integrazione: credenziali di chi, con quale perimetro, con quanta fiducia.</p>
    <aside class="notes">
      <p>Finestra dal vivo, circa due minuti: l'elenco dei connettori aperto in due prodotti diversi, niente di più. Serve a far vedere che non è una cosa di un fornitore solo.</p>
      <p>La citazione è letterale e sta nella documentazione ufficiale del protocollo: «Think of MCP like a USB-C port for AI applications». Va detta come citazione, non come trovata propria.</p>
      <p>Il conto n&times;m &rarr; n+m è il meccanismo, la porta USB-C ne è l'illustrazione: cinque applicazioni e sei strumenti fanno trenta integrazioni su misura contro undici.</p>
      <p><strong>Cronologia</strong>, per rispondere a «e se cambiano idea?»: protocollo aperto pubblicato il 25 novembre 2024, adottato da OpenAI a marzo 2025 e da Google ad aprile 2025, donato il 9 dicembre 2025 alla Agentic AI Foundation, fondo diretto della Linux Foundation co-fondato con OpenAI e Block. Non è più governato da una sola azienda.</p>
      <p>Alla specifica tecnica non conviene avvicinarsi. La frase che conta sul piano commerciale è quella nella card: i loro sistemi attuali non vanno rifatti per essere raggiungibili.</p>
      <p>Le tre mosse sono il meccanismo. La terza lega il modulo al modulo 3: il risultato di uno strumento non «entra nel modello», torna sulla scrivania come contesto nuovo. Qui si pianta il seme del rischio, perché ogni connettore è anche una superficie d'attacco: il modulo 5 si apre sfruttando esattamente questo.</p>
      <p><strong>Fonti.</strong> modelcontextprotocol.io; anthropic.com/news/model-context-protocol; anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#5" data-min="2" class="practice-slide" data-background-color="#f4f8fb">
    <h2>Specifica, verifica, e limiti fuori dal modello</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>1. La specifica resta di chi commissiona</h4>
          <p>Ogni grado di libert&agrave; lasciato aperto viene chiuso con un default plausibile, preso dalla distribuzione dell'addestramento e non dal caso in esame. Specificare significa elencare che cosa <strong>non</strong> si lascia decidere allo strumento, a partire da quale <em>decisione</em> il lavoro deve permettere.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>2. La verifica va contro la fonte</h4>
          <p>Il criterio si fissa <strong>prima</strong> della generazione, il controllo si esegue <strong>dopo</strong>, sul documento di origine e non sull'output. Un criterio formulato dopo aver letto la risposta si adatta alla risposta.</p>
        </div>
      </div>
      <div class="col stack-sm">
        <p>I tre livelli si scelgono per <strong>reversibilit&agrave; e costo dell'errore</strong>, non per gravit&agrave; percepita, e si applicano allo strumento, non al prompt.</p>
        <div class="caption-row" style="grid-template-columns:1fr;">
          <div class="mini-card"><strong>Fai sempre</strong><span>Reversibile, costo basso: procede da solo.</span></div>
          <div class="mini-card"><strong>Chiedi prima</strong><span>Reversibile ma costoso: conferma obbligatoria prima di agire.</span></div>
          <div class="mini-card"><strong>Non fare mai</strong><span>Irreversibile: bloccato allo strumento, fuori dalla portata del modello.</span></div>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>Questa slide non introduce niente: dà il nome a tre cose che la demo ha appena fatto succedere. Il punto 1 è la sesta battuta (i criteri dichiarati a voce prima di lanciare), il punto 2 è l'ottava (la tabella verificata contro i documenti di origine), il punto 3 è la quarta (le regole della casa scavalcate). Se la demo è andata, qui basta indicare.</p>
      <p>La riga sopra i tre livelli era una quarta card: si legge da sola e non va ripetuta a voce.</p>
      <p>Il criterio dei tre livelli è <strong>reversibilità e costo dell'errore</strong>, non gravità percepita: mandare una mail sbagliata è irreversibile e va nella terza riga anche se sembra un'inezia, mentre riscrivere una bozza è reversibile e va nella prima anche se il testo è importante. L'esercizio si fa a voce, con un compito loro.</p>
      <p><strong>Approfondimento.</strong> La tesi di Karpathy sull'automazione: il software tradizionale automatizza ciò che si sa specificare, gli LLM automatizzano ciò che si sa <em>verificare</em>, quindi conviene rendere verificabile il proprio lavoro. Cherny, creatore di Claude Code: «dai a Claude un modo di verificare il proprio lavoro e raddoppi o triplichi la qualità» &mdash; è la stima di un professionista, non una misura. Shankar et al. (UIST 2024) sulla deriva dei criteri: valutare output reali cambia i criteri, quindi specifica e verifica si alimentano a vicenda; è un ciclo, non una catena di montaggio.</p>
      <p>L'aneddoto è il contenuto migliore della slide: l'agente di Karpathy associava i pagamenti agli account tramite l'indirizzo email invece di un identificativo stabile. Codice plausibile, progetto sbagliato, colto solo dal giudizio umano &mdash; e nessuna rilettura riga per riga lo avrebbe trovato, perché ogni riga era corretta.</p>
      <p>Consegna al modulo 5: la prosa vive nel contesto, e il contesto si può manipolare.</p>
    </aside>
  </section>

<section>

  <section data-nid="05-risks-judgement#0" data-min="1" class="module-cover" data-background-image="assets/img/module-08-ethics.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">05</span>
    <p class="kicker">Modulo 5 <span class="mod-clock" data-clock-for="m5"></span></p>
    <h1>Rischi e giudizio</h1>
    <p class="lede">Che cosa va storto e chi resta responsabile.</p>
    <aside class="notes">
      <p>Ultimo modulo, ed è quello che rende difendibile tutto il resto: i quattro precedenti hanno mostrato che cosa si può far fare alla macchina, questo dice a quali condizioni il risultato regge davanti a un cliente.</p>
      <p>Tre titolari di rischio &mdash; il modello, chi lo usa, i dati &mdash; e poi chi decide. Quella struttura deve sopravvivere anche a chi dimentica ogni esempio, ed è l'unica cosa che vale la pena ripetere due volte.</p>
      <p>Non è un modulo di avvertimenti, e conviene dirlo all'inizio: ogni rischio nominato qui ha già la sua contromossa nei moduli precedenti &mdash; ancorare ai documenti (M3), scrivere le regole e verificare (M4), tenere l'azione distruttiva fuori dalla portata dello strumento. Senza quella premessa la sala si irrigidisce e la demo finale sembra una punizione.</p>
      <p>Si chiude sulla domanda d'impegno: una cosa che ciascuno proverà nei prossimi 30 giorni, scritta e non solo detta.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#1" data-min="2">
    <h2><span class="chip risk">modello</span> Che cosa sbaglia il modello</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Allucinazione</h4>
        <p>Fluente, sicura, falsa. Strutturale, non un difetto: si riduce ancorandola ai documenti e verificandola. Non si elimina.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Distorsione</h4>
        <p>Senza riferimenti propri restituisce la media del gi&agrave; scritto: le parole, gli schemi e le strutture di cui il web &egrave; pieno.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Accondiscendenza</h4>
        <p>Se la si contesta, ritratta: anche quando aveva ragione. Il rifinimento premia le risposte che le persone approvano.</p>
      </div>
    </div>
    <div class="banner-media">
      <img src="assets/img/m05-plausible-path.png" alt="Molte tracce sottili che si intrecciano in un unico tratto ambrato deciso, mentre alcune si staccano e sbiadiscono">
    </div>
    <p class="footnote">Le prime due vengono dal motore del Modulo 1 &mdash; testo plausibile, non testo vero. La terza viene da come &egrave; stato rifinito: con giudizi umani.</p>
    <aside class="notes">
      <p>Il filo causale parte dal modulo 1: il motore campiona da una distribuzione, senza nessun oracolo di verità attaccato. Da lì vengono le prime due card.</p>
      <p><strong>Allucinazione.</strong> È anche la risposta corretta di uno degli item del test: è strutturale, si riduce con l'ancoraggio ai documenti e la verifica umana, non si elimina. Vale la pena dirla con queste parole.</p>
      <p><strong>Distorsione, versione misurata.</strong> Doshi &amp; Hauser, <em>Science Advances</em> 10(28), eadn5290 (2024) &mdash; esperimento online, peer-reviewed. Con una sola idea generata dall'AI le storie diventano più originali per chi le scrive (+8,1% di novità) ma si somigliano fra loro il 10,7% in più. Non è un giudizio morale sui dati di addestramento: è la media del già scritto che riemerge ogni volta che manca un riferimento proprio. È la ragione per cui la scala del modulo 3 cambia il risultato, ed è quella per cui nella demo il prompt disciplinato tira fuori un'altra struttura dallo stesso materiale. Dove il modello tocca persone &mdash; selezione, valutazione, credito &mdash; la distorsione diventa anche una questione giuridica (AI Act, sistemi ad alto rischio): si nomina e non si apre, perché non è quello che questo corso dimostra.</p>
      <p><strong>Accondiscendenza, versione misurata.</strong> Sharma et al., ICLR 2024 (Anthropic), su cinque assistenti allo stato dell'arte. Se l'utente contesta una risposta corretta i modelli cambiano la risposta iniziale fra il 32% e l'86% delle volte secondo il modello; un utente che suggerisce una risposta sbagliata abbassa l'accuratezza fino a 27 punti. È un meccanismo, non un movente: il rifinimento usa giudizi umani, e le persone preferiscono le risposte che confermano quello che già pensano. È il ponte verso la terza card della slide sull'utente: il presupposto messo nella domanda torna indietro confermato.</p>
      <p>Il «pappagallo stocastico» (Bender et al. 2021) sta qui se qualcuno lo tira fuori: dibattito aperto, non verdetto. Rassegna sull'allucinazione: Ji et al. (2023).</p>
    </aside>
  </section>


  <section data-nid="05-risks-judgement#2" data-min="2" data-background-color="#f4f8fb">
    <h2><span class="chip risk">utente</span> Che cosa succede a chi lo usa</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="Silhouette umana che passa un filo ambrato di pensiero a una parentesi meccanica">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Erosione della competenza</h4>
          <p>Quello che si delega si esercita di meno. Chi si fida dello strumento verifica meno; chi si fida di s&eacute; verifica di pi&ugrave;.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>La trappola della fluidit&agrave;</h4>
          <p>Un testo levigato sposta la fiducia, non l'accuratezza &mdash; e la sposta di pi&ugrave; fuori dalla propria materia.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>La domanda entra nella risposta</h4>
          <p>Un presupposto messo nella domanda torna indietro come se fosse acquisito. Chiedere <em>perch&eacute;</em> una cosa &egrave; vera non verifica che lo sia.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>Va reso concreto per una piccola impresa: l'esperto in sala riconosce un'attribuzione sbagliata in un istante. Un giovane con lo stesso strumento no, e forse non svilupperà mai l'occhio se lo strumento risponde sempre per primo. È una decisione di organico e di formazione, non di tecnologia.</p>
      <p><strong>Prima card, e che tipo di prova è.</strong> Che ciò che si delega si ricordi meno è vecchio e solido (Sparrow, Liu &amp; Wegner 2011, <em>Science</em>, l'effetto Google). Che la competenza si atrofizzi <em>non</em> è dimostrato, e non va detto. Il dato più vicino è Lee, Sarkar, Tankelevitch et al., CHI 2025 &mdash; 319 lavoratori della conoscenza, 936 episodi reali: più fiducia nello strumento va con meno pensiero critico, più fiducia in sé con più pensiero critico. È un'associazione in un questionario auto-riferito, e va presentata così. La rassegna di Risko &amp; Gilbert (2016) descrive quando si delega, non che la capacità decada.</p>
      <p><strong>Seconda card.</strong> Perry, Srivastava, Kumar &amp; Boneh, CCS 2023 &mdash; esperimento controllato con utenti. Chi aveva l'assistente ha scritto codice significativamente meno sicuro ed era più convinto di averlo scritto sicuro; e chi si fidava di meno, lavorando sulla formulazione del prompt, produceva meno vulnerabilità. Dominio codice e modello del 2022: va dichiarato. La seconda metà di quel risultato è la tesi della parte C della demo, che arriva pochi minuti dopo.</p>
      <p><strong>Terza card.</strong> Chiude il filo del modulo 3, «ferie» contro «congedi annuali». Lì erano le parole a spostare il recupero; qui è il presupposto a spostare la generazione, perché il prompt è il testo che il modello continua. L'esempio si dice ad alta voce, secondo il settore in sala: «perché questa moneta è più rara?» &middot; «perché questo impianto rende di meno?» &middot; «perché questo collaudo è fallito?» &mdash; nessuna delle tre verifica che la premessa sia vera.</p>
      <p>La regola operativa da dettare: chiedere «che cosa manca in questa attribuzione?», non «conferma che questa attribuzione è giusta».</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#3" data-min="2">
    <h2><span class="chip risk">dati</span> Quando il testo diventa istruzione</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Prompt injection</h4>
          <p>Un documento non fidato contiene una frase che il modello <em>esegue</em> invece di riassumere.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Perch&eacute; conta adesso</h4>
          <p>Con gli strumenti del Modulo 4 il modello non risponde soltanto: apre file, scrive, invia. Il testo non fidato smette di essere dato e guida un'azione.</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m07-data-leaks.png" alt="Prompt injection indiretta che dirotta il percorso degli strumenti di un agente e provoca movimenti di dati non voluti">
      </div>
    </div>
    <aside class="notes">
      <p>La riga da non perdere: finché il modello scrive testo, un'istruzione nascosta produce una risposta sbagliata; da quando ha strumenti, produce un'azione. I connettori del modulo 4 hanno allargato la superficie d'attacco un'ora prima, nella stessa aula.</p>
      <p>L'injection non ha una soluzione pulita. Non è un bug che si chiude con una patch: è una conseguenza del fatto che istruzioni e dati arrivano al modello nello stesso canale, come testo. Quindi si progetta per privilegio minimo &mdash; lo strumento vede solo la cartella che serve, e le azioni distruttive stanno nel livello «non fare mai» della tabella già vista nel modulo 4.</p>
      <p>Pochi minuti dopo, la parte B della demo lancia sulla cartella avvelenata la stessa identica richiesta di <code>m4-p7</code>: l'unica variabile cambiata è il documento. Poi si apre il PDF, Ctrl+A, e si scopre il testo grigio. Non va anticipato: deve deragliare davanti a loro.</p>
      <p><strong>Fonti.</strong> Greshake et al. (2023), <em>Indirect Prompt Injection</em>; OWASP Top 10 per applicazioni LLM.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#4" data-min="2">
    <h2><span class="chip risk">dati</span> Chi vede questi dati</h2>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <h4>La domanda</h4>
      <p>Chi pu&ograve; vedere le domande e i file caricati? La risposta dipende dallo strumento e dal contratto, non dal modello.</p>
    </div>
    <div class="caption-row" style="grid-template-columns:repeat(4,1fr);margin-top:.6em;">
      <div class="mini-card"><strong>App gratuita</strong><span>I dati vengono usati per addestrare? Dov'&egrave; scritto, e da quando?</span></div>
      <div class="mini-card"><strong>Abbonamento</strong><span>Il piano di lavoro esclude l'addestramento? Sta nel contratto o in una pagina d'aiuto?</span></div>
      <div class="mini-card"><strong>API a pagamento</strong><span>Chi tiene i log, per quanto tempo, in quale paese?</span></div>
      <div class="mini-card"><strong>Modello locale</strong><span>Non esce niente dall'azienda: gira sul portatile. Quanta qualit&agrave; costa?</span></div>
    </div>
    <p class="footnote">Nell'UE l'<strong>AI Act</strong> (Reg. 2024/1689) e il <strong>GDPR</strong> si applicano comunque, qualunque opzione si scelga.</p>
    <aside class="notes">
      <p>Questa è la pre-demo. Le quattro colonne sono scritte come domande e non come garanzie di proposito: le condizioni cambiano per fornitore, per piano e nel tempo, e chi presenta non è il loro avvocato.</p>
      <p>Quello che vale sempre è il footnote: qualunque casella scelgano, i due regolamenti si applicano lo stesso. L'opzione tecnica non è una scorciatoia giuridica.</p>
      <p>Si chiude aprendo Ollama e mostrando la finestra: nessun esempio, nessuna prova, solo «questo è un modello che gira qui dentro». Serve a togliere l'astrazione dalla quarta card e a togliere il montaggio alla demo &mdash; la parte A parte da uno strumento già aperto e già spiegato, e resta soltanto da staccare la rete e rifare la domanda del modulo 3.</p>
      <p>Se la sala è coinvolta, qui sta la domanda di discussione <code>m5-p4</code>: quale delle quattro opzioni accetterebbero per il materiale inedito di un cliente. Rende la scelta loro invece che un avvertimento altrui.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#5" class="demo-slide" data-demo="m5"></section>

  <section data-nid="05-risks-judgement#6" data-min="2">
    <h2>L'essere umano nel ciclo</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/human-loop.png" alt="Ciclo verde e viola che si incontra su checkpoint ambrati">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Perch&eacute; il controllo si allenta</h4>
          <p>Il sistema di solito ha ragione, e l'attenzione si sposta altrove. Vale per gli esperti quanto per i principianti, e non si corregge raccomandando di stare attenti.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Che cosa l'ha fermato</h4>
          <p>Cinque minuti fa non &egrave; stato un controllo automatico: &egrave; stato qualcuno che conosceva il pezzo e poteva dire di no.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Lo stesso strumento, al contrario</h4>
          <p>Fargli fare l'avvocato del diavolo, chiedergli che cosa manca, farsi interrogare. Chi lo interroga invece di delegargli ottiene risultati migliori.</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>Il test</h4>
      <p>La supervisione &egrave; reale solo se qualcuno pu&ograve; <strong>capire</strong>, <strong>contestare</strong> e <strong>ribaltare</strong>. Se manca uno dei tre, &egrave; un timbro.</p>
    </div>
    <aside class="notes">
      <p>La prima card è il punto che vale la pena difendere, ed è misurato: Parasuraman &amp; Manzey, <em>Human Factors</em> 52(3) 381&ndash;410 (2010), una rassegna che integra gli studi empirici sul compiacimento da automazione. Due conclusioni testuali: il compiacimento «si riscontra sia nei partecipanti inesperti sia negli esperti e non si supera con la semplice pratica», e l'automation bias «non si previene con l'addestramento o con le istruzioni». Detto in aula: l'esperienza non protegge, e dire alla gente di stare attenta non è un controllo. Il rimedio non è la buona volontà, è la progettazione &mdash; i livelli di guardrail visti nel modulo 4.</p>
      <p>Il classico, da presentare come argomento e non come misura: Bainbridge, <em>Ironies of Automation</em>, <em>Automatica</em> 19(6) 775&ndash;779 (1983). Più l'automazione è affidabile, meno l'operatore resta allenato a subentrare proprio nel momento in cui deve. E non si può essere vigili a intermittenza: un successo su un compito non autorizza a fidarsi sul compito dopo, perché il confine fra i due non è dichiarato da nessuna parte.</p>
      <p>La terza card è la nota lieta, e va detta senza gonfiarla. Quello che è misurato è che chi si fidava di meno e lavorava sulla formulazione otteneva risultati migliori (Perry et al., CCS 2023), e che con l'AI il lavoro cognitivo non sparisce ma si sposta verso la verifica e la supervisione (Lee et al., CHI 2025). Che questo costruisca competenza nel tempo non è dimostrato e non va promesso. Si promette la postura &mdash; chiedere «che cosa manca» e «argomenta il contrario» invece di «confermami» &mdash; che è la stessa regola operativa dettata sulla slide dell'utente.</p>
      <p>Il punto va detto con il loro cliente in mente: la responsabilità verso chi riceve il documento firmato non si delega a un modello, né giuridicamente né sul piano della reputazione. L'esperto lo ha appena ribaltato dal vivo: si indica quel momento, non si rispiega.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#7" data-min="1" data-background-color="#fbfaf6">
    <h2>Dove siamo arrivati</h2>
    <div class="recap-chain compact">
      <div class="step"><strong>1</strong><span>prevede la parola dopo</span></div>
      <div class="step"><strong>2</strong><span>dentro o intorno</span></div>
      <div class="step"><strong>3</strong><span>ancorarlo ai documenti</span></div>
      <div class="step"><strong>4</strong><span>scrivere le regole, poi verificare</span></div>
      <div class="step"><strong>5</strong><span>capire, contestare, ribaltare</span></div>
    </div>
    <div class="quote-strip" style="grid-template-columns:1fr;">
      <blockquote>&laquo;Puoi delegare il tuo pensiero, ma non puoi delegare la tua comprensione.&raquo;<cite>un tweet che Karpathy continua a citare &mdash; AI Ascent (2026)</cite></blockquote>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>La domanda</h4>
      <p>&laquo;Una cosa concreta che farai nei prossimi 30 giorni applicando quello che hai imparato oggi.&raquo;</p>
    </div>
    <div class="takeaway">Alla base &egrave; probabilit&agrave;. In mano a una persona &egrave; uno strumento. La parte difficile &egrave; il giudizio.</div>
    <aside class="notes">
      <p>La catena è l'ultima cosa che leggono: va letta ad alta voce, un anello alla volta, senza commentarla. L'anello 4 dice «poi verificare» e non «poi lasciarlo agire» di proposito &mdash; è la conclusione su cui il modulo 4 si chiude davvero. L'anello 5 è il test della slide precedente, parola per parola.</p>
      <p>L'attribuzione conta: Karpathy dice esplicitamente che quella frase è un tweet che cita, non una sua formula. Praticare l'igiene delle fonti nella slide finale vale più di dieci raccomandazioni.</p>
      <p>Poi la domanda d'impegno, ed è il motivo per cui è scritta a schermo: la formulazione è identica alla Q6.1 del questionario di uscita, ed è il campo su cui si regge il follow-up a tre mesi. <strong>Va fatta scrivere, non dire.</strong> Un impegno pronunciato in sala non lascia traccia; uno scritto sì, e fra tre mesi si potrà chiedere se è stato mantenuto.</p>
      <p>Due posture da nominare solo se avanza tempo (Mollick, dallo studio BCG): centauro, con il lavoro diviso lungo una linea netta; cyborg, con lo scambio a ogni passo.</p>
    </aside>

    <p class="kicker">Chiusura &mdash; facoltativa</p>
    <h1>Che cos'altro esiste</h1>
    <p class="lede">Un giro rapido, e il pezzo che conta.</p>
    <aside class="notes">
      <p>Blocco fuori dall'arco dei moduli: non è nella mappa iniziale e non ha demo in <code>demo-prompts.json</code>. Si fa se resta tempo, altrimenti resta come pagina del sito.</p>
      <p>Attenzione all'aritmetica: il run-sheet valuta questo giro 12 minuti (2+3+2+5), la tabella di copertina ne assegna 8 al blocco di chiusura, domande comprese. Quindi si entra qui già sapendo che cosa si taglia. Ordine di taglio: prima Claude Code, poi Dispatch, poi Claude Design. Grill&rarr;MVP non si taglia: se il tempo è poco si salta tutto il tour e si tiene solo quello.</p>
      <p>La domanda d'impegno è già stata fatta sulla slide precedente e le risposte sono già scritte: non si rifà qui.</p>
    </aside>
  </section>

  <section data-nid="06-closing#1">
    <h2>Tre superfici, lo stesso ciclo</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Claude Code</h4>
        <p>Finestra, sessioni in parallelo, revisione delle differenze. Lo stesso ciclo del Modulo 4 su un'altra superficie.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-cyan);">
        <h4>Claude Design</h4>
        <p>Da una pagina scritta a un file esportabile. Un artefatto utile in pochi minuti.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Dispatch</h4>
        <p>Lanciare dal telefono un lavoro che gira sul computer dell'ufficio. Autonomia al guinzaglio.</p>
      </div>
    </div>
    <p class="footnote">Non &egrave; un approfondimento: &egrave; una mappa di che cosa esiste, per sapere che cosa cercare dopo.</p>
    <aside class="notes">
      <p><strong>Claude Code</strong> &mdash; si apre e si mostra una sessione, <strong>senza avviare un lavoro vero</strong>. Il punto non è il codice: è che lo stesso ciclo &mdash; regole scritte, strumenti, verifica &mdash; ha superfici diverse a seconda del mestiere. Circa 2 minuti.</p>
      <p><strong>Claude Design</strong> &mdash; un prompt provato fino in fondo, export compreso. Il valore è il tempo fra la richiesta e un file che si può mandare a qualcuno. Circa 3 minuti.</p>
      <p><strong>Dispatch</strong> &mdash; l'associazione col computer va provata <strong>lo stesso giorno</strong>, perché si perde. Si lancia davanti a loro dal telefono: la sorpresa è il punto, e la frase da dire è «autonomia al guinzaglio» &mdash; parte da sola, ma il perimetro l'ha deciso una persona. Circa 2 minuti.</p>
    </aside>
  </section>

  <section data-nid="06-closing#2">
    <h2>Grill &rarr; MVP</h2>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>La conversazione, percorsa dal vivo</h4>
      <p>Prima farsi interrogare finch&eacute; la specifica non regge. Poi costruire. &Egrave; la resa del Modulo 4: possedere la specifica, e poi verificare.</p>
    </div>
    <p class="footnote">Se il tempo &egrave; poco, si taglia tutto il resto e si tiene questo.</p>
    <aside class="notes">
      <p>La conversazione preparata esiste già nella cronologia e va trovata in meno di cinque secondi: conviene tenerla aperta in una scheda di riserva. Si percorre, non si rifà dal vivo. Circa 5 minuti.</p>
      <p>Perché è il pezzo che non si taglia: è l'unico momento in cui si vede la specifica nascere da domande invece che da un'idea già formata, ed è esattamente quello che il modulo 4 ha chiesto loro di fare.</p>
      <p>Si chiude qui: domande, e il link al questionario mostrato prima che escano dalla sala.</p>
    </aside>

      "lands": "Sampling and variance - randomness is a setting, not a personality. And a filled field is not a known field.",
      "lands_it": "Campionamento e varianza: la casualità è un'impostazione, non un carattere. E un campo compilato non è un campo saputo.",
      "watch_for": "The room assumes one question has one stored answer: that idea dies here. The invented fields do not get explained yet — they get named, written on the board, with a note that they will come back. They come back three times: in D3 the value turns out to have been written down all along, in D4 the rules leave them blank, in D5 a person checks them.",
      "watch_for_it": "La sala dà per scontato che a una domanda corrisponda una risposta archiviata: qui muore quell'idea. I campi inventati non si spiegano ancora — si nominano, si scrivono alla lavagna, e si dice che ci si torna. Ci si torna tre volte: in D3 il valore era scritto da sempre, in D4 le regole li lasciano vuoti, in D5 li controlla una persona.",
      "prompts": [
        {
          "id": "m1-p1",
          "label": "1 - The same sheet, four times",
          "label_it": "1 — La stessa scheda, quattro volte",

          "tool": "chatgpt.com + claude.ai, side by side",
          "text": "From these notes prepare the complete document, ready to hand to the client: [PASTE RAW NOTES]",
          "text_it": "Da questi appunti prepara il documento completo, pronto da consegnare al cliente: [INCOLLA APPUNTI GREZZI]",
