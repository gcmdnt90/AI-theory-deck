<!-- ===== 01-words.html ===== -->
<section>

  <section class="module-cover" data-background-image="assets/img/module-01-history.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">01</span>
    <p class="kicker">Module 1 <span class="mod-clock" data-clock-for="m1"></span></p>
    <h1>How the machine makes words</h1>
    <p class="lede">One old idea, running very fast.</p>
    <aside class="notes">
      Thesis: the idea behind LLMs is from 1948. What changed is scale, data and architecture.
      By the end of this module they should see the machine as a sampler, not an oracle.
    </aside>
  </section>

  <section>
    <h2>1948 &mdash; language as a game of probability</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>Claude <strong>Shannon</strong> described text as a source that emits words with a certain probability.</p>
        <p>Guessing the next word well means knowing the language well.</p>
        <div class="takeaway">Everything today still sits on that bet.</div>
      </div>
      <div class="col visual-frame tight">
        <img src="assets/img/shannons.png" alt="Shannon: language as a source emitting symbols with a probability">
      </div>
    </div>
    <aside class="notes">
      Sources: Shannon (1948) A Mathematical Theory of Communication; Shannon (1951) Prediction and
      Entropy of Printed English. An LLM is a very large learned estimator of Shannon's next-symbol
      distribution; everything else is engineering around that bet. Do not put the formula on screen -
      the widget two slides from now does the work.
    </aside>
  </section>

  <section>
    <h2>From rules to learned patterns</h2>
    <div class="visual-frame">
      <svg class="diagram" viewBox="0 0 1000 250" role="img" aria-label="Timeline from rule-based NLP through statistics to Transformers and agents">
        <path d="M70 120 H930" stroke="#d9e1ea" stroke-width="2"/>
        <path d="M120 120 H880" stroke="#e3a12f" stroke-width="2.4" class="glow-amber" opacity=".45"/>
        <g fill="#ffffff" stroke-width="2.4">
          <circle cx="130" cy="120" r="17" stroke="#e3a12f"/>
          <circle cx="390" cy="120" r="17" stroke="#1597b5"/>
          <circle cx="650" cy="120" r="19" stroke="#8366c8" class="glow-amber"/>
          <circle cx="880" cy="120" r="17" stroke="#34956f"/>
        </g>
        <text x="130" y="78" text-anchor="middle" class="mono-label">1950s&ndash;80s</text>
        <text x="390" y="78" text-anchor="middle" class="mono-label">1990s&ndash;2010s</text>
        <text x="650" y="76" text-anchor="middle" class="mono-label">2017</text>
        <text x="880" y="78" text-anchor="middle" class="mono-label">today</text>
        <text x="130" y="165" text-anchor="middle" class="label">rules</text>
        <text x="390" y="165" text-anchor="middle" class="label">counts</text>
        <text x="650" y="167" text-anchor="middle" class="label">Transformer</text>
        <text x="880" y="165" text-anchor="middle" class="label">agents</text>
        <text x="130" y="196" text-anchor="middle" class="mono-label">hand-written grammars</text>
        <text x="390" y="196" text-anchor="middle" class="mono-label">statistics beat rules</text>
        <text x="650" y="198" text-anchor="middle" class="mono-label">trainable at scale</text>
        <text x="880" y="196" text-anchor="middle" class="mono-label">tools + loops</text>
      </svg>
    </div>
    <div class="takeaway">We stopped telling the machine the rules and let it infer them from data.</div>
    <aside class="notes">
      Two minutes, no more. The one architectural fact worth saying out loud: in 2017 "Attention Is
      All You Need" (Vaswani et al.) let every word be compared with every other word in parallel,
      which made training at scale practical. Do not open the encoder-decoder. Scaling era in one
      breath: 2018-today, bigger models, then human feedback turned them into assistants.
      Sources: Mikolov (2013); Vaswani (2017); Brown (2020); Ouyang (2022).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Three levels, one machine</h2>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit levels-frame">
        <img src="assets/img/m01-levels-machine-v2.png" alt="Three-layer machine cutaway: probabilistic token substrate, learned concept layer, and human judgement layer">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4><span class="chip safe">macro</span> Judgement</h4>
          <p>The human who decides whether the output is acceptable.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">meso</span> The system</h4>
          <p>Memory, tools, skills, connectors. <strong>This is where you work.</strong></p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">micro</span> The base</h4>
          <p>Probabilities over the next word. Always on.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Reading the machine at the wrong level is the most common mistake.</div>
    <aside class="notes">
      The deck's spine - the one slide to defend if time runs out. Cristianini's mesoscopic level:
      micro = neurons, meso = the abstract ideas the model built by itself, macro = behaviour read
      almost psychologically. Guard the flank: this is a claim about the right LEVEL of description
      (Marr 1982), NOT that the model became a mind. "It's just predicting words" is true at micro
      and useless at meso, which is where their actual work happens. Every later module answers:
      which level are we on?
    </aside>
  </section>

  <section>
    <h2>Tokens, not words</h2>
    <p>The machine reads sub-word pieces. That is why some &quot;obvious&quot; tasks are mechanically awkward for it.</p>
    <div class="visual-frame">
      <div class="tokenizer-widget" data-tokenizer-widget>
        <div class="prompt-switcher token-presets" role="group" aria-label="Choose a sentence to tokenize">
          <button type="button" data-sentence="Tokenisation splits text into sub-word pieces." aria-pressed="true">sub-word</button>
          <button type="button" data-sentence="Count the letter r in strawberry." aria-pressed="false">letters</button>
          <button type="button" data-sentence="The lot weighs 12.7 grams, struck in 42 BC." aria-pressed="false">numbers</button>
          <button type="button" data-sentence="L'intelligenza artificiale aiuta la traduzione." aria-pressed="false">Italian</button>
        </div>
        <textarea class="tokenizer-input" rows="2" aria-label="Sentence to tokenize">Tokenisation splits text into sub-word pieces.</textarea>
        <div class="token-output" data-token-output></div>
        <div class="token-explainer" data-token-explainer>Hover or tap a token to see why it was split.</div>
      </div>
    </div>
    <aside class="notes">
      Live and low-load. Type one of their own words into the box - a coin term, a client name.
      The "count the r in strawberry" preset is the fastest myth-buster in the deck: it fails not
      because the model is stupid but because it never sees letters. Source: Sennrich et al. (2016).
    </aside>
  </section>

  <section>
    <h2>One operation, repeated</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>The machine works out the odds of the next piece of text, <strong>picks one</strong>, adds it, and starts again.</p>
        <div class="takeaway">Fluency is a loop, not a lookup.</div>
      </div>
      <div class="col visual-frame">
        <div class="prob-widget" data-next-token-widget>
          <div class="prompt-switcher" role="group" aria-label="Choose a starting phrase">
            <button type="button" data-prompt="The satellite detected" aria-pressed="true">satellite</button>
            <button type="button" data-prompt="The grant proposal needs" aria-pressed="false">grant</button>
            <button type="button" data-prompt="To verify the result" aria-pressed="false">verify</button>
            <button type="button" data-prompt="The old archive contains" aria-pressed="false">archive</button>
          </div>
          <div class="prompt-display" data-prompt-text>The satellite detected</div>
          <div class="bar-list"></div>
        </div>
      </div>
    </div>
    <aside class="notes">
      Formula deliberately removed from the slide; say it if asked. Hammer the loop: every word it
      writes becomes part of what it reads next, so early choices steer later ones. Hallucination,
      creativity and fluency all fall out of this one mechanism. Forward-reference temperature.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Temperature: the randomness dial</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Low</h4><p>Sharp, stable, repetitive.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>High</h4><p>Flatter, more creative, riskier.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="temp-widget" data-temp-widget>
          <p class="micro">T = <span data-temp-value>0.7</span></p>
          <input class="temp-slider" type="range" min="0.2" max="2.0" step="0.1" value="0.7" aria-label="Temperature">
          <div class="bar-list"></div>
          <svg class="temp-distribution" viewBox="0 0 520 185" data-temp-distribution role="img" aria-label="Live probability distribution curve"></svg>
          <p class="temp-warning">Effect exaggerated for clarity.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Randomness is a setting, not a personality.</div>
    <aside class="notes">
      Best interactive moment in the deck - drag the slider slowly to both ends and let them watch
      the bars move. Land the line, then go straight into the demo: they are about to see the same
      question answered four different ways.
    </aside>
  </section>

  <section class="demo-slide" data-demo="m1"></section>

<!-- ===== 02-inside-around.html ===== -->
<section>

  <section class="module-cover" data-background-image="assets/img/module-03-architectures.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">02</span>
    <p class="kicker">Module 2 <span class="mod-clock" data-clock-for="m2"></span></p>
    <h1>Inside the model, around the model</h1>
    <p class="lede">Two things people constantly confuse.</p>
    <aside class="notes">
      The single most useful conceptual correction in the course. Almost every "can AI do X?"
      question is really a question about which side of this boundary X sits on.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>The boundary</h2>
    <div class="cols">
      <div class="col visual-frame media-fit">
        <img src="assets/img/m03-boundary-motherboard.png" alt="LLM processor mounted in a motherboard of memory, tools and orchestration components">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Inside &mdash; the processor</h4>
          <p>What the model learned during training. Fixed when you use it.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Around &mdash; the scaffolding</h4>
          <p>Memory, documents, tools, rules, loops. Built by you, changeable today.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">The test: does it change the model itself, or only what the model is given?</div>
    <aside class="notes">
      The good news for an SME is entirely on the right-hand card: you cannot retrain a frontier
      model, and you do not need to. Everything that will make this useful for their business is
      "around" - and around is cheap, fast and reversible. Say that explicitly; it reframes the whole
      afternoon from "expensive AI project" to "configuration".
    </aside>
  </section>

  <section>
    <h2>How a model is made</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-training-pipeline.png" alt="Three-stage light infographic for pretraining, supervised fine-tuning and preference tuning">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>1. Reads text</strong><span>Predicts the next word across enormous amounts of writing.</span></div>
        <div class="mini-card"><strong>2. Learns to follow instructions</strong><span>Examples teach it to carry out a task instead of just continuing text.</span></div>
        <div class="mini-card"><strong>3. Tuned by human feedback</strong><span>People rate answers; the model is pushed toward the helpful ones.</span></div>
      </div>
    </div>
    <div class="takeaway">The assistant you talk to is mostly made in steps 2 and 3.</div>
    <aside class="notes">
      Common belief in the room: "the model is one trained thing that knows facts". Correct it here.
      Step 3 also explains over-agreeableness, which returns in Module 6 - it was trained to please
      raters. Sources: Brown (2020); Ouyang (2022); Christiano (2017).
    </aside>
  </section>

  <section>
    <h2>&quot;Reasoning&quot; &mdash; two different things</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">inside</span> Trained</h4>
          <p>Deliberation was built into the model itself.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">around</span> Prompted</h4>
          <p>You ask an unchanged model to show its steps.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="reason-widget" data-reason-widget>
          <div class="mode-buttons">
            <button type="button" data-mode="trained" aria-pressed="true">Trained</button>
            <button type="button" data-mode="prompted" aria-pressed="false">Prompted</button>
          </div>
          <div class="reason-diagram" data-reason-diagram></div>
          <p class="reason-copy" data-reason-copy></p>
        </div>
      </div>
    </div>
    <div class="takeaway">Same behaviour on screen, different mechanism underneath.</div>
    <aside class="notes">
      This is the slide the demo lands: the thinking toggle is the trained kind, "list your criteria
      first" is the prompted kind. Sources: Wei et al. (2022); Nye et al. (2021).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>An agent = model + loop + tools + memory</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-agent-loop.png" alt="Central LLM processor wrapped by a clean agent loop of actions, tools, memory and observation">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Loop</strong><span>Decide, act, look at the result, decide again.</span></div>
        <div class="mini-card"><strong>Tools</strong><span>Actions outside the model: files, search, email, databases.</span></div>
        <div class="mini-card"><strong>Memory</strong><span>What gets handed back to the model on the next turn.</span></div>
      </div>
    </div>
    <div class="takeaway">The jump from chatbot to agent is mostly scaffolding, not a smarter model.</div>
    <aside class="notes">
      Everything from here is "around". Say the loop out loud - decide, act, observe - because you
      will narrate exactly those three words over the Cowork demo in Module 5, and they should
      recognise them when they hear them again. Sources: Yao et al. (2023) ReAct; Schick et al. (2023).
    </aside>
  </section>

    <p class="kicker">Module 3 <span class="mod-clock" data-clock-for="m3"></span></p>
    <h1>Context, memory, grounding</h1>
    <p class="lede">How the machine gets to know <em>your</em> business.</p>
    <aside class="notes">
      The module with the highest direct business value. Core distinction: context is what is in
      front of the model right now; memory is what survives between sessions. Both are "around".
    </aside>
  </section>

  <section>
    <h2>The context window</h2>
    <p>Context is the model's desk: everything it can see while answering this one question.</p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m04-context-ram.png" alt="RAM-like context window with colored token segments loaded into immediate memory slots">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Rules</strong><span>Your instructions sit at the front of the desk.</span></div>
        <div class="mini-card"><strong>Conversation + documents</strong><span>They compete for the same finite space.</span></div>
        <div class="mini-card"><strong>Room to answer</strong><span>The reply needs space on the desk too.</span></div>
      </div>
    </div>
    <div class="takeaway">The desk is wiped after every question unless you put things back on it.</div>
    <aside class="notes">
      The wiped-desk image is the one they must keep. It explains why a fresh chat "forgets", why
      long threads degrade, and why the project/instruction file in Module 4 matters.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>A bigger desk is not a free desk</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <p>Windows grew from about 1,500 words to book length in a few years.</p>
        <p>But what sits at the <strong>beginning</strong> and the <strong>end</strong> is used better than what is buried in the middle.</p>
        <div class="takeaway">What you put in, and in what order, still matters.</div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/middle_sag.png" alt="Lost in the middle curve showing lower retrieval accuracy for information placed in the middle of context">
      </div>
    </div>
    <aside class="notes">
      Counter the "just paste everything in" reflex before they develop it. Source: Liu et al.
      (2023/24), Lost in the Middle, TACL. If asked for numbers: GPT-3 was ~2k tokens, current
      frontier models reach ~1M, roughly a million and a half words. Curation still beats dumping.
    </aside>
  </section>

  <section>
    <h2>Memory beyond the window</h2>
    <div class="cols">
      <div class="col visual-frame media-fit">
        <video src="assets/video/context.mp4" autoplay loop muted playsinline data-autoplay style="width:100%;height:auto;display:block;border-radius:16px;"></video>
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-violet);"><h4>Short-term</h4><p>The conversation, replayed each turn.</p></div>
        <div class="signal-card" style="--card-accent:var(--ait-green);"><h4>Long-term</h4><p>Facts stored outside and fetched when relevant.</p></div>
      </div>
    </div>
    <div class="takeaway">Memory is plumbing around the model, not magical recall.</div>
    <aside class="notes">
      Third mechanism, mention only: summarisation - old turns compressed into notes, which is lossy.
      Flag the trade-off between forgetting and overflow, then move on to RAG which is what they will
      actually buy.
    </aside>
  </section>

  <section>
    <h2>Retrieval: find first, then write</h2>
    <div class="visual-frame generated-flow-frame rag-frame full" role="img" aria-label="RAG pipeline: Question, Turn into numbers, Search by meaning, Most similar pieces, LLM, Answer">
      <img src="assets/img/m04-rag-flow-v2.png" alt="">
      <span class="flow-label rag-query">Question</span>
      <span class="flow-label rag-embed">Turn into numbers</span>
      <span class="flow-label rag-search">Search by meaning</span>
      <span class="flow-label rag-chunks">Most similar pieces</span>
      <span class="flow-label rag-llm">LLM</span>
      <span class="flow-label rag-answer">Answer</span>
    </div>
    <div class="rag-under">
      <div>
        <p class="footnote">Words become positions on a map of meanings &mdash; so &quot;search by meaning&quot; finds the right passage even when the wording differs.</p>
        <div class="takeaway">Your documents are not trained into the model. They are handed to it, one question at a time.</div>
      </div>
      <div class="visual-frame vector-video-frame mini">
        <video src="assets/video/latent_space.mp4" autoplay loop muted playsinline data-autoplay></video>
      </div>
    </div>
    <aside class="notes">
      The most useful pattern this audience will actually adopt. Land two consequences: (1) nothing
      is memorised, so updating a document updates the answers immediately; (2) the model can only
      answer from what retrieval found, so retrieval quality IS answer quality. The embedding video
      earns its place here: same maths as the map of meanings, used as a search index.
      Sources: Lewis et al. (2020); Karpukhin et al. (2020); Mikolov et al. (2013).
    </aside>
  </section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-05-behaviour-control.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">04</span>
    <p class="kicker">Module 4 <span class="mod-clock" data-clock-for="m4"></span></p>
    <h1>Steering it with plain language</h1>
    <p class="lede">The programming language here is your own.</p>
    <aside class="notes">
      Reframe "programming" for this room: they already know how to write the instructions. What
      they do not know yet is that writing them down, once, in a file, is the entire technique.
    </aside>
  </section>

  <section>
    <h2>Two places to write the rules</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>A prompt is not a question. It is a <strong>setup</strong>: you prepare the ground, you don't query an archive.</p>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Standing rules</h4>
          <p>Apply to every request. Safety, house style, vocabulary, what to never do.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>This request</h4>
          <p>The job in front of you: context, objective, style, tone, audience, format.</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m05-prose-stack.png" alt="Layered instruction sheets guiding an agent behaviour signal">
      </div>
    </div>
    <div class="takeaway">Write once, applies always. Write now, applies here.</div>
    <aside class="notes">
      The six task-prompt elements are CO-STAR (GovTech Singapore): Context, Objective, Style, Tone,
      Audience, Response. Name it only if someone asks - the acronym costs more attention than it
      returns with this audience. The distinction that matters is the two scopes, not the mnemonic.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>What it looks like</h2>
    <div class="cols">
      <div class="col visual-frame">
        <div class="layered-file">
          <div class="rule"># Standing rules</div>
          <div>- always cite the catalogue reference</div>
          <div>- never invent provenance data</div>
          <div>- uncertain fields: leave blank, flag [TO BE VERIFIED]</div>
          <br>
          <div class="context">## This request</div>
          <div>- Context: an auction lot description</div>
          <div>- Objective: a coin catalogue entry</div>
          <div>- Style: professional, concise</div>
          <div>- Audience: collectors and buyers</div>
          <div>- Response: 4 lines + condition grade</div>
          <br>
          <div class="comment"># the behaviour is now readable by a person</div>
        </div>
      </div>
      <div class="col stack-sm">
        <p>Plain text in a file. No code.</p>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Why it matters</h4>
          <p>The thing that controls the machine is the same thing a new colleague reads to learn the job.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      Markdown is just text with a bit of structure - headings, dashes. Say that once, do not teach
      it. The real point is the second card: this file is simultaneously the configuration and the
      documentation. For an SME with staff turnover, that is the sales pitch.
    </aside>
  </section>

  <section>
    <h2>Skills and tools</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Skill &mdash; <em>how</em> it works</h4>
          <p>A saved way of working, loaded when it fits the request. Written in the same plain language.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Tool &mdash; <em>what</em> it can do</h4>
          <p>A concrete action: open a PDF, read a spreadsheet, send a request. Result comes back as context.</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m05-tools-file-formats.png" alt="Procedural tool calls opening file formats such as PDF, spreadsheet and document outputs">
      </div>
    </div>
    <div class="takeaway">Skills package your judgement. Tools give it hands.</div>
    <aside class="notes">
      A skill is triggered by its description matching the request - "grill me" loads a critique
      flow. Worth one line: this deck's own repository is built with skills, so the method is
      demonstrated by the thing they are looking at. Tools handle PDF, XLSX, DOCX, PPTX, CSV, images
      and audio - relevant because their material is all PDFs and photographs.
    </aside>
  </section>

</section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-06-mcp-connectors.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">05</span>
    <p class="kicker">Module 5 <span class="mod-clock" data-clock-for="m5"></span></p>
    <h1>Agents at work</h1>
    <p class="lede">Reaching your systems &mdash; and how to drive without crashing.</p>
    <aside class="notes">
      Two halves: how it connects (connectors), and how a serious practitioner actually works with it
      (spec, verify, guardrails). The second half is the part that survives contact with their job.
    </aside>
  </section>

  <section>
    <h2>One socket instead of many</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-mxn-convention.png" alt="Agents and servers exchanging common message envelopes through one shared protocol lane">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Without a standard</strong><span>Every assistant-to-tool pair needs its own custom wiring.</span></div>
        <div class="mini-card"><strong>With MCP</strong><span>Assistants and tools speak one shared language of request and reply.</span></div>
        <div class="mini-card"><strong>Not a merge</strong><span>It moves requests and results. It does not pool your data.</span></div>
      </div>
    </div>
    <div class="takeaway">MCP is the USB-C of AI tooling: one plug, many devices.</div>
    <aside class="notes">
      Open standard from Anthropic, now widely adopted. Do not go near the specification. The line
      that matters commercially: their existing systems do not have to be rebuilt to be reachable.
      Sources: anthropic.com/news/model-context-protocol; modelcontextprotocol.io.
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2>Connectors in practice</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-connectors-runtime.png" alt="Agent runtime calling a connector that reaches files, spreadsheets, documents, databases and APIs through permission boundaries">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Discover</strong><span>The connector says what it can do.</span></div>
        <div class="mini-card"><strong>Call</strong><span>The agent sends a structured request.</span></div>
        <div class="mini-card"><strong>Return</strong><span>The result comes back as new context.</span></div>
      </div>
    </div>
    <div class="takeaway">This is where a chatbot becomes a colleague that does things.</div>
    <p class="footnote">Same questions as any integration: whose credentials, what scope, how much trust.</p>
    <aside class="notes">
      End on the capability jump but plant the risk seed - every connector is also an attack surface.
      Direct hand-off to Module 6, which opens by exploiting exactly this.
    </aside>
  </section>

  <section
    data-background-image="assets/img/chatbots-vs-agentic-systems-light.png"
    data-background-size="contain"
    data-background-position="center"
    data-background-repeat="no-repeat"
    data-background-color="#fbfaf6"
    aria-label="Chatbots compared with agentic systems">
    <aside class="notes">
      Deliberate breathing slide - nothing to read. A chatbot answers turn by turn; an agentic system
      combines a model, a harness and an app to pursue a longer goal. Use it to let the room reset
      before the two hardest ideas of the module.
    </aside>
  </section>

  <section>
    <h2>Jagged, not human</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Jagged ability</h4>
          <p>Brilliant at one task, hopeless at a neighbouring one that looks just as hard. There is no manual for which is which.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The car-wash test</h4>
          <p>A model that can rewrite a hundred thousand lines of code may tell you to <em>walk</em> to the car wash 50&nbsp;m away.</p>
        </div>
      </div>
      <div class="col vertical-captions">
        <div class="mini-card"><strong>A colleague</strong><span>Knows what they don't know. Asks. Adapts under pressure.</span></div>
        <div class="mini-card"><strong>An agent</strong><span>Completes the pattern. Confidently blind to what is missing.</span></div>
        <div class="mini-card"><strong>So</strong><span>Manage it by specifying and checking &mdash; not by trusting and delegating.</span></div>
      </div>
    </div>
    <div class="takeaway">Find the edges empirically, on your own work.</div>
    <aside class="notes">
      Karpathy: "We're not building animals. We're building ghosts" - statistical simulations of human
      text, not evolved creatures. The car-wash example is his own. Measured version: a field
      experiment with 758 BCG consultants (Dell'Acqua, Mollick et al., Organization Science) found AI
      raised quality inside the frontier and DEGRADED it outside, on tasks of similar apparent
      difficulty - 19 points less likely to be correct. Karpathy's metaphor, Mollick's data. This is
      the practitioner's version of the anti-anthropomorphism thread from Module 1.
    </aside>
  </section>

  <section class="practice-slide" data-background-color="#f4f8fb">
    <h2>Own the spec, then verify</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>1. Own the spec</h4>
          <p>The agent fills in blanks; you own the plan. Say what the work must let you <em>decide</em>, not just what to produce.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>2. Verify against something outside</h4>
          <p>Decide what &quot;correct&quot; looks like <strong>before</strong> it generates. Then check against the source document, not against its own opinion.</p>
        </div>
      </div>
      <div class="col stack-sm">
        <p><strong>Guardrails by risk, not by politeness.</strong> Written rules are suggestions the model can override. Real limits live outside it.</p>
        <div class="caption-row" style="grid-template-columns:1fr;">
          <div class="mini-card"><strong>Always do</strong><span>Routine, low risk &mdash; runs on its own.</span></div>
          <div class="mini-card"><strong>Ask first</strong><span>Moderate risk &mdash; confirmation required before acting.</span></div>
          <div class="mini-card"><strong>Never do</strong><span>Destructive or irreversible &mdash; blocked at the tool, out of the model's reach.</span></div>
        </div>
      </div>
    </div>
    <div class="takeaway">The generator is cheap. The check is the craft.</div>
    <aside class="notes">
      Karpathy's automation thesis: traditional software automates what you can specify; LLMs
      automate what you can VERIFY - so make your own work verifiable. Cherny (creator of Claude
      Code): "Give Claude a way to verify its work... it will 2-3x the quality" - a practitioner's
      estimate, say so. Shankar et al. (UIST 2024) on criteria drift: grading real outputs changes
      your criteria, so spec and verification feed each other; it is one loop, not a pipeline.
      Cautionary tale worth telling verbally: Karpathy's agent matched payments to accounts by email
      address instead of a persistent user ID - plausible code, wrong system design, caught only by
      human judgement. The three-tier table foreshadows Module 6: prose lives in the context, and
      context can be manipulated.
    </aside>
  </section>

</section>


<!-- ===== 06-risks-judgement.html ===== -->
<section>

  <section class="module-cover" data-background-image="assets/img/module-07-security-risks.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">06</span>
    <p class="kicker">Module 6 <span class="mod-clock" data-clock-for="m6"></span></p>
    <h1>Risks and judgement</h1>
    <p class="lede">What goes wrong &mdash; in the model, in us, in the data.</p>
    <aside class="notes">
      Three risk owners: the model, the user, the data. That structure should survive even if every
      example is forgotten. Then close on who decides.
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">model</span> What the model gets wrong</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Hallucination</h4>
        <p>Fluent, confident, false. Structural, not a bug. It can be reduced &mdash; not removed.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Bias</h4>
        <p>Skews in the training text carried through into the answer.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Agreeableness</h4>
        <p>Agrees with you rather than correcting you. It was trained to please.</p>
      </div>
    </div>
    <div class="takeaway">Fluency is evidence of pattern mastery, never proof of truth.</div>
    <p class="footnote">All three trace back to Module 1: it optimises for plausible text, not for true text.</p>
    <aside class="notes">
      Connect causally to the engine they saw in Module 1: sampling from a distribution with no truth
      oracle attached. That is why hallucination is manageable but not eliminable, and why the
      grounding ladder in Module 3 reduces it rather than solving it. The "stochastic parrot"
      provocation (Bender et al. 2021) belongs here if someone raises it - present it as a live
      debate, not a verdict. Sources: Ji et al. (2023); Perez et al. (2022); Sharma et al. (2023).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2><span class="chip risk">user</span> What happens to us</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="Human silhouette passing an amber thread of thought to a machine bracket">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Skill erosion</h4>
          <p>Offloading the thinking can erode the very skill you offloaded.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The fluency trap</h4>
          <p>Polished output feels more accurate than it is &mdash; especially outside your expertise.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">The risk is not only a wrong answer. It is losing the ability to notice one.</div>
    <aside class="notes">
      Make this concrete for a small firm: the expert in the room can spot a bad attribution
      instantly. A junior using the same tool cannot, and may never develop the eye if the tool
      always answers first. That is a staffing and training decision, not a technology one.
      Sources: Risko &amp; Gilbert (2016); Lee &amp; See (2004); Lee et al. (2025).
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">data</span> Where data leaks</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);"><h4>Cloud or local</h4><p>Who can see your questions and the files you upload?</p></div>
        <div class="signal-card" style="--card-accent:var(--ait-red);"><h4>Prompt injection</h4><p>Text inside a document quietly becomes an instruction.</p></div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m07-data-leaks.png" alt="Indirect prompt injection hijacking an agent tool path and causing unintended data movement">
      </div>
    </div>
    <div class="takeaway">The dangerous moment is when untrusted text stops being data and starts steering an action.</div>
    <div class="caption-row" style="grid-template-columns:repeat(4,1fr);margin-top:.5em;">
      <div class="mini-card"><strong>Free app</strong><span>Cheapest. Weakest guarantees about reuse.</span></div>
      <div class="mini-card"><strong>Subscription</strong><span>Business terms, data not used for training.</span></div>
      <div class="mini-card"><strong>Paid API</strong><span>Contractual control, your own logging.</span></div>
      <div class="mini-card"><strong>Local model</strong><span>Nothing leaves the building. Weaker answers.</span></div>
    </div>
    <p class="footnote">In the EU the <strong>AI Act</strong> (Reg. 2024/1689) and the <strong>GDPR</strong> both apply whichever you pick.</p>
    <aside class="notes">
      Connectors from Module 5 widen the attack surface: the agent now acts on untrusted input.
      Injection has no clean fix - design for least privilege and keep destructive actions in the
      "never do" tier. The four options are a real procurement decision for them, not a warning:
      the demo that follows opens by running the M3 question on a fully local model with the network
      unplugged, so they can feel the trade rather than be told about it.
      Sources: Greshake et al. (2023); OWASP Top 10 for LLM Applications.
    </aside>
  </section>

  <section class="demo-slide" data-demo="m6"></section>

  <section>
    <h2>The human in the loop</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/human-loop.png" alt="Green and violet loop meeting at amber checkpoints">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Working loop <span class="chip safe">safe</span></h4>
          <p>A person sets the goal, reviews what matters, and carries the responsibility.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Broken loop <span class="chip risk">risk</span></h4>
          <p>A person rubber-stamps. Oversight exists on paper only.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Oversight is real only if someone can understand, challenge and overrule.</div>
    <aside class="notes">
      Automation complacency: oversight degrades precisely because the system is usually right.
      For an auction house the point is sharp - responsibility toward buyers cannot be delegated to
      a model, legally or reputationally. They have just watched the expert overrule it live.
    </aside>
  </section>

  <section data-background-color="#fbfaf6">
    <h2>Where we landed</h2>
    <div class="recap-chain compact">
      <div class="step"><strong>1</strong><span>it predicts words</span></div>
      <div class="step"><strong>2</strong><span>inside / around</span></div>
      <div class="step"><strong>3</strong><span>feed it your documents</span></div>
      <div class="step"><strong>4</strong><span>write the rules down</span></div>
      <div class="step"><strong>5</strong><span>let it act, then check</span></div>
      <div class="step"><strong>6</strong><span>keep the judgement</span></div>
    </div>
    <div class="quote-strip" style="grid-template-columns:1fr;">
      <blockquote>&quot;You can outsource your thinking, but you can't outsource your understanding.&quot;<cite>a tweet Karpathy keeps returning to &mdash; AI Ascent (2026)</cite></blockquote>
    </div>
    <div class="takeaway">At the base it is probability. In your hands it is a tool. The hard part is judgement.</div>
    <aside class="notes">
      Attribution matters: Karpathy explicitly says this is a tweet he cites, not his own coinage -
      model the citation hygiene we preach. Two postures worth naming if there is time (Mollick,
      from the same BCG study): centaur, dividing the work at a clean seam; cyborg, interleaving at

      days. Same wording as T1 Q6.1 - write the answers down.

  <section>
    <h2>1948 &mdash; il linguaggio come gioco di probabilit&agrave;</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>Claude <strong>Shannon</strong> descrive il testo come una sorgente che emette parole con una certa probabilit&agrave;.</p>
        <p>Indovinare bene la parola successiva significa conoscere bene la lingua.</p>
        <div class="takeaway">Tutto quello che vediamo oggi poggia ancora su quella scommessa.</div>
      </div>
      <div class="col visual-frame tight">
        <img src="assets/img/shannons.png" alt="Shannon: il linguaggio come sorgente che emette simboli con una probabilit&agrave;">
      </div>
    </div>
    <aside class="notes">
      Fonti: Shannon (1948) A Mathematical Theory of Communication; Shannon (1951) Prediction and
      Entropy of Printed English. Un LLM &egrave; un enorme stimatore appreso della distribuzione del
      simbolo successivo di Shannon; tutto il resto &egrave; ingegneria attorno a quella scommessa.
      Non mettere la formula a schermo: ci pensa il widget fra due slide.
    </aside>
  </section>

<section>

  <section class="module-cover" data-background-image="assets/img/module-07-security-risks.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">06</span>
    <p class="kicker">Modulo 6 <span class="mod-clock" data-clock-for="m6"></span></p>
    <h1>Rischi e giudizio</h1>
    <p class="lede">Che cosa va storto &mdash; nel modello, in noi, nei dati.</p>
    <aside class="notes">
      Tre titolari di rischio: il modello, l'utente, i dati. Quella struttura deve sopravvivere anche
      se dimenticano ogni esempio. Poi si chiude su chi decide.
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">modello</span> Che cosa sbaglia il modello</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Allucinazione</h4>
        <p>Fluente, sicura, falsa. &Egrave; strutturale, non un difetto. Si riduce, non si elimina.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Distorsione</h4>
        <p>Gli squilibri dei testi di addestramento passano nella risposta.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Accondiscendenza</h4>
        <p>Vi d&agrave; ragione invece di correggervi. &Egrave; stato addestrato a piacere.</p>
      </div>
    </div>
    <div class="takeaway">La fluidit&agrave; prova la padronanza degli schemi, mai la verit&agrave;.</div>
    <p class="footnote">Tutte e tre risalgono al Modulo 1: ottimizza per il testo plausibile, non per il testo vero.</p>
    <aside class="notes">
      Collega causalmente al motore visto nel Modulo 1: campionamento da una distribuzione, senza
      nessun oracolo di verit&agrave; attaccato. Per questo l'allucinazione &egrave; gestibile ma non
      eliminabile, e per questo la scala del grounding del Modulo 3 la riduce invece di risolverla.
      La provocazione del "pappagallo stocastico" (Bender et al. 2021) sta qui se qualcuno la tira
      fuori: presentala come dibattito aperto, non come verdetto. Fonti: Ji et al. (2023); Perez et
      al. (2022); Sharma et al. (2023).
    </aside>
  </section>

  <section data-background-color="#f4f8fb">
    <h2><span class="chip risk">utente</span> Che cosa succede a noi</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="Silhouette umana che passa un filo ambrato di pensiero a una parentesi meccanica">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Erosione della competenza</h4>
          <p>Delegare il pensiero pu&ograve; consumare proprio la capacit&agrave; che avete delegato.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>La trappola della fluidit&agrave;</h4>
          <p>Un testo levigato sembra pi&ugrave; accurato di quanto sia &mdash; soprattutto fuori dalla vostra materia.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Il rischio non &egrave; solo una risposta sbagliata. &Egrave; perdere la capacit&agrave; di accorgersene.</div>
    <aside class="notes">
      Rendilo concreto per una piccola impresa: l'esperto in sala riconosce un'attribuzione sbagliata
      in un istante. Un giovane con lo stesso strumento no, e forse non svilupper&agrave; mai
      l'occhio se lo strumento risponde sempre per primo. &Egrave; una decisione di organico e
      formazione, non di tecnologia. Fonti: Risko &amp; Gilbert (2016); Lee &amp; See (2004);
      Lee et al. (2025).
    </aside>
  </section>

  <section>
    <h2><span class="chip risk">dati</span> Dove i dati escono</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);"><h4>Cloud o locale</h4><p>Chi pu&ograve; vedere le vostre domande e i file che caricate?</p></div>
        <div class="signal-card" style="--card-accent:var(--ait-red);"><h4>Prompt injection</h4><p>Il testo dentro un documento diventa di nascosto un'istruzione.</p></div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m07-data-leaks.png" alt="Prompt injection indiretta che dirotta il percorso degli strumenti di un agente e provoca movimenti di dati non voluti">
      </div>
    </div>
    <div class="takeaway">Il momento pericoloso &egrave; quando il testo non fidato smette di essere dato e inizia a guidare un'azione.</div>
    <div class="caption-row" style="grid-template-columns:repeat(4,1fr);margin-top:.5em;">
      <div class="mini-card"><strong>App gratuita</strong><span>Costa meno. Garanzie sul riutilizzo pi&ugrave; deboli.</span></div>
      <div class="mini-card"><strong>Abbonamento</strong><span>Condizioni business, dati non usati per addestrare.</span></div>
      <div class="mini-card"><strong>API a pagamento</strong><span>Controllo contrattuale, log vostri.</span></div>
      <div class="mini-card"><strong>Modello locale</strong><span>Non esce niente dall'azienda. Risposte pi&ugrave; deboli.</span></div>
    </div>
    <p class="footnote">Nell'UE l'<strong>AI Act</strong> (Reg. 2024/1689) e il <strong>GDPR</strong> si applicano comunque, qualunque opzione scegliate.</p>
    <aside class="notes">
      I connettori del Modulo 5 allargano la superficie d'attacco: ora l'agente agisce su input non
      fidato. L'injection non ha una soluzione pulita: progettate per privilegio minimo e tenete le
      azioni distruttive nel livello "non fare mai". Le quattro opzioni sono per loro una vera
      decisione d'acquisto, non un avvertimento: la demo che segue si apre eseguendo la domanda del
      Modulo 3 su un modello del tutto locale con la rete staccata, cos&igrave; possono sentire il
      compromesso invece di sentirselo raccontare. Fonti: Greshake et al. (2023); OWASP Top 10 per
      applicazioni LLM.
    </aside>
  </section>

  <!-- 1) Decide language and inject the matching deck BEFORE Reveal/widgets run.
       document.documentElement.lang is read by theory-widgets.js, so it must be
       set here first. -->
  <script>
    (function () {
      // Which edition this file is: 'sme' (index.html) or 'academic'
      // (academic.html). Read by the version-switch slide.
      document.documentElement.dataset.edition = 'sme';

      // localStorage throws (not returns null) on file:// opaque origins and
      // in strict privacy modes. Unguarded, that exception happens BEFORE the
      // deck is injected and the room gets a blank screen — so every access
      // goes through these helpers. Offline file:// use is a requirement here.
      window.deckStore = {
        get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      var DEFAULT_LANG = 'it'; // change to 'en' to publish English by default
      var lang = (deckStore.get('deck-lang') || DEFAULT_LANG).toLowerCase();
      if (lang !== 'en' && lang !== 'it') lang = 'en';
      document.documentElement.lang = lang;
      var tpl = document.getElementById('deck-' + lang);
      var slides = document.querySelector('.reveal .slides');
      if (tpl && slides) slides.innerHTML = tpl.innerHTML;
      // Free the memory of both templates once the active one is live.
      var other = document.getElementById('deck-' + (lang === 'en' ? 'it' : 'en'));
      if (tpl) tpl.remove();
      if (other) other.remove();

      document.addEventListener('DOMContentLoaded', function () {
        var btns = document.querySelectorAll('#lang-toggle button');
        Array.prototype.forEach.call(btns, function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
          b.addEventListener('click', function () {
            if (b.dataset.lang === lang) return;
            deckStore.set('deck-lang', b.dataset.lang);
            // Reload: Reveal keeps the slide number in the URL hash, so the
            // other language opens on the very same slide.
            location.reload();
          });
        });
      });
    })();
  </script>
