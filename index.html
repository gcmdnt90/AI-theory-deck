<section>

  <section data-nid="01-words#0" data-min="1" class="module-cover" data-background-image="assets/img/module-01-history.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">01</span>
    <p class="kicker">Module 1 <span class="mod-clock" data-clock-for="m1"></span></p>
    <h1>How the machine makes words</h1>
    <p class="lede">A 1948 idea, running at industrial scale.</p>
    <aside class="notes">
      <p>The module's claim: the idea behind language models is from 1948. What changed since is scale, data and architecture.</p>
      <p>By the end of the module the machine should have moved, in the listener's head, from oracle to sampler.</p>
    </aside>
  </section>

  <section data-nid="01-words#1" data-min="2">
    <h2>1948 &mdash; language as a game of probability</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li><strong>Shannon</strong>: text is a source that emits symbols with a probability.</li>
          <li>Sampling from those statistics gives sentences that <strong>sound English and say nothing</strong>.</li>
          <li><strong>1951</strong>: he measures how predictable English is &mdash; <strong>0.6&ndash;1.3 bits per letter</strong>.</li>
          <li>An LLM estimates the same distribution: <strong>learned</strong>, not counted by hand.</li>
        </ul>
      </div>
      <div class="col stack-sm">
        <div class="quote-strip single sample">
          <blockquote>THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS THAT THE TIME OF WHO EVER TOLD THE PROBLEM FOR AN UNEXPECTED.
            <cite>Text generated by Shannon in 1948 by sampling word-pair statistics.</cite>
          </blockquote>
        </div>
        <figure class="portrait">
          <img src="assets/img/shannons.png" alt="Claude Shannon with Betty Moore Shannon">
          <figcaption>Claude Shannon with Betty Moore Shannon, numerical analyst at Bell Labs.</figcaption>
        </figure>
      </div>
    </div>
    <div class="takeaway">Fluent and empty: the machine was already doing that in 1948.</div>
    <aside class="notes">
      <p>The 1948 sample is worth reading aloud: it sounds like English and says nothing. It is the literal ancestor of hallucination, and module 5 comes back to it.</p>
      <p>A language model is an enormous learned estimator of that same distribution. Everything else — memory, tools, rules — is engineering built around this single operation.</p>
      <p><strong>Going deeper.</strong> Shannon (1948), <em>A Mathematical Theory of Communication</em>, for the approximations to English; Shannon (1951), <em>Prediction and Entropy of Printed English</em>, for the measured 0.6&ndash;1.3 bits per letter with a hundred letters of context. It is the one number in the module worth saying out loud. The formula is deliberately kept off the slide: the widget two slides later does that job.</p>
    </aside>
  </section>

  <section data-nid="01-words#2" data-min="2">
    <h2>From rules to learned patterns</h2>
    <div class="corner-media" aria-hidden="true">
      <video src="assets/video/latent_space.mp4" autoplay loop muted playsinline data-autoplay></video>
    </div>
    <div class="visual-frame">
      <svg class="diagram" viewBox="0 0 1000 430" role="img" aria-label="Two-row timeline: rules, counts, vectors, Transformer, instructions, agents">
        <path d="M70 120 H930" stroke="#d9e1ea" stroke-width="2"/>
        <path d="M120 120 H880" stroke="#e3a12f" stroke-width="2.4" class="glow-amber" opacity=".45"/>
        <path d="M70 300 H930" stroke="#d9e1ea" stroke-width="2"/>
        <path d="M120 300 H880" stroke="#e3a12f" stroke-width="2.4" class="glow-amber" opacity=".45"/>
        <g fill="#ffffff" stroke-width="2.4">
          <circle cx="170" cy="120" r="17" stroke="#e3a12f"/>
          <circle cx="500" cy="120" r="17" stroke="#1597b5"/>
          <circle cx="830" cy="120" r="17" stroke="#34956f"/>
          <circle cx="170" cy="300" r="19" stroke="#8366c8" class="glow-amber"/>
          <circle cx="500" cy="300" r="17" stroke="#e3a12f"/>
          <circle cx="830" cy="300" r="17" stroke="#34956f"/>
        </g>
        <text x="170" y="78" text-anchor="middle" class="mono-label">1950s&ndash;80s</text>
        <text x="170" y="165" text-anchor="middle" class="label">rules</text>
        <text x="170" y="192" text-anchor="middle" class="mono-label">hand-written grammars</text>
        <text x="500" y="78" text-anchor="middle" class="mono-label">1990s&ndash;2010s</text>
        <text x="500" y="165" text-anchor="middle" class="label">counts</text>
        <text x="500" y="192" text-anchor="middle" class="mono-label">statistics beat rules</text>
        <text x="830" y="78" text-anchor="middle" class="mono-label">2013</text>
        <text x="830" y="165" text-anchor="middle" class="label">vectors</text>
        <text x="830" y="192" text-anchor="middle" class="mono-label">words become coordinates:</text>
        <text x="830" y="210" text-anchor="middle" class="mono-label">close = similar</text>
        <text x="170" y="258" text-anchor="middle" class="mono-label">2017</text>
        <text x="170" y="345" text-anchor="middle" class="label">Transformer</text>
        <text x="170" y="372" text-anchor="middle" class="mono-label">every word compared with every</text>
        <text x="170" y="390" text-anchor="middle" class="mono-label">other, in parallel</text>
        <text x="500" y="258" text-anchor="middle" class="mono-label">2022</text>
        <text x="500" y="345" text-anchor="middle" class="label">instructions</text>
        <text x="500" y="372" text-anchor="middle" class="mono-label">trained to follow instructions,</text>
        <text x="500" y="390" text-anchor="middle" class="mono-label">not just continue text</text>
        <text x="830" y="258" text-anchor="middle" class="mono-label">today</text>
        <text x="830" y="345" text-anchor="middle" class="label">agents</text>
        <text x="830" y="372" text-anchor="middle" class="mono-label">tools + loops</text>
      </svg>
    </div>
    <div class="takeaway">Three jumps: from rules to data, from data to vectors, from completion to instruction.</div>
    <aside class="notes">
      <p>Two minutes, no more: the timeline is a list of technical choices, not a story. The three stops that matter:</p>
      <p><strong>2013 (Mikolov)</strong> &mdash; words become vectors, and closeness in that space is closeness in meaning. It is the same mechanism that returns in module 3 under the name retrieval.<br>
      <strong>2017 (Vaswani)</strong> &mdash; attention compares every word with every other in parallel, and that is what makes large-scale training practical. The encoder-decoder does not get opened.<br>
      <strong>2022 (Ouyang, InstructGPT)</strong> &mdash; training with human feedback adds following instructions to merely completing text. It is the difference between a model that continues a sentence and the assistant everyone uses daily, and it is why module 4 works at all.</p>
      <p><strong>Sources.</strong> Mikolov (2013); Vaswani (2017); Brown (2020); Ouyang (2022).</p>
    </aside>
  </section>

  <section data-nid="01-words#3" data-min="2">
    <h2>Tokens, not words</h2>
    <ul class="slide-list">
      <li>The machine never sees letters: it sees <strong>sub-word pieces</strong>, chosen by frequency in the data.</li>
      <li>Rule of thumb: <strong>1 token &asymp; 4 characters &asymp; 3/4 of a word</strong> (in English).</li>
      <li>The token is the unit of <strong>price</strong> and of <strong>memory</strong> &mdash; and languages do not cost the same.</li>
    </ul>
    <div class="visual-frame">
      <div class="tokenizer-widget" data-tokenizer-widget>
        <div class="prompt-switcher token-presets" role="group" aria-label="Choose a sentence to tokenize">
          <button type="button" data-sentence="Tokenisation splits text into sub-word pieces." aria-pressed="true">sub-word</button>
          <button type="button" data-sentence="Count the letter r in strawberry." aria-pressed="false">letters</button>
          <button type="button" data-sentence="The lot weighs 12.7 grams, struck in 42 BC." aria-pressed="false">numbers</button>
          <button type="button" data-sentence="L'intelligenza artificiale aiuta la traduzione." aria-pressed="false">Italian</button>
          <button type="button" data-sentence="Artificial intelligence helps translation." aria-pressed="false">English</button>
        </div>
        <textarea class="tokenizer-input" rows="2" aria-label="Sentence to tokenize">Tokenisation splits text into sub-word pieces.</textarea>
        <div class="token-output" data-token-output></div>
        <div class="token-stats" data-token-stats></div>
        <div class="token-explainer" data-token-explainer>Hover or tap a token to see how frequent it is.</div>
      </div>
    </div>
    <p class="footnote">Real tokenizer: <code>cl100k_base</code>, the GPT-4 family encoding. Piece colour shows how frequent it is.</p>
    <aside class="notes">
      <p>A live, low-load slide. Type one of the room's own words into the box &mdash; a trade term, a client name: the rarer it is, the more pieces it breaks into, and the colour shows it.</p>
      <p>The "letters" preset is the fastest myth-killer in the deck: "&nbsp;strawberry" is ONE token, so the model never saw the individual r's. It does not fail out of stupidity: it fails because the letters never reach it.</p>
      <p>The Italian/English comparison is the moment an owner cares about. The same sentence costs 14 tokens in Italian and 6 in English (3.4 against 7.0 characters per token): same meaning, more than twice the cost and twice the window consumed.</p>
      <p><strong>Going deeper.</strong> Sennrich et al. (2016) for BPE; OpenAI for the rule of thumb of 1 token &asymp; 4 characters; Petrov et al. (NeurIPS 2023) for the gap between languages.</p>
    </aside>
  </section>

  <section data-nid="01-words#4" data-min="1">
    <h2>One operation, repeated</h2>
    <div class="cols">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li>It works out the odds of the next piece, <strong>picks one</strong>, adds it, starts again.</li>
          <li>What it writes becomes part of what it reads: <strong>early choices steer every later one</strong>.</li>
          <li>It consults no archive &mdash; it chooses, one piece at a time.</li>
        </ul>
      </div>
      <div class="col visual-frame">
        <div class="prob-widget" data-next-token-widget>
          <div class="prompt-switcher" role="group" aria-label="Choose a starting phrase">
            <button type="button" data-prompt="The capital of Italy is" aria-pressed="true">capital</button>
            <button type="button" data-prompt="The quote must state the" aria-pressed="false">quote</button>
            <button type="button" data-prompt="The satellite detected a" aria-pressed="false">satellite</button>
            <button type="button" data-prompt="To check the result you have to" aria-pressed="false">verify</button>
          </div>
          <div class="prompt-display" data-prompt-text>The capital of Italy is</div>
          <div class="bar-list"></div>
          <p class="temp-warning">Real probabilities &mdash; gpt-3.5-turbo-instruct, temperature 1, top 5 out of the whole vocabulary.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>The point to hammer is the loop: every word written enters what gets read at the next step, so the early choices steer all the later ones. Hallucination, creativity and fluency all come out of this same mechanism.</p>
      <p>The bars are <strong>real</strong> probabilities, measured once against the OpenAI API (gpt-3.5-turbo-instruct, temperature 1). They are not normalised: the grey bar is the rest of the vocabulary.</p>
      <p>The comparison that does the work: "the capital of Italy is" gives Rome at 81%, "the coin was struck in" gives its top candidate at 8%. Same machine, opposite confidence &mdash; and it writes in the same tone either way. Worth noticing too that some candidates (pre, arg, es) are word pieces, not words: that is the tokenizer from two slides ago.</p>
      <p>The formula is deliberately kept off the slide, and only comes out if someone asks.</p>
    </aside>
  </section>

  <section data-nid="01-words#5" data-min="1" data-background-color="#f4f8fb">
    <h2>Temperature: the randomness dial</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Low &middot; 0.2&ndash;0.5</h4>
          <p>The distribution tightens onto the most likely candidate.</p>
          <p class="ask">&rarr; extraction, classification, repeatable output</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>High &middot; 1.0&ndash;2.0</h4>
          <p>The distribution flattens: rare candidates get in.</p>
          <p class="ask">&rarr; variants, rewrites, brainstorming</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Always</h4>
          <p>It redistributes probability, <strong>it adds no knowledge</strong>. At T&nbsp;=&nbsp;0 a wrong answer just becomes a repeatable wrong answer.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="temp-widget" data-temp-widget>
          <p class="micro">T = <span data-temp-value>0.7</span></p>
          <input class="temp-slider" type="range" min="0.2" max="2.0" step="0.1" value="0.7" aria-label="Temperature">
          <div class="bar-list"></div>
          <svg class="temp-distribution" viewBox="0 0 520 185" data-temp-distribution role="img" aria-label="Live probability distribution curve"></svg>
          <p class="temp-warning">Real logits: the log of the measured probabilities. The recalculation with T is the actual formula.</p>
        </div>
      </div>
    </div>
    <div class="takeaway">Randomness is a setting, not a personality.</div>
    <aside class="notes">
      <p>The best interactive moment in the deck: drag the slider slowly to both extremes and let the bars do the talking. The base is the five real candidates from the previous slide, renormalised against each other, and the slider applies the real formula: softmax(logit/T).</p>
      <p>If only one minute is left, the line to say is the third card: temperature moves probability, not knowledge. At T&nbsp;=&nbsp;0 the model repeats the error instead of correcting it, and that is the misconception module 5 takes apart again.</p>
      <p>From here it goes straight into the demo: the same request is about to come back with four different answers.</p>
    </aside>
  </section>

  <section data-nid="01-words#6" class="demo-slide" data-demo="m1"></section>

</section>

<section>

  <section data-nid="02-inside-around#0" data-min="1" class="module-cover" data-background-image="assets/img/module-03-architectures.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">02</span>
    <p class="kicker">Module 2 <span class="mod-clock" data-clock-for="m2"></span></p>
    <h1>Inside the model</h1>
    <p class="lede">What it is, how it is made, and what &ldquo;reasoning&rdquo; means.</p>
    <aside class="notes">
      <p>The single most useful conceptual correction in the course. Almost every "can AI do X?" question is really a question about which side of this boundary X sits on.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#1" data-min="3" data-background-color="#f4f8fb">
    <h2>Three levels, one machine</h2>
    <div class="cols fit-two">
      <div class="col visual-frame media-fit levels-frame">
        <img src="assets/img/m01-levels-machine-v2.png" alt="Three-layer machine cutaway: probabilistic token substrate, learned concept layer, and human judgement layer">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4><span class="chip safe">macro</span> Judgement</h4>
          <p>The person who accepts or rejects the output.</p>
          <p class="ask">&rarr; &ldquo;who answers if it is wrong?&rdquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">meso</span> The system</h4>
          <p>Memory, tools, skills, connectors. <strong>This is where the work happens.</strong></p>
          <p class="ask">&rarr; &ldquo;why doesn't it know our price list?&rdquo;</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">micro</span> The base</h4>
          <p>Probabilities over the next piece of text. Always on.</p>
          <p class="ask">&rarr; &ldquo;why does it miscount letters?&rdquo;</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <h4>Inside is the processor. Around is everything else &mdash; and around is where the work happens.</h4>
      <p>You cannot retrain a frontier model, and you do not need to. The scaffolding is built today, and it can be undone.</p>
    </div>
    <div class="takeaway">The test: does it change the model itself, or only what the model is given?</div>
    <aside class="notes">
      <p>The deck's spine: the slide to defend if time runs short, and the only place the inside/around idea is stated. It used to be said twice, ten minutes apart, with two pictures and two vocabularies &mdash; that was the repetition the room felt. Said once here, everything later just refers back to it.</p>
      <p>Cristianini's mesoscopic level: micro = neurons, meso = the abstract ideas the model built by itself, macro = behaviour read almost psychologically. The flank needs covering: this is a claim about the right <em>level</em> of description (Marr 1982), not that the model became a mind. "It's just statistics over words" is true at micro and useless at meso, which is where the listener's actual work happens.</p>
      <p>The amber card is the commercial argument, and the good news for an SME: a frontier model is not something you retrain, and you do not need to. Everything that will make this useful in the business sits around it &mdash; and around is cheap, fast and reversible. Said explicitly, it reframes the day from "expensive AI project" to "configuration".</p>
      <p>The takeaway is the test used for the rest of the day: did this change the model itself, or only what the model was given? The three arrows are the index of the remaining course: macro &rarr; module 5, meso &rarr; modules 3 and 4, micro &rarr; the module that just ended. This module is the left half; the rest of the day is the right half.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#2" data-min="2">
    <h2>How a model is made</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m03-training-pipeline.png" alt="Three-stage light infographic for pretraining, supervised fine-tuning and preference tuning">
      </div>
      <div class="vertical-captions">
        <p class="cap-eyebrow">Yesterday &mdash; the only one we know in full</p>
        <div class="mini-card"><strong>1. Reads text</strong><span>Predicts the next word across enormous amounts of writing.</span><span class="fig">300 billion tokens</span></div>
        <div class="mini-card"><strong>2. Learns to follow instructions</strong><span>Examples teach it to carry out a task, not just continue text.</span><span class="fig">~13,000 hand-written examples</span></div>
        <div class="mini-card"><strong>3. Tuned by human feedback</strong><span>People judge the answers; the model is pushed towards the preferred ones.</span><span class="fig">~33,000 comparisons, ~40 people</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <h4>Today</h4>
      <p>Llama 3: <strong>~15 trillion tokens</strong> at step 1, fifty times InstructGPT &mdash; and a growing share of the examples in steps 2 and 3 is generated by <strong>other models</strong>, not written by people.</p>
    </div>
    <div class="takeaway">Knowledge comes from step 1. Assistant behaviour comes from steps 2 and 3.</div>
    <aside class="notes">
      <p>The common belief in the room: "the model is one trained thing that knows facts". It gets corrected here &mdash; and it is worth self-correcting too, because the three numbers belong to <em>one</em> specific model: InstructGPT, 2022, the ancestor of ChatGPT, built on top of GPT-3. It is the only case in the family with a complete public account of all three steps. For other models they change by orders of magnitude: the shape of the pipeline holds, the figures do not.</p>
      <p>The "Today" strip is the honest line of the module: it says that what is being learned has an expiry date. If time is short it can stay on screen without comment.</p>
      <p>Two hooks worth keeping in a pocket. Step 3 pushes the model towards what the raters liked: that is where sycophancy comes from, not from any wish to please &mdash; and module 5 picks it up. The synthetic data of step 2 is the same thing behind the invented sheets used in today's demos.</p>
      <p><strong>Sources.</strong> Brown (2020) for GPT-3; Ouyang (2022) for the three numbers; Llama 3 (2024) for the "Today" strip; Christiano (2017) for human feedback.</p>
    </aside>
  </section>

  <section data-nid="02-inside-around#3" data-min="3">
    <h2>&quot;Reasoning&quot;: trained or prompted</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4><span class="chip inside">inside</span> Trained</h4>
          <p>Trained with reinforcement learning to deliberate before answering: self-checking and second thoughts <strong>emerge from the training</strong>, not from an instruction.</p>
          <p class="ask">&rarr; the &ldquo;thinking&rdquo; versions of ChatGPT, Claude, Gemini and Copilot; DeepSeek-R1 is the one with a public account</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4><span class="chip around">around</span> Prompted</h4>
          <p>It is asked for in the prompt: &ldquo;list the criteria first, then decide&rdquo;.</p>
          <p class="ask">&rarr; free, on any model, including the free ones</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="reason-widget" data-reason-widget>
          <div class="mode-buttons">
            <button type="button" data-mode="trained" aria-pressed="true">Trained</button>
            <button type="button" data-mode="prompted" aria-pressed="false">Prompted</button>
          </div>
          <div class="reason-diagram" data-reason-diagram></div>
          <p class="reason-copy" data-reason-copy></p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>The switch injects no prompt: <strong>it turns on a mode of the model</strong> &mdash; and today the model itself decides how much to think. Written instructions, task lists and loops do exist, but they are scaffolding: module 4.</p>
    </div>
    <div class="takeaway">The visible steps are produced text, not the minutes of how it got there.</div>
    <p class="footnote">What scrolls past on screen is a model-generated summary, not the internal trace (OpenAI).</p>
    <aside class="notes">
      <p>Two of the three things are reasoning, the third is not, and the room confuses all three.</p>
      <p><strong>Prompted</strong> &mdash; asked for in the prompt, the model writes the steps as ordinary output, the model itself does not change.<br>
      <strong>Scaffolding</strong> &mdash; system prompt, instruction and personality files re-read on every request, task lists, loops, tools. It is real, but it is module 4, and it is not what makes a model a "reasoning" model.<br>
      <strong>Trained</strong> &mdash; reinforcement learning: the capability sits in the weights. DeepSeek-R1 shows it publicly, with pure RL and no human-written reasoning traces: self-verification, checking and strategy switching emerge from training. OpenAI says the same of o1: "our large-scale reinforcement learning algorithm teaches the model how to think productively using its chain of thought".</p>
      <p>What the button does, if asked: it injects no prompt, it turns on a technical mode. On Claude it was a thinking-token budget (<code>thinking</code> + <code>budget_tokens</code>, up to 4.6); from 4.7 that parameter was removed and replaced by adaptive thinking with an effort level, and the model decides for itself whether and how much to think. On ChatGPT, picking the "thinking" version routes to a different model. Version numbers age in weeks: they live here, not on screen, and should be checked against the deck's edition date.</p>
      <p><strong>Why the takeaway.</strong> Turpin et al. (2023) slipped a biasing cue into the input &mdash; for instance the correct answer always in the same position. Models were steered by it, got the answer wrong, and never named the cue in the chain: they built a plausible justification for the wrong answer, up to &minus;36% accuracy across 13 tasks. The cue is the measuring instrument, not advice for the audience, and does not go on screen.</p>
      <p>This slide is the first deposit of the vigilance module 5 collects (the "fluency is not evidence of accuracy" item). Demo D2 lands it: the toggle is the trained kind, "list the criteria first" is the prompted kind.</p>
      <p><strong>Sources.</strong> DeepSeek-R1 (2025); OpenAI, <em>Learning to reason with LLMs</em> (2024); Turpin et al. (2023); Wei et al. (2022); Nye et al. (2021).</p>
    </aside>
  </section>

<!-- ===== 03-context-grounding.html ===== -->
<section>

  <section data-nid="03-context-grounding#0" data-min="1" class="module-cover" data-background-image="assets/img/module-04-context-memory.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">03</span>
    <p class="kicker">Module 3 <span class="mod-clock" data-clock-for="m3"></span></p>
    <h1>Where it gets what it does not know</h1>
    <p class="lede">How the machine gets to know <em>a</em> business.</p>
    <aside class="notes">
      <p>The module with the most direct commercial value. The central distinction: context is what the model has in front of it right now, memory is what survives between one session and the next. Both sit "around".</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#1" data-min="2">
    <h2>The context window</h2>
    <p>Context is the model's desk: everything it can see while answering this one question.</p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m04-context-ram.png" alt="RAM-like context window with colored token segments loaded into immediate memory slots">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Rules</strong><span>The instructions sit at the front of the desk.</span><span class="fig">they stay only if they are written down: module 4</span></div>
        <div class="mini-card"><strong>Conversation + documents</strong><span>They compete for the same finite space.</span><span class="fig">measured in tokens, the ones from earlier</span></div>
        <div class="mini-card"><strong>Room to answer</strong><span>The reply needs space on the desk too.</span><span class="fig">full desk, shorter reply</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-violet);">
      <p>Every question re-sends <strong>the whole</strong> conversation. When it no longer fits, the oldest part is summarised or cut &mdash; and it is worth paying attention to when that happens.</p>
    </div>
    <div class="takeaway">The desk is wiped after every question unless things are put back on it.</div>
    <aside class="notes">
      <p>The image of the wiped desk is the one to take away. On its own it explains why a new chat "forgets", why long threads get worse, and why the instruction file of module 4 matters.</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#2" data-min="2" data-background-color="#f4f8fb">
    <h2>The context problem</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <p>Declared windows went from <strong>~2,000 tokens</strong> (2020) to <strong>~1,000,000</strong> on some models: from a few pages to a few hundred.</p>
        <p>But the declared window is not the usable one:</p>
        <ul class="slide-list">
          <li>what sits at the <strong>start</strong> and at the <strong>end</strong> is used better than what ends up buried in the middle;</li>
          <li>at 32,000 tokens <strong>11 models out of 13</strong> fall below half the score they reach on short texts.</li>
        <li>and when the window fills up, the oldest part is <strong>summarised or cut</strong> - automatically, lossily, and with no warning.</li>
        </ul>
        <p class="ask">&rarr; a few relevant documents beat &ldquo;paste everything in&rdquo;</p>
        <div class="takeaway">What goes in, and in what order, still matters.</div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/middle_sag.png" alt="&ldquo;Lost in the middle&rdquo; curve: lower accuracy for information placed halfway through the context">
      </div>
    </div>
    <p class="footnote">Chart: Liu et al., &ldquo;Lost in the Middle&rdquo; (TACL 2024), gpt-3.5-turbo over 20 retrieved documents. The 32,000-token figure: NoLiMa (ICML 2025).</p>
    <aside class="notes">
      <p>The "we'll just paste everything in" reflex is worth heading off before it forms.</p>
      <p>The third bullet is the ready answer to the question that always comes: the three-hour conversation where the chatbot "forgets" the beginning. It is not a fault and it is not a privacy choice: past a certain number of tokens the old part is compacted or cut, and granularity is lost. Every model has this limit; the size changes, the mechanism does not. Never say the system "learns" or "remembers": it puts text back on the desk, and that is all.</p>
      <p>The numbers, if asked: GPT-3 sat at ~2,000 tokens, frontier models declare up to ~1,000,000, which is roughly 700-750 thousand words (a token is about three quarters of a word: <em>not</em> a million and a half).</p>
      <p>The two lines on the slide say two different things and should stay distinct. The first is position: the chart is from 2023 on gpt-3.5-turbo, so it is not the last word. The second is recent and harder: in the NoLiMa benchmark (ICML 2025), at 32,000 tokens 11 models out of 13 drop below half their short-text score, and GPT-4o goes from 99.3% to 69.7%. It is the ready answer to "but the windows are enormous now": enormous yes, usable in full no.</p>
      <p>The closing arrow is the bridge to retrieval: if a few relevant documents beat the pile, something has to choose them.</p>
      <p><strong>Sources.</strong> Liu et al. (2023/24), <em>Lost in the Middle</em>, TACL; Modarressi et al. (2025), <em>NoLiMa</em>, ICML.</p>
    </aside>
  </section>

  <section data-nid="03-context-grounding#3" data-min="2">
    <h2>Retrieval: find first, then write</h2>
    <div class="cols fit-two">
      <div class="col">
        <div class="visual-frame media-fit">
          <video src="assets/video/retrieval.mp4" autoplay loop muted playsinline data-autoplay></video>
        </div>
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>Once: it is indexed</h4>
          <p>Documents are cut into pieces; each piece becomes a position on a map of meanings. They stay outside the model.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Each question: it is searched</h4>
          <p>The question becomes a position too. Only the nearest pieces come in: that is the anchoring, the <em>grounding</em>.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>When it fails</h4>
          <p>If the question is worded far from the document's wording, the right pieces never come in. And an answer arrives anyway.</p>
        </div>
      </div>
    </div>
    <p class="chain">question &rarr; into numbers &rarr; search by meaning &rarr; most similar pieces &rarr; LLM &rarr; answer</p>
    <div class="takeaway">The company's documents are not trained into the model: they are handed to it, one question at a time.</div>
    <aside class="notes">
      <p>The most useful diagram this audience will actually adopt. The video carries the point on its own: the wall of documents does not move, the empty slots stay empty, only a few pieces travel.</p>
      <p>The first card is the step missing from every explanation heard elsewhere, and it is what takes apart the three commonest wrong ideas about "uploading the documents": it is not a Ctrl+F over the archive, it is not the model learning the document, it is not indexing by name and date. It is split, converted into numbers, and the index is saved: once, and outside the model. The map of meanings is the same one seen in module 1 at the "vectors" stop.</p>
      <p>The second card is where the word gets named: anchoring the answer to a retrieved source is grounding, and it is the title of the demo that follows.</p>
      <p>The third card is worth saying aloud, with the example: "how do I handle holidays?" finds nothing, "how do I request annual leave?" finds it at once. Same question, different words. Search works by closeness of meaning, not exact words; if the question lands far from how the document is written, the right passage does not come back &mdash; and nothing warns you. That is why the demo shows the retrieved passages instead of trusting the answer.</p>
      <p>The two operational consequences to land: nothing is memorised, so updating a document changes the answers immediately with no retraining; and the model can only answer with what retrieval found, so the quality of retrieval <em>is</em> the quality of the answer.</p>
      <p><strong>Sources.</strong> Lewis et al. (2020) RAG; Karpukhin et al. (2020) Dense Passage Retrieval; Mikolov et al. (2013).</p>
    </aside>
  </section>

</section>

<section>

  <section data-nid="04-steer-act#0" data-min="1" class="module-cover" data-background-image="assets/img/module-05-behaviour-control.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">04</span>
    <p class="kicker">Module 4 <span class="mod-clock" data-clock-for="m4"></span></p>
    <h1>From instructions to tools</h1>
    <p class="lede">Instructions in plain language, tools able to understand it*</p>
    <p class="footnote">* Templeton et al., <em>Scaling Monosemanticity</em>, Transformer Circuits 2024 &mdash; the "Golden Gate Bridge" feature and the other concept-linked activations. Gurnee et al., <em>Verbalizable Representations Form a Global Workspace in Language Models</em>, Transformer Circuits 2026.</p>
    <aside class="notes">
      <p>The longest module and the most operational: once the rest is understood, this is the layer where the daily work actually happens.</p>
      <p>For this room, "programming" needs reframing. Writing instructions is something they already do. What they do not yet know is that writing them <em>once, into a file</em> is the whole technique, and that from there the same text can command a tool that opens their own files.</p>
      <p>The module's arc: where it is written &rarr; where what is written enters from &rarr; from chatbot to something that acts &rarr; how it reaches their systems &rarr; spec, verification and limits. Two live windows of about two minutes, on the second and fourth slides; the closing demo runs the whole arc in one session.</p>
      <p><strong>Going deeper.</strong> The asterisk on the cover is latent space; both references are already on the slide in small print: transformer-circuits.pub/2024/scaling-monosemanticity and transformer-circuits.pub/2026/workspace.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#1" data-min="3">
    <h2>Two places to write the rules</h2>
    <div class="cols">
      <div class="col stack-sm">
        <p>This request is the text that changes every time. Standing rules are the text that is <strong>re-read on every request</strong>.</p>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Prompt engineering</h4>
          <p>The work to be done, stated in full:<br><strong>C</strong>ontext, <strong>O</strong>bjective, <strong>S</strong>tyle, <strong>T</strong>one, <strong>A</strong>udience, <strong>R</strong>esponse.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Standing rules</h4>
          <p>Apply to every request. Safety, house style, vocabulary, what to never do.</p>
          <p class="chain">personality.md &middot; CLAUDE.md &middot; AGENT.md &middot; CONTEXT.md</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m05-prose-stack.png" alt="Layered instruction sheets steering an agent's behaviour signal">
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-amber);">
      <p>Everything written in the prompt stays one text among others on the desk from module 3: it can be <strong>summarised</strong>, it can be <strong>cut</strong>, it can be <strong>overridden</strong>.</p>
    </div>
    <aside class="notes">
      <p>The order of the cards is deliberate: the request first, which they already know how to write, then standing rules, which is the new thing. The whole module runs right-to-left against the room's habits.</p>
      <p>CO-STAR is GovTech Singapore's. It is on screen with all six items, so it can be named: an acronym with its visual anchor beside it costs little, an acronym merely spoken costs attention. The card's real content is not the initialism, it is that a complete request gets written, not improvised.</p>
      <p>The four filenames under the first card do not live in the same place: <code>personality.md</code> is in the settings, the other three in a working folder. The next slide assigns each name to its mechanism; here they only show that these are real files with names you type.</p>
      <p>The amber card is the module's hinge, and the three verbs are three different things. <em>Summarised</em> and <em>cut</em> come from module 3. <em>Overridden</em> is seen happening at beat four of the demo, when the house rules are set aside on request and the model complies: the three-tier table on the last slide is born from that third verb.</p>
      <p><strong>Narrative job.</strong> This slide serves no Concept Test item. Its work is to establish that a written artefact exists and that it has two layers; without that, nothing later has anything material to stand on.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#2" data-min="3" data-background-color="#f4f8fb">
    <h2>Where standing rules enter from</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="caption-row two">
          <div class="mini-card"><strong>Instructions</strong><span>On every request, always. The only one that occupies context every time.</span><span class="fig">personality.md</span></div>
          <div class="mini-card"><strong>Projects</strong><span>When the project opens. If the files exceed the window, they enter in pieces &mdash; module 3.</span><span class="fig">.md &middot; .pdf</span></div>
          <div class="mini-card"><strong>Directory</strong><span>Only if the agent reads the file: it takes a tool and a decision.</span><span class="fig">CLAUDE.md &middot; CONTEXT.md</span></div>
          <div class="mini-card"><strong>Skills</strong><span>Only when the description matches the request.</span><span class="fig">SKILL.md</span></div>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>Why it matters</h4>
          <p>The thing that controls the machine is the same thing a new colleague reads to learn the job.</p>
        </div>
      </div>
      <div class="col visual-frame">
        <div class="layered-file" data-standing-rules="m4-p2" data-standing-rules-heading="# Standing rules"></div>
      </div>
    </div>
    <aside class="notes">
      <p>A live window, about two minutes, in this order: the instructions in the settings, a project with its files, a folder with a <code>CLAUDE.md</code> in it, a skill that fires by itself. Show it, do not narrate it: the grid on the slide is the commentary.</p>
      <p>The axis of the four cells is not "always versus conditional", it is <em>when it enters the context</em>, and the four answers differ. <strong>Instructions</strong> is the only truly unconditional one, and also the only one paid for on every request: half a page written there travels every time. <strong>Projects</strong> holds for that project, but when the files exceed the window they are not loaded, they are retrieved in pieces &mdash; which is exactly rung 2 versus rung 3 of module 3's ladder. <strong>Directory</strong> depends on the agent deciding and on a tool that reads: if it does not open the file, the file does not exist. <strong>Skills</strong> depends on the description, not the content: the description decides the loading.</p>
      <p>The block on the right is not a mockup: it is the identical text the demo will paste at step 2, taken from <code>demo-prompts.json</code> and switched by the sector selector.</p>
      <p>On "and Markdown?": it is just text with a little structure, headings and dashes. Say it once, do not teach it.</p>
      <p>The amber card is the module's commercial argument: for an SME with staff turnover, the configuration file and the training manual are the same document. This deck's own repository is built with skills, so the method is demonstrated by the thing they are looking at.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#3" data-min="2">
    <h2>Chatbot and agentic system</h2>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/chatbots-vs-agentic-systems-light.png" alt="Chatbots compared with agentic systems">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Loop</strong><span>Decides, acts, observes the result, decides again.</span><span class="fig">the model decides when to stop: that is why it can spin in circles</span></div>
        <div class="mini-card"><strong>Tools</strong><span>Functions described in words, which the model chooses whether to call.</span><span class="fig">files, search, email, databases &mdash; module 5</span></div>
        <div class="mini-card"><strong>Memory</strong><span>What is put back in front of it on the next turn.</span><span class="fig">how it actually works: module 3</span></div>
      </div>
    </div>
    <div class="takeaway">The difference between a chatbot and an agent is the scaffolding around the same model, not a bigger model.</div>
    <aside class="notes">
      <p>The module's hinge, and the only place an agentic system gets defined. It used to be defined in module 2 as well, two modules earlier and in the abstract: one of the three places the same idea was being repeated. Here the definition arrives where it is about to be used &mdash; the next slide is how tools reach their systems, and the demo after that runs the loop on their own folder.</p>
      <p>The loop is worth saying aloud &mdash; decides, acts, observes &mdash; because those are exactly the three words that will narrate the Cowork demo, and they have to be recognisable when they come back.</p>
      <p>Up to here a text has been written; from here that text commands something that acts. The difference in one line, if asked: a chatbot answers turn by turn, an agentic system chases a goal longer than one turn.</p>
      <p>On cost, which someone always raises: the answer is on the first card. The loop decides for itself when to stop, so a badly set-up agent can repeat useless rounds &mdash; which is exactly why the module's last slide writes the spec first and verifies after.</p>
      <p><strong>Sources.</strong> Yao et al. (2023) ReAct; Schick et al. (2023).</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#4" data-min="3">
    <h2>MCP &mdash; reaching the company's systems</h2>
    <p class="quote-line">"Think of MCP like a USB-C port for AI applications. Just as USB-C provides a standardized way to connect electronic devices, MCP provides a standardized way to connect AI applications to external systems." <span class="attrib">&mdash; official MCP documentation</span></p>
    <div class="art-copy-layout">
      <div class="visual-frame media-fit">
        <img src="assets/img/m06-mxn-convention.png" alt="Agents and servers exchanging common message envelopes through one shared protocol lane">
      </div>
      <div class="vertical-captions">
        <div class="mini-card"><strong>Discover</strong><span>The connector says what it can do.</span></div>
        <div class="mini-card"><strong>Call</strong><span>The agent sends a structured request.</span></div>
        <div class="mini-card"><strong>Return</strong><span>The result comes back as new context.</span></div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <p>Without a standard, <strong>n</strong> applications and <strong>m</strong> tools need <strong>n&times;m</strong> pieces of custom wiring. With one protocol, <strong>n+m</strong> are enough &mdash; and the systems the company already has do not have to be rebuilt to be reachable. It moves requests and results: it does not pool the data.</p>
    </div>
    <p class="footnote">Same questions as any integration: whose credentials, what scope, how much trust.</p>
    <aside class="notes">
      <p>A live window, about two minutes: the connector list open in two different products, nothing more. It exists to show this is not one vendor's thing.</p>
      <p>The quotation is literal and comes from the protocol's own documentation: "Think of MCP like a USB-C port for AI applications." It should be delivered as a quotation, not as our own line.</p>
      <p>The n&times;m &rarr; n+m arithmetic is the mechanism, the USB-C port is its illustration: five applications and six tools make thirty bespoke integrations against eleven.</p>
      <p><strong>Timeline</strong>, for "what if they change their minds?": open protocol published 25 November 2024, adopted by OpenAI in March 2025 and by Google in April 2025, donated on 9 December 2025 to the Agentic AI Foundation, a directed fund of the Linux Foundation co-founded with OpenAI and Block. It is no longer governed by a single company.</p>
      <p>The technical specification is not worth going near. The sentence that matters commercially is the one on the card: their existing systems do not have to be rebuilt to become reachable.</p>
      <p>The three moves are the mechanism. The third ties the module back to module 3: a tool's result does not "enter the model", it comes back onto the desk as new context. This is where the risk seed gets planted, because every connector is also an attack surface: module 5 opens by exploiting exactly this.</p>
      <p><strong>Sources.</strong> modelcontextprotocol.io; anthropic.com/news/model-context-protocol; anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation.</p>
    </aside>
  </section>

  <section data-nid="04-steer-act#5" data-min="2" class="practice-slide" data-background-color="#f4f8fb">
    <h2>Spec, verification, and limits outside the model</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-cyan);">
          <h4>1. The spec stays with whoever commissions the work</h4>
          <p>Every degree of freedom left open is closed with a plausible default, drawn from the training distribution rather than from the case at hand. Specifying means listing what is <strong>not</strong> left to the tool to decide, starting from which <em>decision</em> the work must enable.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>2. Verification runs against the source</h4>
          <p>The criterion is fixed <strong>before</strong> generation, the check runs <strong>after</strong>, against the source document and not against the output. A criterion written after reading the answer bends to the answer.</p>
        </div>
      </div>
      <div class="col stack-sm">
        <p>The three tiers are chosen by <strong>reversibility and cost of error</strong>, not by perceived seriousness, and applied at the tool, not in the prompt.</p>
        <div class="caption-row" style="grid-template-columns:1fr;">
          <div class="mini-card"><strong>Always do</strong><span>Reversible, low cost: runs on its own.</span></div>
          <div class="mini-card"><strong>Ask first</strong><span>Reversible but expensive: confirmation required before acting.</span></div>
          <div class="mini-card"><strong>Never do</strong><span>Irreversible: blocked at the tool, out of the model's reach.</span></div>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>This slide introduces nothing: it names three things the demo has just made happen. Point 1 is beat six (the criteria stated aloud before launching), point 2 is beat eight (the table checked against the source documents), point 3 is beat four (the house rules overridden). If the demo landed, pointing is enough here.</p>
      <p>The line above the three tiers used to be a fourth card: it reads on its own and does not need saying.</p>
      <p>The criterion for the three tiers is <strong>reversibility and cost of error</strong>, not perceived seriousness: sending a wrong email is irreversible and belongs in the third row even if it looks trivial, while rewriting a draft is reversible and belongs in the first even if the text matters. The exercise is done aloud, with one of their own tasks.</p>
      <p><strong>Going deeper.</strong> Karpathy's thesis on automation: traditional software automates what you can specify, LLMs automate what you can <em>verify</em>, so it pays to make your own work verifiable. Cherny, creator of Claude Code: "give Claude a way to verify its own work and you double or triple the quality" &mdash; a practitioner's estimate, not a measurement. Shankar et al. (UIST 2024) on criteria drift: evaluating real output changes the criteria, so spec and verification feed each other; it is a loop, not an assembly line.</p>
      <p>The anecdote is the best content on the slide: Karpathy's agent matched payments to accounts by email address instead of a stable identifier. Plausible code, wrong design, caught only by human judgement &mdash; and no line-by-line re-reading would have found it, because every line was correct.</p>
      <p>Handover to module 5: prose lives in the context, and context can be manipulated.</p>
    </aside>
  </section>

</section>


<!-- ===== 05-risks-judgement.html ===== -->
<section>

  <section data-nid="05-risks-judgement#0" data-min="1" class="module-cover" data-background-image="assets/img/module-08-ethics.png" data-background-size="cover" data-background-color="#fbfaf6">
    <span class="modnum">05</span>
    <p class="kicker">Module 5 <span class="mod-clock" data-clock-for="m5"></span></p>
    <h1>Risks and judgement</h1>
    <p class="lede">What goes wrong and who stays responsible.</p>
    <aside class="notes">
      <p>The last module, and the one that makes everything else defensible: the previous four showed what the machine can be made to do, this one says on what conditions the result holds up in front of a client.</p>
      <p>Three owners of risk &mdash; the model, the person using it, the data &mdash; and then who decides. That structure has to survive someone forgetting every example, and it is the one thing worth saying twice.</p>
      <p>It is not a module of warnings, and saying so up front matters: every risk named here already has its counter-move in the earlier modules &mdash; ground it in the documents (M3), write the rules and verify (M4), keep destructive actions out of the tool's reach. Without that framing the room stiffens and the closing demo reads as a punishment.</p>
      <p>It ends on the commitment question: one thing each person will try in the next 30 days, written down and not just spoken.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#1" data-min="2">
    <h2><span class="chip risk">model</span> What the model gets wrong</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Hallucination</h4>
        <p>Fluent, confident, false. Structural, not a bug: it is reduced by anchoring it to documents and checking it. Not removed.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-red);">
        <h4>Bias</h4>
        <p>With no references of its own it returns the average of what has already been written: the words, patterns and structures the web is full of.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Agreeableness</h4>
        <p>Push back and it retracts &mdash; even when it was right. Finetuning rewards the answers people approve of.</p>
      </div>
    </div>
    <div class="banner-media">
      <img src="assets/img/m05-plausible-path.png" alt="Many thin traces braiding into one confident amber stroke while a few peel away and fade out">
    </div>
    <p class="footnote">The first two come from the engine of Module 1 &mdash; plausible text, not true text. The third comes from how it was finetuned: on human judgements.</p>
    <aside class="notes">
      <p>The causal thread starts in module 1: the engine samples from a distribution, with no oracle of truth attached. The first two cards come from there.</p>
      <p><strong>Hallucination.</strong> It is also the correct answer to one of the test items: it is structural, it is reduced by grounding in documents and human verification, and it is not eliminated. Worth saying in those words.</p>
      <p><strong>Bias, the measured version.</strong> Doshi &amp; Hauser, <em>Science Advances</em> 10(28), eadn5290 (2024) &mdash; online, peer-reviewed experiment. With a single AI-generated idea, stories become more original to their writers (+8.1% novelty) but 10.7% more similar to each other. This is not a moral judgement about training data: it is the average of what has already been written resurfacing whenever a reference of one's own is missing. It is why module 3's ladder changes the result, and why in the demo the disciplined prompt pulls a different structure out of the same material. Where the model touches people &mdash; hiring, assessment, credit &mdash; bias also becomes a legal matter (AI Act, high-risk systems): name it, do not open it, because it is not what this course demonstrates.</p>
      <p><strong>Sycophancy, the measured version.</strong> Sharma et al., ICLR 2024 (Anthropic), across five state-of-the-art assistants. When a user pushes back on a correct answer, models change their initial answer between 32% and 86% of the time depending on the model; a user who suggests a wrong answer drops accuracy by up to 27 points. It is a mechanism, not a motive: fine-tuning uses human judgements, and people prefer answers that confirm what they already think. It is the bridge to the third card of the user slide: the assumption put into the question comes back confirmed.</p>
      <p>The "stochastic parrot" (Bender et al. 2021) belongs here if someone raises it: open debate, not verdict. Survey on hallucination: Ji et al. (2023).</p>
    </aside>
  </section>


  <section data-nid="05-risks-judgement#2" data-min="2" data-background-color="#f4f8fb">
    <h2><span class="chip risk">user</span> What happens to the person using it</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/cognitive-delegation.png" alt="A human silhouette handing an amber thread of thought to a mechanical bracket">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>Skill erosion</h4>
          <p>What is delegated gets practised less. Those who trust the tool check less; those who trust themselves check more.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The fluency trap</h4>
          <p>Polished text moves confidence, not accuracy &mdash; and moves it most outside one's own field.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>The question enters the answer</h4>
          <p>An assumption planted in the question comes back as if established. Asking <em>why</em> something is true does not check that it is.</p>
        </div>
      </div>
    </div>
    <aside class="notes">
      <p>Make it concrete for a small business: the expert in the room spots a wrong attribution instantly. A junior with the same tool does not, and may never develop the eye if the tool always answers first. That is a staffing and training decision, not a technology one.</p>
      <p><strong>First card, and what kind of evidence it is.</strong> That we remember less of what we delegate is old and solid (Sparrow, Liu &amp; Wegner 2011, <em>Science</em>, the Google effect). That expertise atrophies is <em>not</em> established, and should not be claimed. The closest data is Lee, Sarkar, Tankelevitch et al., CHI 2025 &mdash; 319 knowledge workers, 936 real episodes: more confidence in the tool goes with less critical thinking, more self-confidence with more of it. It is an association in a self-reported survey, and should be presented as one. Risko &amp; Gilbert's review (2016) describes when people offload, not that the capacity decays.</p>
      <p><strong>Second card.</strong> Perry, Srivastava, Kumar &amp; Boneh, CCS 2023 &mdash; controlled user experiment. Participants with the assistant wrote significantly less secure code and were more convinced they had written it securely; and those who trusted it less, and worked on how they phrased the prompt, produced fewer vulnerabilities. Code domain, 2022 model: say so. The second half of that result is the thesis of part C of the demo, minutes away.</p>
      <p><strong>Third card.</strong> It closes module 3's thread, "holidays" against "annual leave". There the words moved retrieval; here the assumption moves generation, because the prompt is the text the model continues. The example is said aloud, matched to the sector in the room: "why is this coin rarer?" &middot; "why is this plant underperforming?" &middot; "why did this test fail?" &mdash; none of the three checks that the premise is true.</p>
      <p>The operating rule to dictate: ask "what is missing from this attribution?", not "confirm that this attribution is right".</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#3" data-min="2">
    <h2><span class="chip risk">data</span> When text becomes an instruction</h2>
    <div class="cols">
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Prompt injection</h4>
          <p>An untrusted document carries a sentence the model <em>executes</em> instead of summarising.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-violet);">
          <h4>Why it matters now</h4>
          <p>With the tools from Module 4 the model does not only answer: it opens files, writes, sends. Untrusted text stops being data and starts driving an action.</p>
        </div>
      </div>
      <div class="col visual-frame media-fit">
        <img src="assets/img/m07-data-leaks.png" alt="Indirect prompt injection hijacking an agent's tool path and causing unintended data movement">
      </div>
    </div>
    <aside class="notes">
      <p>The line not to lose: while the model only writes text, a hidden instruction produces a wrong answer; once it has tools, it produces an action. Module 4's connectors widened the attack surface an hour earlier, in this same room.</p>
      <p>Injection has no clean solution. It is not a bug closed by a patch: it follows from instructions and data reaching the model through the same channel, as text. So the design principle is least privilege &mdash; the tool sees only the folder it needs, and destructive actions live in the "never" tier of the table already seen in module 4.</p>
      <p>Minutes later, part B of the demo runs the identical request of <code>m4-p7</code> against the poisoned folder: the only changed variable is the document. Then the PDF opens, Ctrl+A, and the grey text is revealed. Do not pre-empt it: it has to derail in front of them.</p>
      <p><strong>Sources.</strong> Greshake et al. (2023), <em>Indirect Prompt Injection</em>; OWASP Top 10 for LLM applications.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#4" data-min="2">
    <h2><span class="chip risk">data</span> Who sees this data</h2>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-cyan);">
      <h4>The question</h4>
      <p>Who can see the questions and the uploaded files? The answer depends on the tool and the contract, not on the model.</p>
    </div>
    <div class="caption-row" style="grid-template-columns:repeat(4,1fr);margin-top:.6em;">
      <div class="mini-card"><strong>Free app</strong><span>Is the data used for training? Where is that written, and since when?</span></div>
      <div class="mini-card"><strong>Subscription</strong><span>Does the work plan exclude training? Is it in the contract or on a help page?</span></div>
      <div class="mini-card"><strong>Paid API</strong><span>Who keeps the logs, for how long, in which country?</span></div>
      <div class="mini-card"><strong>Local model</strong><span>Nothing leaves the company: it runs on the laptop. How much quality does that cost?</span></div>
    </div>
    <p class="footnote">In the EU the <strong>AI Act</strong> (Reg. 2024/1689) and the <strong>GDPR</strong> apply regardless of which option is chosen.</p>
    <aside class="notes">
      <p>This is the pre-demo. The four columns are written as questions rather than guarantees on purpose: terms change by vendor, by plan and over time, and the presenter is not their lawyer.</p>
      <p>What always holds is the footnote: whichever box they pick, both regulations apply anyway. The technical option is not a legal shortcut.</p>
      <p>It closes by opening Ollama and showing the window: no example, no proof, just "this is a model running in here". It takes the abstraction out of the fourth card and the stagecraft out of the demo &mdash; part A starts from a tool already open and already explained, and all that is left is to unplug the network and ask module 3's question again.</p>
      <p>If the room is engaged, this is where discussion prompt <code>m5-p4</code> belongs: which of the four options they would accept for a client's unpublished material. It makes the choice theirs instead of somebody else's warning.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#5" class="demo-slide" data-demo="m5"></section>

  <section data-nid="05-risks-judgement#6" data-min="2">
    <h2>The human in the loop</h2>
    <div class="cols">
      <div class="col visual-frame tight">
        <img src="assets/img/human-loop.png" alt="A green and violet loop meeting at amber checkpoints">
      </div>
      <div class="col stack-sm">
        <div class="signal-card" style="--card-accent:var(--ait-red);">
          <h4>Why oversight slackens</h4>
          <p>The system is usually right, and attention moves elsewhere. It holds for experts as much as for novices, and it is not fixed by telling people to be careful.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-green);">
          <h4>What stopped it</h4>
          <p>Five minutes ago it was not an automated check: it was someone who knew the piece and could say no.</p>
        </div>
        <div class="signal-card" style="--card-accent:var(--ait-amber);">
          <h4>The same tool, the other way round</h4>
          <p>Have it argue the opposite, ask it what is missing, be interrogated by it. Those who interrogate it rather than delegate to it get better results.</p>
        </div>
      </div>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>The test</h4>
      <p>Oversight is real only if someone can <strong>understand</strong>, <strong>challenge</strong> and <strong>overturn</strong>. Missing any of the three, it is a rubber stamp.</p>
    </div>
    <aside class="notes">
      <p>The first card is the point worth defending, and it is measured: Parasuraman &amp; Manzey, <em>Human Factors</em> 52(3) 381&ndash;410 (2010), a review integrating the empirical work on automation complacency. Two verbatim conclusions: complacency "is found in both inexperienced and expert participants and is not overcome by simple practice", and automation bias "is not prevented by training or by instructions". Put plainly in the room: experience does not protect you, and telling people to be careful is not a control. The remedy is not good intentions, it is design &mdash; the guardrail tiers from module 4.</p>
      <p>The classic, to be offered as an argument and not as a measurement: Bainbridge, <em>Ironies of Automation</em>, <em>Automatica</em> 19(6) 775&ndash;779 (1983). The more reliable the automation, the less practised the operator stays at taking over precisely when they must. And vigilance cannot be intermittent: success on one task does not license trust on the next, because the boundary between them is declared nowhere.</p>
      <p>The third card is the good news, and it should not be inflated. What is measured is that those who trusted less and worked on their phrasing got better results (Perry et al., CCS 2023), and that with AI the cognitive work does not vanish but shifts towards verification and oversight (Lee et al., CHI 2025). That this builds expertise over time is not established and should not be promised. What is promised is the posture &mdash; asking "what is missing" and "argue the opposite" instead of "confirm this" &mdash; the same operating rule dictated on the user slide.</p>
      <p>The point lands best with their own client in mind: responsibility towards whoever receives the signed document is not delegated to a model, neither legally nor reputationally. The expert has just overturned it live: point at that moment, do not re-explain it.</p>
    </aside>
  </section>

  <section data-nid="05-risks-judgement#7" data-min="1" data-background-color="#fbfaf6">
    <h2>Where we landed</h2>
    <div class="recap-chain compact">
      <div class="step"><strong>1</strong><span>predicts the next word</span></div>
      <div class="step"><strong>2</strong><span>inside or around</span></div>
      <div class="step"><strong>3</strong><span>anchor it to the documents</span></div>
      <div class="step"><strong>4</strong><span>write the rules, then verify</span></div>
      <div class="step"><strong>5</strong><span>understand, challenge, overturn</span></div>
    </div>
    <div class="quote-strip" style="grid-template-columns:1fr;">
      <blockquote>&ldquo;You can outsource your thinking, but you cannot outsource your understanding.&rdquo;<cite>a tweet Karpathy keeps quoting &mdash; AI Ascent (2026)</cite></blockquote>
    </div>
    <div class="signal-card card-wide" style="--card-accent:var(--ait-green);">
      <h4>The question</h4>
      <p>&ldquo;One concrete thing you will do in the next 30 days applying what you learned today.&rdquo;</p>
    </div>
    <div class="takeaway">Underneath it is probability. In a person's hands it is a tool. The hard part is judgement.</div>
    <aside class="notes">
      <p>The chain is the last thing they read: read it aloud, one link at a time, without commentary. Link 4 says "then verify" and not "then let it act" on purpose &mdash; it is the conclusion module 4 actually ends on. Link 5 is the previous slide's test, word for word.</p>
      <p>Attribution matters: Karpathy says explicitly that the line is a tweet he is quoting, not a formula of his own. Practising source hygiene on the final slide is worth ten recommendations.</p>
      <p>Then the commitment question, which is why it is written on screen: the wording is identical to Q6.1 of the exit questionnaire, and it is the field the three-month follow-up rests on. <strong>It gets written, not said.</strong> A commitment spoken in the room leaves no trace; a written one does, and in three months it can be asked about.</p>
      <p>Two postures, worth naming only if time is left (Mollick, from the BCG study): centaur, with the work divided along a clean line; cyborg, with the exchange happening at every step.</p>
    </aside>
  </section>

</section>

    <h1>What else is out there</h1>

      <p>Watch the arithmetic: the run-sheet costs this tour at 12 minutes (2+3+2+5), while the cover table gives the closing block 8, questions included. So it starts already knowing what gets cut. Cut order: Claude Code first, then Dispatch, then Claude Design. Grill&rarr;MVP is not cut: if time is short, skip the whole tour and keep only that.</p>

  <section data-nid="06-closing#1">
    <h2>Three surfaces, the same loop</h2>
    <div class="cols c-3">
      <div class="signal-card" style="--card-accent:var(--ait-violet);">
        <h4>Claude Code</h4>
        <p>Window, parallel sessions, diff review. The same loop as Module 4 on a different surface.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-cyan);">
        <h4>Claude Design</h4>
        <p>From a written page to an exportable file. A useful artefact in minutes.</p>
      </div>
      <div class="signal-card" style="--card-accent:var(--ait-amber);">
        <h4>Dispatch</h4>
        <p>Launch from a phone a task that runs on the office computer. Autonomy on a leash.</p>

    <h1>Come la macchina fabbrica le parole</h1>
    <p class="lede">Un'idea del 1948, eseguita su scala industriale.</p>
    <aside class="notes">
      <p>La tesi del modulo: l'idea dietro i modelli linguistici è del 1948. Quello che è cambiato da allora sono scala, dati e architettura.</p>

  <section data-nid="01-words#1" data-min="2">
    <h2>1948 &mdash; il linguaggio come gioco di probabilit&agrave;</h2>
    <div class="cols top">
      <div class="col stack-sm">
        <ul class="slide-list">
          <li><strong>Shannon</strong>: il testo &egrave; una sorgente che emette simboli con una probabilit&agrave;.</li>
          <li>Campionando da quelle statistiche si ottengono frasi che <strong>suonano inglesi e non dicono nulla</strong>.</li>
          <li><strong>1951</strong>: misura quanto &egrave; prevedibile l'inglese &mdash; <strong>0,6&ndash;1,3 bit per lettera</strong>.</li>
          <li>Un LLM stima la stessa distribuzione: <strong>appresa</strong>, non contata a mano.</li>
        </ul>
      </div>
      <div class="col stack-sm">
        <div class="quote-strip single sample">
          <blockquote>THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS THAT THE TIME OF WHO EVER TOLD THE PROBLEM FOR AN UNEXPECTED.
            <cite>Testo generato da Shannon nel 1948 campionando le statistiche di coppie di parole.</cite>
          </blockquote>
        </div>
        <figure class="portrait">
          <img src="assets/img/shannons.png" alt="Claude Shannon con Betty Moore Shannon">
          <figcaption>Claude Shannon con Betty Moore Shannon, analista numerica ai Bell Labs.</figcaption>
        </figure>
      </div>
    </div>
    <div class="takeaway">Fluente e vuoto: la macchina lo faceva gi&agrave; nel 1948.</div>
    <aside class="notes">
      <p>Il campione del 1948 va letto ad alta voce: suona inglese e non dice niente. È l'antenato letterale dell'allucinazione, e ci si torna nel modulo 5.</p>
      <p>Un modello linguistico è un enorme stimatore appreso della stessa distribuzione. Tutto il resto — memoria, strumenti, regole — è ingegneria costruita attorno a questa singola operazione.</p>
      <p><strong>Approfondimento.</strong> Shannon (1948), <em>A Mathematical Theory of Communication</em>, per le approssimazioni all'inglese; Shannon (1951), <em>Prediction and Entropy of Printed English</em>, per la misura di 0,6&ndash;1,3 bit per lettera con cento lettere di contesto. È l'unico numero del modulo che vale la pena dire ad alta voce. La formula resta fuori dalla slide di proposito: ci pensa il widget due slide più avanti.</p>
    </aside>
  </section>

    <aside class="notes">
      <p>Due minuti, non di più: la timeline è una lista di scelte tecniche, non un racconto. Le tre fermate che contano:</p>
      <p><strong>2013 (Mikolov)</strong> &mdash; le parole diventano vettori, e la vicinanza nello spazio è somiglianza di significato. È lo stesso meccanismo che ritorna nel modulo 3 quando si parla di recupero.<br>
      <strong>2017 (Vaswani)</strong> &mdash; l'attenzione permette di confrontare ogni parola con ogni altra in parallelo, ed è questo che rende praticabile l'addestramento su larga scala. L'encoder-decoder non si apre.<br>
      <strong>2022 (Ouyang, InstructGPT)</strong> &mdash; l'addestramento con feedback umano aggiunge il seguire istruzioni al semplice completare il testo. È la differenza fra un modello che continua una frase e l'assistente che si usa tutti i giorni, ed è il motivo per cui il modulo 4 funziona.</p>
      <p><strong>Fonti.</strong> Mikolov (2013); Vaswani (2017); Brown (2020); Ouyang (2022).</p>
