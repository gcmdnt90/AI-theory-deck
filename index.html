timana\nspecifica di prova: SPC-2026-082, revisione da confermare\nprove eseguite: 10 su 12\nprova 9 (fine corsa asse Z): non superata, ripetuta e superata al secondo tentativo\nprova 12 (ciclo continuo 2 h): interrotta dopo 40 minuti, causa non annotata\ncodice articolo PLC: ?\nblocco di libreria usato: MC_MoveAbsolute (PLCopen)\ntempo ciclo misurato: 17,5 s contro 17,8 s a contratto\nfunzione di sicurezza porta: verificata a vista dall'operatore\npunti aperti: 2, categoria non annotata\nfirma del cliente: il capo reparto è andato via prima della fine\nesito complessivo: da assegnare\n","demo/catena/d1-bozze.md":"---\ncatena: D1\nprodotto_da: D1\nconsumato_da: D2, D4\nfile: d1-bozze.md\ngenerato: 2026-09-03\n---\n\n# D1 — Quattro bozze della stessa scheda di collaudo\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 1. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Stesso prompt, quattro esecuzioni: due strumenti, una rigenerazione ciascuno. Nessuna regola permanente attiva. Fonte: `demo/m4-grezzi.md` — appunti grezzi di **CEL-39**.\n\nLe quattro bozze sono leggibili, professionali e pronte da consegnare.\nNessuna delle quattro dichiara che cosa ha inventato.\n\n## Bozza 1 — ChatGPT\n\n- **codice articolo del PLC:** 6ES7214-1AG40-0XB0\n- **revisione della specifica di prova:** rev. A\n- **tipo di collaudo:** FAT (in fabbrica)\n- **classe di esito:** CE-1\n- macchina: Cella di asservimento torni\n- software: PLC/HMI V3.7.4, consegnato a inizio settimana\n- specifica di prova: SPC-2026-082\n\n## Bozza 2 — ChatGPT (rigenerato)\n\n- **codice articolo del PLC:** 6ES7516-3AN02-0AB0\n- **revisione della specifica di prova:** rev. 01\n- **tipo di collaudo:** SAT (in sito)\n- **classe di esito:** CE-2\n- macchina: Cella di asservimento torni\n- software: PLC/HMI V3.7.4, consegnato a inizio settimana\n- specifica di prova: SPC-2026-082\n\n## Bozza 3 — Claude\n\n- **codice articolo del PLC:** 6ES7215-1AG40-0XB0\n- **revisione della specifica di prova:** rev. C\n- **tipo di collaudo:** collaudo funzionale\n- **classe di esito:** CE-2\n- macchina: Cella di asservimento torni\n- software: PLC/HMI V3.7.4, consegnato a inizio settimana\n- specifica di prova: SPC-2026-082\n\n## Bozza 4 — Claude (rigenerato)\n\n- **codice articolo del PLC:** 6ES7513-1AL02-0AB0\n- **revisione della specifica di prova:** rev. B\n- **tipo di collaudo:** FAT (in fabbrica)\n- **classe di esito:** CE-1\n- macchina: Cella di asservimento torni\n- software: PLC/HMI V3.7.4, consegnato a inizio settimana\n- specifica di prova: SPC-2026-082\n\n## Che cosa non era negli appunti\n\n| campo | negli appunti | bozza 1 | bozza 2 | bozza 3 | bozza 4 |\n|---|---|---|---|---|---|\n| codice articolo del PLC | *vuoto* | 6ES7214-1AG40-0XB0 | 6ES7516-3AN02-0AB0 | 6ES7215-1AG40-0XB0 | 6ES7513-1AL02-0AB0 |\n| revisione della specifica di prova | *vuoto* | rev. A | rev. 01 | rev. C | rev. B |\n| tipo di collaudo | *vuoto* | FAT (in fabbrica) | SAT (in sito) | collaudo funzionale | FAT (in fabbrica) |\n| classe di esito | *vuoto* | CE-1 | CE-2 | CE-2 | CE-1 |\n\n**Il valore vero,** per chi lo può verificare: codice articolo del PLC = `6ES7516-6HG40-0AB0`, revisione della specifica di prova = `SPC-2026-082 rev. B`, tipo di collaudo = `FAT (in fabbrica)`, classe di esito = `CE-3`.\n\nQuattro esecuzioni, quattro valori diversi, nessun avviso. Questo file è il riferimento «senza regole» del modulo 4: non va rieseguito, va riaperto.\n","demo/catena/d2-criteri.md":"---\ncatena: D2\nprodotto_da: D2\nconsumato_da: D3, D4\nfile: d2-criteri.md\ngenerato: 2026-09-03\n---\n\n# D2 — I criteri, come li scrive il modello\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 2. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Le quattro bozze di `d1-bozze.md` date da giudicare allo stesso modello a due livelli di capacità, poi con il ragionamento esteso acceso.\n\n## Giudizio del modello piccolo\n\n> La bozza 3 è la più completa e la più chiara. La consiglierei per la consegna: il linguaggio è professionale e tutti i campi risultano compilati.\n\nSceglie, non argomenta. «Tutti i campi risultano compilati» è vero e non significa nulla: sono compilati perché sono stati inventati.\n\n## Giudizio del modello grande, ragionamento esteso\n\n> Le quattro bozze divergono su quattro campi. Prima di scegliere serve stabilire che cosa rende accettabile una scheda di collaudo. I criteri che userei:\n\n1. ogni campo compilato deve essere tracciabile a un dato in ingresso\n2. un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n3. le unità di misura vanno riportate accanto al valore\n4. i giudizi di sintesi vanno separati dai dati osservati\n5. la stessa domanda deve dare la stessa risposta a distanza di un'ora\n6. il documento deve dire chi lo ha redatto e quando\n7. chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Quello che non posso verificare: se esista un formato interno obbligatorio, quali campi la casa consideri non omissibili, e con quale scala si esprime l'esito.\n\n## Criteri accettati in aula\n\n_Da rivedere con la persona in aula: cancellare, aggiungere, riordinare. Questa lista entra in D3, dove si confronta con quello che i documenti dicono davvero._\n\n- [ ] ogni campo compilato deve essere tracciabile a un dato in ingresso\n- [ ] un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n- [ ] le unità di misura vanno riportate accanto al valore\n- [ ] i giudizi di sintesi vanno separati dai dati osservati\n- [ ] la stessa domanda deve dare la stessa risposta a distanza di un'ora\n- [ ] il documento deve dire chi lo ha redatto e quando\n- [ ] chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Per il formatore: i campi obbligatori scritti nel regolamento della casa sono **11**. La lista qui sopra ne indovina due o tre. Il resto è il salto del modulo 3.\n","demo/catena/d3-fonte.md":"---\ncatena: D3\nprodotto_da: D3\nconsumato_da: D4\nfile: d3-fonte.md\ngenerato: 2026-09-03\n---\n\n# D3 — Il criterio esiste già, ed è scritto\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 3. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La stessa domanda sui tre gradini della scala. Il gradino 1 non ha documenti, i gradini 2 e 3 hanno gli stessi file di `regole/`.\n\n## Gradino 1 — chat semplice, nessun documento\n\n> Nel collaudo di macchine automatiche si usano di norma le fasi FAT e SAT descritte dalla IEC 62381, con esito espresso come *passed / passed with deviations / failed* e una punch list allegata. La scheda riporta di solito identificativo della prova, criterio di accettazione, esito e firma delle parti.\n\nÈ la risposta più fluente delle tre, ed è quella sbagliata. È l'impianto normativo del settore, e non è sbagliato in generale. Semplicemente non è il vostro: la casa usa una scala interna a cinque livelli che nessun modello può conoscere, e i campi obbligatori sono undici, non quattro.\n\n## Gradini 2 e 3 — con i documenti della casa\n\nLa scala interna, dal documento:\n\n- **CE-1 — Collaudo chiuso**: Tutte le prove superate e tempo ciclo entro contratto.\n- **CE-2 — Chiuso con riserva**: Almeno il 90% delle prove superate, scostamenti annotati.\n- **CE-3 — Parziale**: Almeno l'80% delle prove superate: consegna condizionata.\n- **CE-4 — Incompleto**: Fra il 65% e l'80% delle prove: nuova sessione necessaria.\n- **CE-5 — Non concluso**: Meno del 65% delle prove eseguite: collaudo da rifare.\n\nI campi obbligatori, dal documento — sono 11:\n\n1. riferimento collaudo interno (formato CLD-<anno>-<numero>)\n2. tipo di collaudo: in fabbrica (FAT) o in sito (SAT)\n3. commessa e macchina\n4. riferimento e revisione della specifica di prova\n5. versione del software consegnata al collaudo\n6. codice articolo del PLC, oppure la dicitura NON DETERMINATO\n7. riferimento e versione del blocco di libreria usato\n8. prove eseguite sul totale, prove non superate e punti aperti con la loro categoria\n9. tempo ciclo misurato e tempo ciclo a contratto\n10. classe di esito della scala interna CE-1 / CE-5\n11. firma del tecnico e firma del cliente, oppure la dicitura FIRMA CLIENTE ASSENTE\n\n**Passaggio recuperato:** `regole/standard-collaudo.md`, sezioni 1 e 2 — più `regole/guida-scala-esito.md` per la regola del dubbio fra due livelli adiacenti.\n\n## Delta rispetto a D2\n\n| criterio inventato in D2 | c'è nei documenti? |\n|---|---|\n| tracciabilità del campo compilato | sì, in forma più dura: campo vuoto **o** dicitura esplicita |\n| unità di misura accanto al valore | sì, implicito nei campi obbligatori |\n| separare giudizi e dati osservati | sì, ed è una regola di redazione, non un consiglio |\n| stessa risposta a distanza di un'ora | no — non è un criterio della casa |\n| chi ha redatto e quando | sì, ed è obbligatorio |\n| la scala di esito | **no, e non era indovinabile** |\n| i campi non omissibili | **no, e non erano indovinabili** |\n\nIl modello aveva ragione su una parte, e le parti su cui aveva torto le avrebbe scritte con la stessa sicurezza.\n\n## Ramo morto\n\nLa domanda con le parole sbagliate (`m3-p5`) chiede una cosa che i documenti non coprono. Il recupero restituisce comunque i passaggi più vicini, e la risposta arriva lo stesso. Non produce niente per il modulo 4: serve solo a far vedere che *una risposta* non è *la risposta*.\n","demo/catena/d4-tabella.md":"---\ncatena: D4\nprodotto_da: D4\nconsumato_da: D5\nfile: d4-tabella.md\ngenerato: 2026-09-03\n---\n\n# D4 — La tabella delle schede di collaudo\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 4. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Prodotto dall'agente sulla cartella dei documenti, con le regole permanenti attive e i criteri dichiarati prima della generazione.\n\n| riferimento | commessa | macchina | prove eseguite | prove totali | tempo ciclo (s) | classe | operatore |\n|---|---|---|---|---|---|---|---|\n| CLD-2026-001 | RIE-89 | Linea di riempimento | 16 | 16 | 22.5 | CE-1 | R. Ceccoli |\n| CLD-2026-002 | RIE-50 | Linea di riempimento | 15 | 18 | 22.0 | CE-3 | R. Ceccoli |\n| CLD-2026-003 | CEL-77 | Cella di asservimento torni | 14 | 14 | 24.5 | CE-2 | N. Amati |\n| CLD-2026-004 | PAL-69 | Pallettizzatore a 4 assi | 10 | 12 | 18.6 | CE-3 | N. Amati |\n| CLD-2026-005 | SLD-73 | Isola di saldatura | 12 | 16 | 13.4 | CE-3 | N. Amati |\n| CLD-2026-006 | DEP-49 | Depallettizzatore a portale | 14 | 14 | 19.2 | CE-2 | N. Amati |\n| CLD-2026-007 | CEL-39 | Cella di asservimento torni | 10 | 12 | 17.5 | CE-3 | D. Muratori |\n| CLD-2026-008 | CEL-35 | Cella di asservimento torni | 11 | 14 | 21.5 | CE-4 | N. Amati |\n| CLD-2026-009 | SLD-74 | Isola di saldatura | 10 | 14 | 22.4 | CE-4 | R. Ceccoli |\n| CLD-2026-010 | PAL-42 | Pallettizzatore a 4 assi | 11 | 14 | 11.6 | CE-4 | R. Ceccoli |\n| CLD-2026-011 | PAL-19 | Pallettizzatore a 4 assi | 14 | 16 | 15.5 | CE-3 | N. Amati |\n| CLD-2026-012 | DEP-36 | Depallettizzatore a portale | 13 | 14 | 22.3 | CE-2 | R. Ceccoli |\n\n**Campi lasciati vuoti dalle regole permanenti:** i campi non ricavabili dai documenti portano la dicitura DA VERIFICARE e non un valore.\n\n> Per il formatore: **una riga di questa tabella è sbagliata** e non è segnalata. Vedi `LEGGIMI-CATENA.md`. È il fallimento voluto n. 2: si coglie in pubblico, aprendo il documento di origine accanto a `_perito/ground-truth.csv`.\n","demo/catena/d5-verifiche-umane.md":"---\ncatena: D5\nprodotto_da: D5\nconsumato_da: chiusura\nfile: d5-verifiche-umane.md\ngenerato: 2026-09-03\n---\n\n# D5 — Che cosa deve controllare una persona\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 5. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La lista è il collaudo del collaudo: quello che resta in capo a chi firma, dopo che tutto il resto è stato automatizzato.\n\n## Prima che il documento esca\n\n- [ ] il codice articolo del PLC contro la targhetta o la distinta, mai contro la memoria del modello\n- [ ] la revisione della specifica di prova contro il documento firmato\n- [ ] la classe di esito ricalcolata a mano sul rapporto prove eseguite / prove totali\n- [ ] il tempo ciclo misurato contro quello a contratto, con l'unità di misura\n- [ ] la presenza della firma del cliente, o della dicitura che ne dichiara l'assenza\n- [ ] che nessuna dichiarazione su funzioni di sicurezza o conformità CE sia finita nel testo\n\n## Perché queste e non altre\n\n| visto in aula | che cosa insegna |\n|---|---|\n| quattro bozze, quattro valori diversi (D1) | la fluidità non è accuratezza |\n| il modello non conosceva la scala interna (D3) | senza documenti risponde con la media del settore |\n| le regole in prosa non hanno bloccato la richiesta (D4) | i limiti duri stanno fuori dal modello |\n| una riga sbagliata su dodici (D4) | il controllo va fatto contro la fonte, non contro il risultato |\n| il documento avvelenato (D5-B) | testo e istruzioni arrivano dallo stesso canale |\n| l'attribuzione a freddo smontata (D5-C) | la sicurezza dichiarata non è una misura di affidabilità |\n\n## Che cosa resta in mano\n\n1. le regole permanenti scritte in aula\n2. la tabella prodotta dall'agente, con una riga da correggere\n3. questa lista\n"},"fotovoltaico":{"demo/m2-cinque-attributi.md":"# Scheda 001 — cinque attributi\n\nDa incollare al posto di `[INCOLLA 5 ATTRIBUTI]` in `m2-p1`.\n\n- Potenza: 39.0 kWp\n- Energia prodotta: 4758 kWh\n- Ore equivalenti: 122.0 h\n- Performance ratio: 76.7%\n- Classe di rendimento: RG-3 (Regolare)\n\n_Dati sintetici generati per formazione._\n","demo/m2-tre-candidati.md":"# Tre impianti per l'unico sopralluogo della settimana\n\nDa mostrare con `m2-p2`. I tre criteri sono quelli che il prompt nomina.\n\n| Candidato | Perdita di produzione | Urgenza del cliente | Distanza |\n|---|---|---|---|\n| Scheda 012 — Serra agricola, Borgo Maggiore | 1255 kWh | bassa | 48 km |\n| Scheda 009 — Tetto residenziale, Acquaviva | 764 kWh | alta | 24 km |\n| Scheda 011 — Copertura capannone, Domagnano | 67 kWh | alta | 7 km |\n\n_Dati sintetici generati per formazione._\n","demo/m4-grezzi.json":"{\n  \"impianto\": \"RSM-2026-007\",\n  \"mese\": \"agosto 2026\",\n  \"sito\": \"Serra agricola\",\n  \"citta\": \"Chiesanuova\",\n  \"potenza_kwp\": 15.1,\n  \"accumulo_kwh\": 0.0,\n  \"produzione_kwh\": 1843,\n  \"produzione_nota\": \"lettura di fine mese, contatore di scambio\",\n  \"irraggiamento_kwh_m2\": 182.2,\n  \"energia_immessa_kwh\": 500,\n  \"ore_equivalenti\": null,\n  \"performance_ratio\": null,\n  \"allarmi\": \"derating termico inverter\",\n  \"autoconsumo_percento\": \"circa 60, dichiarato dal cliente, non misurato\",\n  \"codice_pratica\": null,\n  \"classe_rendimento\": null\n}\n","demo/m4-grezzi.md":"Impianto RSM-2026-007 — agosto 2026\n\n15.1 kWp serra agricola, Chiesanuova\nproduzione del mese: 1843 kWh (lettura di fine mese, contatore di scambio)\nirraggiamento del mese da portale meteo: 182,2 kWh/m2\nenergia immessa in rete: 500 kWh\nore equivalenti: ?\nperformance ratio: da calcolare\nallarmi: derating termico inverter\nautoconsumo stimato dal cliente \"circa il 60%\", non misurato\npratica Ufficio Energia: da recuperare\nclasse di rendimento del mese: non assegnata\n","demo/catena/d1-bozze.md":"---\ncatena: D1\nprodotto_da: D1\nconsumato_da: D2, D4\nfile: d1-bozze.md\ngenerato: 2026-09-03\n---\n\n# D1 — Quattro bozze della stessa scheda di impianto\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 1. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Stesso prompt, quattro esecuzioni: due strumenti, una rigenerazione ciascuno. Nessuna regola permanente attiva. Fonte: `demo/m4-grezzi.md` — appunti grezzi di **RSM-2026-007**.\n\nLe quattro bozze sono leggibili, professionali e pronte da consegnare.\nNessuna delle quattro dichiara che cosa ha inventato.\n\n## Bozza 1 — ChatGPT\n\n- **codice pratica:** GSE-2026-0417\n- **performance ratio:** 81,4 %\n- **ore equivalenti:** 122\n- **classe di rendimento:** RG-2\n- mese: agosto 2026\n- sito: Serra agricola\n- citta: Chiesanuova\n- potenza kwp: 15.1\n- accumulo kwh: 0.0\n\n## Bozza 2 — ChatGPT (rigenerato)\n\n- **codice pratica:** PR-RSM-2026-88\n- **performance ratio:** 78,0 %\n- **ore equivalenti:** 118\n- **classe di rendimento:** RG-1\n- mese: agosto 2026\n- sito: Serra agricola\n- citta: Chiesanuova\n- potenza kwp: 15.1\n- accumulo kwh: 0.0\n\n## Bozza 3 — Claude\n\n- **codice pratica:** SM-FV-2026-114\n- **performance ratio:** 84,2 %\n- **ore equivalenti:** 130\n- **classe di rendimento:** RG-2\n- mese: agosto 2026\n- sito: Serra agricola\n- citta: Chiesanuova\n- potenza kwp: 15.1\n- accumulo kwh: 0.0\n\n## Bozza 4 — Claude (rigenerato)\n\n- **codice pratica:** GAUDI-4471902\n- **performance ratio:** 79,5 %\n- **ore equivalenti:** 121\n- **classe di rendimento:** RG-3\n- mese: agosto 2026\n- sito: Serra agricola\n- citta: Chiesanuova\n- potenza kwp: 15.1\n- accumulo kwh: 0.0\n\n## Che cosa non era negli appunti\n\n| campo | negli appunti | bozza 1 | bozza 2 | bozza 3 | bozza 4 |\n|---|---|---|---|---|---|\n| codice pratica | *vuoto* | GSE-2026-0417 | PR-RSM-2026-88 | SM-FV-2026-114 | GAUDI-4471902 |\n| performance ratio | *vuoto* | 81,4 % | 78,0 % | 84,2 % | 79,5 % |\n| ore equivalenti | *vuoto* | 122 | 118 | 130 | 121 |\n| classe di rendimento | *vuoto* | RG-2 | RG-1 | RG-2 | RG-3 |\n\n**Il valore vero,** per chi lo può verificare: codice pratica = `RSM-2026-007`, performance ratio = `67.0`, ore equivalenti = `122.1`, classe di rendimento = `RG-4`.\n\nQuattro esecuzioni, quattro valori diversi, nessun avviso. Questo file è il riferimento «senza regole» del modulo 4: non va rieseguito, va riaperto.\n","demo/catena/d2-criteri.md":"---\ncatena: D2\nprodotto_da: D2\nconsumato_da: D3, D4\nfile: d2-criteri.md\ngenerato: 2026-09-03\n---\n\n# D2 — I criteri, come li scrive il modello\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 2. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Le quattro bozze di `d1-bozze.md` date da giudicare allo stesso modello a due livelli di capacità, poi con il ragionamento esteso acceso.\n\n## Giudizio del modello piccolo\n\n> La bozza 3 è la più completa e la più chiara. La consiglierei per la consegna: il linguaggio è professionale e tutti i campi risultano compilati.\n\nSceglie, non argomenta. «Tutti i campi risultano compilati» è vero e non significa nulla: sono compilati perché sono stati inventati.\n\n## Giudizio del modello grande, ragionamento esteso\n\n> Le quattro bozze divergono su quattro campi. Prima di scegliere serve stabilire che cosa rende accettabile una scheda di impianto. I criteri che userei:\n\n1. ogni campo compilato deve essere tracciabile a un dato in ingresso\n2. un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n3. le unità di misura vanno riportate accanto al valore\n4. i giudizi di sintesi vanno separati dai dati osservati\n5. la stessa domanda deve dare la stessa risposta a distanza di un'ora\n6. il documento deve dire chi lo ha redatto e quando\n7. chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Quello che non posso verificare: se esista un formato interno obbligatorio, quali campi la casa consideri non omissibili, e con quale scala si esprime l'esito.\n\n## Criteri accettati in aula\n\n_Da rivedere con la persona in aula: cancellare, aggiungere, riordinare. Questa lista entra in D3, dove si confronta con quello che i documenti dicono davvero._\n\n- [ ] ogni campo compilato deve essere tracciabile a un dato in ingresso\n- [ ] un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n- [ ] le unità di misura vanno riportate accanto al valore\n- [ ] i giudizi di sintesi vanno separati dai dati osservati\n- [ ] la stessa domanda deve dare la stessa risposta a distanza di un'ora\n- [ ] il documento deve dire chi lo ha redatto e quando\n- [ ] chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Per il formatore: i campi obbligatori scritti nel regolamento della casa sono **8**. La lista qui sopra ne indovina due o tre. Il resto è il salto del modulo 3.\n","demo/catena/d3-fonte.md":"---\ncatena: D3\nprodotto_da: D3\nconsumato_da: D4\nfile: d3-fonte.md\ngenerato: 2026-09-03\n---\n\n# D3 — Il criterio esiste già, ed è scritto\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 3. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La stessa domanda sui tre gradini della scala. Il gradino 1 non ha documenti, i gradini 2 e 3 hanno gli stessi file di `regole/`.\n\n## Gradino 1 — chat semplice, nessun documento\n\n> Il rendimento di un impianto fotovoltaico si esprime con il performance ratio definito dalla IEC 61724-1, di norma con soglie indicative attorno all'80 % per impianti in buono stato, e la scheda riporta produzione, irraggiamento, ore equivalenti e fermi.\n\nÈ la risposta più fluente delle tre, ed è quella sbagliata. È la definizione di riferimento del settore, e non è sbagliata in generale. Semplicemente non è la vostra: la casa usa una scala interna a cinque livelli con soglie proprie, e la pratica sammarinese non è quella italiana.\n\n## Gradini 2 e 3 — con i documenti della casa\n\nLa scala interna, dal documento:\n\n- **RG-1 — Eccellente**: Performance ratio pari o superiore all'87%: impianto al di sopra dell'atteso.\n- **RG-2 — Buono**: Performance ratio fra 80% e 87%: nessun intervento necessario.\n- **RG-3 — Regolare**: Performance ratio fra 73% e 80%: da tenere sotto osservazione.\n- **RG-4 — Sotto soglia**: Performance ratio fra 66% e 73%: sopralluogo da programmare.\n- **RG-5 — Fuori specifica**: Performance ratio inferiore al 66%: intervento entro il mese.\n\nI campi obbligatori, dal documento — sono 8:\n\n1. riferimento impianto interno (formato RSM-<anno>-<numero>)\n2. potenza in kWp con una cifra decimale, e presenza o assenza di accumulo\n3. matricola del contatore di scambio\n4. irraggiamento del mese sul piano dei moduli in kWh/m2\n5. energia prodotta nel mese in kWh, energia immessa in rete e ore equivalenti\n6. performance ratio misurato, con una cifra decimale\n7. classe di rendimento della scala interna RG-1 / RG-5\n8. numero di pratica dell'Ufficio Energia, oppure la dicitura NON DETERMINATO\n\n**Passaggio recuperato:** `regole/istruzione-monitoraggio.md`, sezioni 1 e 2 — più `regole/guida-scala-rendimento.md` per la regola del dubbio fra due livelli adiacenti.\n\n## Delta rispetto a D2\n\n| criterio inventato in D2 | c'è nei documenti? |\n|---|---|\n| tracciabilità del campo compilato | sì, in forma più dura: campo vuoto **o** dicitura esplicita |\n| unità di misura accanto al valore | sì, implicito nei campi obbligatori |\n| separare giudizi e dati osservati | sì, ed è una regola di redazione, non un consiglio |\n| stessa risposta a distanza di un'ora | no — non è un criterio della casa |\n| chi ha redatto e quando | sì, ed è obbligatorio |\n| la scala di esito | **no, e non era indovinabile** |\n| i campi non omissibili | **no, e non erano indovinabili** |\n\nIl modello aveva ragione su una parte, e le parti su cui aveva torto le avrebbe scritte con la stessa sicurezza.\n\n## Ramo morto\n\nLa domanda con le parole sbagliate (`m3-p5`) chiede una cosa che i documenti non coprono. Il recupero restituisce comunque i passaggi più vicini, e la risposta arriva lo stesso. Non produce niente per il modulo 4: serve solo a far vedere che *una risposta* non è *la risposta*.\n","demo/catena/d4-tabella.md":"---\ncatena: D4\nprodotto_da: D4\nconsumato_da: D5\nfile: d4-tabella.md\ngenerato: 2026-09-03\n---\n\n# D4 — La tabella delle schede di impianto\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 4. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Prodotto dall'agente sulla cartella dei documenti, con le regole permanenti attive e i criteri dichiarati prima della generazione.\n\n| riferimento | sito | produzione (kWh) | performance ratio (%) | classe | operatore |\n|---|---|---|---|---|---|\n| RSM-2026-001 | Tetto residenziale | 4758 | 76.7 | RG-3 | F. Guidi |\n| RSM-2026-002 | Serra agricola | 811 | 62.0 | RG-5 | A. Renzi |\n| RSM-2026-003 | Pensilina parcheggio | 1834 | 74.0 | RG-3 | S. Pari |\n| RSM-2026-004 | Tetto condominio | 1209 | 78.1 | RG-3 | A. Renzi |\n| RSM-2026-005 | Serra agricola | 2821 | 63.7 | RG-4 | M. Casali |\n| RSM-2026-006 | Copertura capannone | 4889 | 73.2 | RG-3 | A. Renzi |\n| RSM-2026-007 | Serra agricola | 1843 | 67.0 | RG-4 | A. Renzi |\n| RSM-2026-008 | Copertura capannone | 2903 | 69.3 | RG-4 | S. Pari |\n| RSM-2026-009 | Tetto residenziale | 4788 | 62.5 | RG-5 | F. Guidi |\n| RSM-2026-010 | Tetto condominio | 4655 | 83.9 | RG-2 | S. Pari |\n| RSM-2026-011 | Copertura capannone | 2977 | 89.2 | RG-1 | F. Guidi |\n| RSM-2026-012 | Serra agricola | 7285 | 85.6 | RG-2 | M. Casali |\n\n**Campi lasciati vuoti dalle regole permanenti:** i campi non ricavabili dai documenti portano la dicitura DA VERIFICARE e non un valore.\n\n> Per il formatore: **una riga di questa tabella è sbagliata** e non è segnalata. Vedi `LEGGIMI-CATENA.md`. È il fallimento voluto n. 2: si coglie in pubblico, aprendo il documento di origine accanto a `_perito/ground-truth.csv`.\n","demo/catena/d5-verifiche-umane.md":"---\ncatena: D5\nprodotto_da: D5\nconsumato_da: chiusura\nfile: d5-verifiche-umane.md\ngenerato: 2026-09-03\n---\n\n# D5 — Che cosa deve controllare una persona\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 5. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La lista è il collaudo del collaudo: quello che resta in capo a chi firma, dopo che tutto il resto è stato automatizzato.\n\n## Prima che il documento esca\n\n- [ ] il codice pratica contro il fascicolo, mai contro la memoria del modello\n- [ ] la lettura di produzione contro il contatore, quando è annotata come di fine mese\n- [ ] il performance ratio ricalcolato a mano su produzione e irraggiamento\n- [ ] l'autoconsumo: se è dichiarato dal cliente e non misurato, resta dichiarato\n- [ ] la classe di rendimento riassegnata dal tecnico\n- [ ] che nessun riferimento a incentivi italiani sia finito in una pratica sammarinese\n\n## Perché queste e non altre\n\n| visto in aula | che cosa insegna |\n|---|---|\n| quattro bozze, quattro valori diversi (D1) | la fluidità non è accuratezza |\n| il modello non conosceva la scala interna (D3) | senza documenti risponde con la media del settore |\n| le regole in prosa non hanno bloccato la richiesta (D4) | i limiti duri stanno fuori dal modello |\n| una riga sbagliata su dodici (D4) | il controllo va fatto contro la fonte, non contro il risultato |\n| il documento avvelenato (D5-B) | testo e istruzioni arrivano dallo stesso canale |\n| l'attribuzione a freddo smontata (D5-C) | la sicurezza dichiarata non è una misura di affidabilità |\n\n## Che cosa resta in mano\n\n1. le regole permanenti scritte in aula\n2. la tabella prodotta dall'agente, con una riga da correggere\n3. questa lista\n"},"numismatica":{"demo/m2-cinque-attributi.md":"# Lotto 004 — cinque attributi\n\nDa incollare al posto di `[INCOLLA 5 ATTRIBUTI]` in `m2-p1`.\n\n- Metallo: Argento\n- Peso: 3.43 g\n- Conservazione: SM-1 (Eccezionale)\n- Rarità: NC — non comune\n- Domanda attesa: media\n\n_Dati sintetici generati per formazione._\n","demo/m2-tre-candidati.md":"# Tre lotti per la copertina\n\nDa mostrare con `m2-p2`. Il regolamento (3.3) esclude gli SM-5 dalla copertina: i tre candidati sono già filtrati.\n\n| Candidato | Rarità | Conservazione | Domanda attesa |\n|---|---|---|---|\n| Lotto 001 — Antoniniano | R2 — molto rara | SM-3 (Buona) | alta |\n| Lotto 006 — Antoniniano | R — rara | SM-1 (Eccezionale) | bassa |\n| Lotto 004 — Denario | NC — non comune | SM-1 (Eccezionale) | media |\n\n_Dati sintetici generati per formazione._\n","demo/m4-grezzi.json":"{\n  \"asta\": \"Asta 42\",\n  \"lotto\": 7,\n  \"metallo\": \"Oro\",\n  \"peso_g\": 3.45,\n  \"peso_nota\": \"bilancia da banco, da ricontrollare\",\n  \"diametro_mm\": 19.2,\n  \"dritto\": \"Busto mitrato a destra\",\n  \"rovescio\": \"Cristo benedicente entro mandorla\",\n  \"conservazione_nota\": \"Buona\",\n  \"riferimento_bibliografico\": null,\n  \"asse_di_conio\": null,\n  \"provenienza\": \"PROVENIENZA NON DOCUMENTATA\",\n  \"zecca\": null,\n  \"anno\": null\n}\n","demo/m4-grezzi.md":"Asta 42 — lotto 07\n\nducato oro\npeso 3,45 g (bilancia da banco, da ricontrollare)\ndiametro ~19 mm\nasse di conio: non rilevato\ndritto: busto mitrato a destra, legenda parzialmente leggibile\nrovescio: cristo benedicente entro mandorla\nconservazione: buona, rilievi ancora netti sui punti alti\nriferimento bibliografico: ?\nprovenienza non documentata\nzecca e anno: non determinati\n","demo/catena/d1-bozze.md":"---\ncatena: D1\nprodotto_da: D1\nconsumato_da: D2, D4\nfile: d1-bozze.md\ngenerato: 2026-09-03\n---\n\n# D1 — Quattro bozze della stessa scheda di catalogo\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 1. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Stesso prompt, quattro esecuzioni: due strumenti, una rigenerazione ciascuno. Nessuna regola permanente attiva. Fonte: `demo/m4-grezzi.md` — appunti grezzi di **7**.\n\nLe quattro bozze sono leggibili, professionali e pronte da consegnare.\nNessuna delle quattro dichiara che cosa ha inventato.\n\n## Bozza 1 — ChatGPT\n\n- **riferimento bibliografico:** CNI XII, 45\n- **zecca:** Roma\n- **asse di conio:** ore 6\n- **conservazione:** SM-2\n- asta: Asta 42\n- metallo: Oro\n- peso g: 3.45\n- peso nota: bilancia da banco, da ricontrollare\n- diametro mm: 19.2\n\n## Bozza 2 — ChatGPT (rigenerato)\n\n- **riferimento bibliografico:** MIR 1042\n- **zecca:** Milano\n- **asse di conio:** ore 12\n- **conservazione:** SM-1\n- asta: Asta 42\n- metallo: Oro\n- peso g: 3.45\n- peso nota: bilancia da banco, da ricontrollare\n- diametro mm: 19.2\n\n## Bozza 3 — Claude\n\n- **riferimento bibliografico:** Biaggi 2231\n- **zecca:** Venezia\n- **asse di conio:** ore 6\n- **conservazione:** SM-2\n- asta: Asta 42\n- metallo: Oro\n- peso g: 3.45\n- peso nota: bilancia da banco, da ricontrollare\n- diametro mm: 19.2\n\n## Bozza 4 — Claude (rigenerato)\n\n- **riferimento bibliografico:** MEC 14, 812\n- **zecca:** Napoli\n- **asse di conio:** ore 9\n- **conservazione:** SM-3\n- asta: Asta 42\n- metallo: Oro\n- peso g: 3.45\n- peso nota: bilancia da banco, da ricontrollare\n- diametro mm: 19.2\n\n## Che cosa non era negli appunti\n\n| campo | negli appunti | bozza 1 | bozza 2 | bozza 3 | bozza 4 |\n|---|---|---|---|---|---|\n| riferimento bibliografico | *vuoto* | CNI XII, 45 | MIR 1042 | Biaggi 2231 | MEC 14, 812 |\n| zecca | *vuoto* | Roma | Milano | Venezia | Napoli |\n| asse di conio | *vuoto* | ore 6 | ore 12 | ore 6 | ore 9 |\n| conservazione | *vuoto* | SM-2 | SM-1 | SM-2 | SM-3 |\n\n**Il valore vero,** per chi lo può verificare: riferimento bibliografico = `Paolucci 413`, zecca = `Venezia`, asse di conio = `ore 7`, conservazione = `SM-3`.\n\nQuattro esecuzioni, quattro valori diversi, nessun avviso. Questo file è il riferimento «senza regole» del modulo 4: non va rieseguito, va riaperto.\n","demo/catena/d2-criteri.md":"---\ncatena: D2\nprodotto_da: D2\nconsumato_da: D3, D4\nfile: d2-criteri.md\ngenerato: 2026-09-03\n---\n\n# D2 — I criteri, come li scrive il modello\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 2. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Le quattro bozze di `d1-bozze.md` date da giudicare allo stesso modello a due livelli di capacità, poi con il ragionamento esteso acceso.\n\n## Giudizio del modello piccolo\n\n> La bozza 3 è la più completa e la più chiara. La consiglierei per la consegna: il linguaggio è professionale e tutti i campi risultano compilati.\n\nSceglie, non argomenta. «Tutti i campi risultano compilati» è vero e non significa nulla: sono compilati perché sono stati inventati.\n\n## Giudizio del modello grande, ragionamento esteso\n\n> Le quattro bozze divergono su quattro campi. Prima di scegliere serve stabilire che cosa rende accettabile una scheda di catalogo. I criteri che userei:\n\n1. ogni campo compilato deve essere tracciabile a un dato in ingresso\n2. un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n3. le unità di misura vanno riportate accanto al valore\n4. i giudizi di sintesi vanno separati dai dati osservati\n5. la stessa domanda deve dare la stessa risposta a distanza di un'ora\n6. il documento deve dire chi lo ha redatto e quando\n7. chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Quello che non posso verificare: se esista un formato interno obbligatorio, quali campi la casa consideri non omissibili, e con quale scala si esprime l'esito.\n\n## Criteri accettati in aula\n\n_Da rivedere con la persona in aula: cancellare, aggiungere, riordinare. Questa lista entra in D3, dove si confronta con quello che i documenti dicono davvero._\n\n- [ ] ogni campo compilato deve essere tracciabile a un dato in ingresso\n- [ ] un campo non ricavabile dagli appunti va lasciato vuoto e segnalato, non stimato\n- [ ] le unità di misura vanno riportate accanto al valore\n- [ ] i giudizi di sintesi vanno separati dai dati osservati\n- [ ] la stessa domanda deve dare la stessa risposta a distanza di un'ora\n- [ ] il documento deve dire chi lo ha redatto e quando\n- [ ] chi firma deve poter rifare il calcolo senza rileggere gli appunti\n\n> Per il formatore: i campi obbligatori scritti nel regolamento della casa sono **7**. La lista qui sopra ne indovina due o tre. Il resto è il salto del modulo 3.\n","demo/catena/d3-fonte.md":"---\ncatena: D3\nprodotto_da: D3\nconsumato_da: D4\nfile: d3-fonte.md\ngenerato: 2026-09-03\n---\n\n# D3 — Il criterio esiste già, ed è scritto\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 3. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La stessa domanda sui tre gradini della scala. Il gradino 1 non ha documenti, i gradini 2 e 3 hanno gli stessi file di `regole/`.\n\n## Gradino 1 — chat semplice, nessun documento\n\n> Le case d'asta usano in genere le scale di conservazione internazionali (FDC, SPL, BB, MB) oppure la scala Sheldon a 70 punti dei servizi di grading americani, e la descrizione riporta dritto, rovescio, metallo, peso e riferimento di catalogo.\n\nÈ la risposta più fluente delle tre, ed è quella sbagliata. È il vocabolario del mestiere, e non è sbagliato in generale. Semplicemente non è il vostro: la casa usa una scala interna a cinque livelli che nessun modello può conoscere, e il regolamento impone campi che quelle scale non prevedono.\n\n## Gradini 2 e 3 — con i documenti della casa\n\nLa scala interna, dal documento:\n\n- **SM-1 — Eccezionale**: Rilievi integri, nessuna usura visibile a occhio nudo, patina originale intatta.\n- **SM-2 — Ottima**: Usura minima sui punti alti, legenda completamente leggibile.\n- **SM-3 — Buona**: Usura diffusa ma uniforme, legenda leggibile per almeno tre quarti.\n- **SM-4 — Modesta**: Rilievi appiattiti, legenda parzialmente illeggibile, possibili depositi.\n- **SM-5 — Da studio**: Identificabile ma fortemente compromessa: valore documentale, non collezionistico.\n\nI campi obbligatori, dal documento — sono 7:\n\n1. riferimento interno di lotto (formato ART-<anno>-<numero>)\n2. nominale, metallo e peso in grammi con due cifre decimali\n3. diametro in millimetri e asse di conio in ore\n4. grado di conservazione della scala interna SM-1 / SM-5\n5. autorità emittente, zecca e periodo, oppure la dicitura NON DETERMINATO\n6. riferimento bibliografico di catalogo (sigla e numero), oppure la dicitura NON DETERMINATO\n7. dichiarazione di provenienza, oppure la dicitura PROVENIENZA NON DOCUMENTATA\n\n**Passaggio recuperato:** `regole/regolamento-catalogazione.md`, sezioni 1 e 2 — più `regole/guida-scala-conservazione.md` per la regola del dubbio fra due livelli adiacenti.\n\n## Delta rispetto a D2\n\n| criterio inventato in D2 | c'è nei documenti? |\n|---|---|\n| tracciabilità del campo compilato | sì, in forma più dura: campo vuoto **o** dicitura esplicita |\n| unità di misura accanto al valore | sì, implicito nei campi obbligatori |\n| separare giudizi e dati osservati | sì, ed è una regola di redazione, non un consiglio |\n| stessa risposta a distanza di un'ora | no — non è un criterio della casa |\n| chi ha redatto e quando | sì, ed è obbligatorio |\n| la scala di esito | **no, e non era indovinabile** |\n| i campi non omissibili | **no, e non erano indovinabili** |\n\nIl modello aveva ragione su una parte, e le parti su cui aveva torto le avrebbe scritte con la stessa sicurezza.\n\n## Ramo morto\n\nLa domanda con le parole sbagliate (`m3-p5`) chiede una cosa che i documenti non coprono. Il recupero restituisce comunque i passaggi più vicini, e la risposta arriva lo stesso. Non produce niente per il modulo 4: serve solo a far vedere che *una risposta* non è *la risposta*.\n","demo/catena/d4-tabella.md":"---\ncatena: D4\nprodotto_da: D4\nconsumato_da: D5\nfile: d4-tabella.md\ngenerato: 2026-09-03\n---\n\n# D4 — La tabella delle schede di catalogo\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 4. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> Prodotto dall'agente sulla cartella dei documenti, con le regole permanenti attive e i criteri dichiarati prima della generazione.\n\n| riferimento | nominale | metallo | peso (g) | classe | operatore |\n|---|---|---|---|---|---|\n| ART-2026-001 | Antoniniano | Mistura | 2.96 | SM-3 | M. Bernardi |\n| ART-2026-002 | Sesterzio | Bronzo | 24.88 | SM-3 | L. Fabbri |\n| ART-2026-003 | Antoniniano | Mistura | 2.85 | SM-2 | L. Fabbri |\n| ART-2026-004 | Denario | Argento | 3.43 | SM-1 | L. Fabbri |\n| ART-2026-005 | Quattrino | Rame | 1.0 | SM-2 | L. Fabbri |\n| ART-2026-006 | Antoniniano | Mistura | 3.15 | SM-1 | M. Bernardi |\n| ART-2026-007 | Ducato | Oro | 3.45 | SM-3 | M. Bernardi |\n| ART-2026-008 | Antoniniano | Mistura | 3.88 | SM-3 | S. Zanetti |\n| ART-2026-009 | Grosso | Argento | 2.23 | SM-4 | S. Zanetti |\n| ART-2026-010 | Solido | Oro | 4.32 | SM-3 | M. Bernardi |\n| ART-2026-011 | Denario | Argento | 3.44 | SM-3 | S. Zanetti |\n| ART-2026-012 | Follis | Bronzo | 3.31 | SM-5 | M. Bernardi |\n\n**Campi lasciati vuoti dalle regole permanenti:** i campi non ricavabili dai documenti portano la dicitura DA VERIFICARE e non un valore.\n\n> Per il formatore: **una riga di questa tabella è sbagliata** e non è segnalata. Vedi `LEGGIMI-CATENA.md`. È il fallimento voluto n. 2: si coglie in pubblico, aprendo il documento di origine accanto a `_perito/ground-truth.csv`.\n","demo/catena/d5-verifiche-umane.md":"---\ncatena: D5\nprodotto_da: D5\nconsumato_da: chiusura\nfile: d5-verifiche-umane.md\ngenerato: 2026-09-03\n---\n\n# D5 — Che cosa deve controllare una persona\n\n> **Copia di riserva.** Prodotto in aula durante il modulo 5. Se l'esecuzione dal vivo è andata a buon fine, questo file va sostituito con quella; se non è andata, si apre questo e la catena prosegue.\n> La lista è il collaudo del collaudo: quello che resta in capo a chi firma, dopo che tutto il resto è stato automatizzato.\n\n## Prima che il documento esca\n\n- [ ] il riferimento bibliografico contro il repertorio cartaceo, mai contro la memoria del modello\n- [ ] la zecca e l'anno contro l'esemplare, o la dicitura NON DETERMINATO\n- [ ] il peso contro una seconda pesata, quando la prima è annotata come da ricontrollare\n- [ ] la conservazione riassegnata a vista dal perito\n- [ ] la provenienza: se non è documentata, resta non documentata\n- [ ] che nessuna stima di prezzo o attribuzione automatica sia finita nel testo\n\n## Perché queste e non altre\n\n| visto in aula | che cosa insegna |\n|---|---|\n| quattro bozze, quattro valori diversi (D1) | la fluidità non è accuratezza |\n| il modello non conosceva la scala interna (D3) | senza documenti risponde con la media del settore |\n| le regole in prosa non hanno bloccato la richiesta (D4) | i limiti duri stanno fuori dal modello |\n| una riga sbagliata su dodici (D4) | il controllo va fatto contro la fonte, non contro il risultato |\n| il documento avvelenato (D5-B) | testo e istruzioni arrivano dallo stesso canale |\n| l'attribuzione a freddo smontata (D5-C) | la sicurezza dichiarata non è una misura di affidabilità |\n\n## Che cosa resta in mano\n\n1. le regole permanenti scritte in aula\n2. la tabella prodotta dall'agente, con una riga da correggere\n3. questa lista\n"}}</script>

    (function () {

      var DEFAULT_LANG = 'it'; // change to 'en' to publish English by default
      var lang = (deckStore.get('deck-lang') || DEFAULT_LANG).toLowerCase();

      document.documentElement.lang = lang;

      var slides = document.querySelector('.reveal .slides');
      if (tpl && slides) slides.innerHTML = tpl.innerHTML;
      // Free the memory of both templates once the active one is live.
      var other = document.getElementById('deck-' + (lang === 'en' ? 'it' : 'en'));
      if (tpl) tpl.remove();

      document.addEventListener('DOMContentLoaded', function () {

        Array.prototype.forEach.call(btns, function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
